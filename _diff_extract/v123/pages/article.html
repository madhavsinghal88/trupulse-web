<!doctype html><html lang=\"en\"><head>\n<meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<script>\ndocument.addEventListener(\"click\", function (event) {\n  if (!event.target.closest) return;\n  var link = event.target.closest(\"[data-single-route]\");\n  if (link && window.parent !== window) {\n    event.preventDefault();\n    parent.postMessage({ type: \"trupulse-route\", route: link.dataset.singleRoute,\n      fragment: link.dataset.fragment || \"\", article: link.dataset.article || \"\" }, \"*\");\n    return;\n  }\n  /* In an about:srcdoc document a bare \"#section\" link has no base URL to\n     resolve against, so the browser resolves it against the PARENT url and\n     navigates the frame away from the site. Handle in-page anchors here too,\n     in the same capture-phase listener. */\n  var a = event.target.closest('a[href^=\"#\"]');\n  if (!a) return;\n  event.preventDefault();\n  var id = a.getAttribute(\"href\").slice(1);\n  if (!id || id === \"top\") { window.scrollTo({ top: 0, behavior: \"smooth\" }); return; }\n  var target = document.getElementById(id);\n  if (target) {\n    target.scrollIntoView({ behavior: \"smooth\", block: \"start\" });\n    if (target.hasAttribute(\"tabindex\") || /^(a|button|input|h[1-6])$/i.test(target.tagName)) target.focus({ preventScroll: true });\n  }\n}, true);\n<\/script>\n<title data-title>__ART_TITLE__<\/title><meta name=\"description\" content=\"__ART_DESC__\"><link rel=\"canonical\" href=\"__ART_URL__\"><meta property=\"og:type\" content=\"article\"><meta property=\"og:site_name\" content=\"TruPulse\"><meta property=\"og:url\" content=\"__ART_URL__\"><meta property=\"og:title\" content=\"__ART_OG_TITLE__\"><meta property=\"og:description\" content=\"__ART_DESC__\"><meta property=\"og:image\" content=\"https://www.trupulse.ai/og/share.png\"><meta property=\"og:image:width\" content=\"1200\"><meta property=\"og:image:height\" content=\"630\"><meta property=\"og:image:alt\" content=\"TruPulse — AI-powered research. Human insight.\"><meta name=\"twitter:image\" content=\"https://www.trupulse.ai/og/share.png\"><meta name=\"twitter:card\" content=\"summary_large_image\"><meta name=\"twitter:title\" content=\"__ART_OG_TITLE__\"><meta name=\"twitter:description\" content=\"__ART_DESC__\"><link rel=\"icon\" href=\"__ASSET0__\"><link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin><link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap\"><style>\n:root{\n  --ink:#110f35;--ink-2:#252259;--paper:#fffaf6;--white:#fff;--muted:#5b589d;\n  --line:#e0dfec;--coral:#EE851B;--coral-2:#EE851B;--violet:#433EB1;\n  --mint:#c9f5e9;--teal:#078b7c;--lilac:#ecebff;--sun:#ffd870;\n  --display:\"Plus Jakarta Sans\",\"Inter\",ui-sans-serif,system-ui,sans-serif;\n  --body:\"Inter\",ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  --shadow:0 28px 80px rgba(17, 15, 53,.12);--radius:28px;\n}\n\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth;scroll-padding-top:96px}\nbody{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.65;-webkit-font-smoothing:antialiased}\nbody.modal-open{overflow:hidden}\na{color:inherit;text-decoration:none}\nbutton,input,textarea{font:inherit}\nbutton{color:inherit}\nimg{display:block;max-width:100%}\n.shell{width:min(1280px,calc(100% - 40px));margin:auto}\n.article-hero h1{margin:0;font-family:var(--display);font-size:clamp(2.25rem,5vw,3rem);line-height:1.03;letter-spacing:-.055em}\n.btn{display:inline-flex;min-height:52px;padding:0 24px;align-items:center;justify-content:center;gap:10px;border:1px solid transparent;border-radius:999px;font-size:.875rem;font-weight:800;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease,background .2s ease}\n.btn:hover{transform:translateY(-2px)}\n.btn.primary{background:var(--coral);color:#fff;box-shadow:0 12px 24px rgba(238,133,27,.22)}\n.btn.primary:hover{background:#EE851B}\n/* Header */\n.logo{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-size:1rem;font-weight:900}\n/* Hero */\n/* Product */\n/* Workflow + report */\n/* Use cases */\n/* Proof + trust */\n/* Blogs */\n/* FAQ + CTA */\n\n\n/* Footer */\n.site-footer{padding:65px 0 28px;background:#0c0b2a;color:#fff}\n.footer-bottom{display:flex;margin-top:52px;padding-top:22px;border-top:1px solid rgba(255,255,255,.12);justify-content:space-between;color:#6e6bac;font-size:.75rem}\n/* Modal */\n\n\n/* Articles */\n.article-page{background:#fff}\n.article-header{position:relative;padding:28px 0;background:var(--paper)}\n.article-nav{display:flex;justify-content:space-between;align-items:center}\n.back-link{font-size:.75rem;font-weight:800}\n.article-hero{padding:90px 0 70px;background:var(--paper)}\n.article-hero-grid{display:grid;grid-template-columns:.94fr 1.06fr;gap:64px;align-items:center}\n.article-meta{color:var(--coral);font-size:.75rem;font-weight:850;letter-spacing:.11em;text-transform:uppercase}\n.article-hero h1{margin:18px 0 22px;font-size:clamp(2.25rem,5vw,3rem)}\n.article-deck{color:var(--muted);font-size:1rem}\n.article-banner{overflow:hidden;border-radius:30px;box-shadow:var(--shadow);aspect-ratio:16/9}\n.article-banner img{width:100%;height:100%;object-fit:cover}\n.article-layout{display:grid;grid-template-columns:240px minmax(0,700px);gap:90px;padding:80px 0 110px;justify-content:center}\n.article-aside{position:sticky;top:110px;align-self:start;padding:22px;border-left:2px solid var(--coral);font-size:.75rem}\n.article-aside strong{display:block;margin-bottom:8px}\n.article-aside a{display:block;margin:8px 0;color:var(--muted)}\n.article-body h2{margin:54px 0 14px;font-family:var(--display);font-size:2.25rem;line-height:1.12;letter-spacing:-.035em}\n.article-body h2:first-child{margin-top:0}\n.article-body p{margin:0 0 20px;color:#3f3c78;font-size:1rem;line-height:1.85}\n.article-quote{margin:38px 0;padding:28px;border-radius:20px;background:var(--lilac);font-family:var(--display);font-size:1.125rem;font-weight:750}\n.article-cta{margin-top:58px;padding:34px;border-radius:24px;background:var(--ink);color:#fff}\n.article-cta p{color:#c8c7e0}\n.article-cta .btn{margin-top:7px}\n\n\n@keyframes orbit{to{transform:rotate(360deg)}}\n@keyframes float{50%{transform:translateY(-9px)}}\n@keyframes progress{0%{width:0}65%{width:88%}100%{width:100%}}\n@keyframes story{0%,18%{transform:translateX(0);opacity:1}42%,100%{transform:translateX(18px);opacity:.32}}\n@keyframes metric{from{transform:scaleX(0)}}\n@keyframes fade{from{opacity:0}to{opacity:1}}\n\n@media(max-width:980px){.article-hero-grid{grid-template-columns:1fr}\n.article-layout{grid-template-columns:1fr;gap:35px}\n.article-aside{position:static}\n.article-aside a{display:inline;margin-right:12px}}\n\n@media(max-width:680px){.shell{width:min(100% - 26px,1280px)}\n.footer-bottom{gap:10px;flex-direction:column}\n.article-header{padding:18px 0}\n.article-nav .btn{display:none}\n.article-hero{padding:55px 0}\n.article-hero-grid{gap:32px}\n.article-layout{padding-top:55px}\n.article-body h2{font-size:1.5rem}}\n/* Consistent content hierarchy and corrected walkthrough control */\n\n@media(min-width:681px){.article-hero h1{font-size:clamp(2.25rem,5vw,3rem)}}\n\n@media(max-width:680px){.article-hero h1{font-size:clamp(2.25rem,9vw,3rem)}}\n\n/* ---- Reduce Motion: remove movement, keep the interface responsive ----\n   The old rule was transition:none on everything, which also removed the\n   colour and shadow feedback on buttons, tabs and links. Anyone with the\n   system setting on got a page where nothing answered them at all, and\n   hover transforms snapped instead of easing, which is worse than no\n   movement. Now: nothing travels, but colour, border, shadow and opacity\n   still respond. */\n@media(prefers-reduced-motion:reduce){\n  *{scroll-behavior:auto!important;animation:none!important}\n  *{transition:color .18s ease,background-color .18s ease,border-color .18s ease,box-shadow .18s ease,opacity .18s ease!important}\n  .reveal{opacity:1!important;transform:none!important}\n  .back-link:hover,.back-link:hover .back-arrow,\n  .blog-card:hover,.blog-card:hover img,\n  .blog-tile:hover,.blog-tile:hover .bc-action em,.blog-tile:hover .bc-media img,\n  .btn:hover,.case-study-link:hover span,\n  .chat-card-btn:hover,.chat-card-btn:hover i,.chat-chips button:hover,\n  .chat-launch:hover,.chat-send:not(:disabled):hover,.chat-threads button:hover,\n  [data-chat-close]:hover,\n  .faq-prompts button:hover,\n  .feature-rows li:hover>span,.feature-rows li:hover>div,\n  .flow-card:hover,.legal-back:hover,.login-back:hover,.login:hover,\n  .login-reset [data-reset-back]:hover .back-arrow,\n  .use-case-tab:hover,.video-slot-play:hover{transform:none!important}\n\n\n:focus-visible{outline:3px solid var(--violet);outline-offset:3px;border-radius:4px}}\n/* Final content interactions */\n\n\n/* Requested structural update */\n.brand-logo{display:flex;width:142px;height:45px;align-items:center}\n\n.brand-logo img{width:100%;height:100%;object-fit:contain;object-position:left center}\n\n@keyframes tab-progress{from{transform:scaleX(0)}to{transform:scaleX(1)}}\n\n.article-banner img{filter:none}\n\n@media(max-width:680px){.brand-logo{width:116px;height:37px}}\n\n.article-hero-grid{grid-template-columns:1fr;gap:42px}\n\n.article-hero-grid>.article-banner{grid-row:1}\n\n.article-hero-grid>div{grid-row:2;max-width:900px}\n\n.article-banner{width:100%;aspect-ratio:3/1;border-radius:28px}\n\n.article-hero h1{max-width:950px}\n\n@media(max-width:680px){.article-banner{aspect-ratio:16/9}\n.article-hero-grid{gap:28px}}\n\n\n/* Final typography, static media and hover system */\n.article-meta{font-family:var(--body)}\n\nh1,h2,h3,h4,.logo{font-family:var(--display)}\n\n.article-banner{background:#f0effa}\n/* Login route */\n/* Anonymous customer proof directly below the hero */\n/* Final alignment and motion refinements */\n\n.brand-logo{align-self:center}\n.brand-logo img{max-height:42px}\n\n@keyframes faq-answer-in{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}\n/* ---- Corrections ---- */\n/* Keyboard focus was invisible everywhere on the site. */\n:focus-visible{outline:3px solid var(--violet);outline-offset:3px;border-radius:4px}\n\n/* ---- Page gutter ----\n   Single source of truth for the side margin. Every horizontal container on every\n   page resolves against this token, so home, articles, login, terms and privacy all\n   align on the same edge. Change it here and the whole site follows. */\n:root{--page-gutter:80px}\n.shell{width:min(1280px,calc(100% - (var(--page-gutter) * 2)));margin-inline:auto}\n/* 80px each side leaves too little room on a phone, so the gutter steps down only\n   below 680px. Tablets and up keep the full 80px. */\n@media(max-width:680px){:root{--page-gutter:24px}}\n\n/* The hero banner is a <figure>, and the browser's default figure margin\n   (1em 40px) was never reset: with width:100% it sat 40px off-centre and\n   overflowed its container by 40px on every article. */\nfigure{margin:0}\n.article-layout{justify-content:start}\n@media(min-width:981px) and (max-width:1180px){.article-layout{grid-template-columns:220px minmax(0,660px);gap:56px}}\n\n/* ================= Article hero ================= */\n/* Banner, then eyebrow, heading and deck - the opening screen in reading order. */\n.article-hero{padding:34px 0 46px}\n.article-hero-grid{display:grid;grid-template-columns:1fr;gap:30px}\n.article-hero-grid>.article-banner{grid-row:auto;order:0}\n.article-hero-copy{order:1;max-width:none}\n.article-banner{width:100%;aspect-ratio:2.55/1;max-height:min(520px,46vh);border-radius:28px;margin:0}\n.article-banner img{width:100%;height:100%;object-fit:cover}\n/* The heading runs the full measure between the page gutters. */\n.article-hero h1{max-width:none;margin:14px 0 18px;font-size:clamp(2.25rem,5vw,3rem);line-height:1.06;letter-spacing:-.035em}\n.article-deck{max-width:900px;font-size:1rem}\n.article-meta{font-size:.75rem}\n\n/* ================= Sticky contents list ================= */\n.article-layout{padding-top:26px}\n.article-aside{position:sticky;top:96px;align-self:start;max-height:calc(100vh - 130px);overflow:auto;\n  padding:4px 0 4px 20px;border-left:2px solid var(--line);font-size:.75rem}\n.article-aside strong{display:block;margin-bottom:12px;color:var(--ink);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase}\n.article-aside a{position:relative;display:block;margin:0;padding:9px 0;color:var(--muted);line-height:1.35;\n  transition:color .22s ease,transform .22s ease}\n.article-aside a::before{position:absolute;left:-22px;top:50%;width:2px;height:0;background:var(--coral);\n  content:\"\";transform:translateY(-50%);transition:height .25s ease}\n.article-aside a:hover{color:var(--ink)}\n.article-aside a.active{color:var(--ink);font-weight:800;transform:translateX(3px)}\n.article-aside a.active::before{height:74%}\n\n@media(max-width:980px){\n  .article-hero{padding:24px 0 34px}\n  .article-banner{aspect-ratio:2/1;max-height:none}\n  .article-aside{position:static;max-height:none;display:flex;gap:8px;flex-wrap:wrap;\n    padding:14px 16px;border-left:0;border-radius:14px;background:#f5f4ff}\n  .article-aside strong{width:100%;margin-bottom:6px}\n  .article-aside a{padding:6px 10px;border-radius:99px;background:#fff}\n  .article-aside a::before{display:none}\n  .article-aside a.active{transform:none;background:var(--violet);color:#fff}\n}\n@media(max-width:680px){.article-banner{aspect-ratio:16/10}.article-hero h1{font-size:clamp(1.5rem,7.5vw,2.25rem)}}\n\n/* ---- Type scale, matched to the home page ---- */\nh1,h2,h3,h4,.logo{font-family:var(--display)}\nbody,p,li{font-family:var(--body)}\n.article-meta,.blog-card-body small{font-family:var(--body)}\n.article-hero h1{font-size:clamp(2.25rem,5vw,3rem);line-height:1.1;letter-spacing:-.032em}\n.article-deck{font-size:1rem;line-height:1.6}\n.article-body h2{font-size:clamp(1.5rem,2.5vw,1.5rem);line-height:1.2;letter-spacing:-.024em;margin:44px 0 12px}\n.article-body p{font-size:1rem;line-height:1.78;margin:0 0 18px}\n.article-quote{font-size:1rem;line-height:1.5;padding:24px;margin:32px 0}\n.article-cta{padding:28px}\n.article-cta h2{font-size:1.5rem;margin:0 0 8px}\n.article-cta p{font-size:.875rem}\n.article-meta{font-size:.75rem;font-weight:700;letter-spacing:.14em}\n\n/* ---- Article hero: heading and deck run the full banner width ---- */\n/* The hero copy sat in a 900px wrapper while the banner ran the full 1280px\n   gutter width, so the heading stopped short of the image above it. */\n.article-hero-grid>div,.article-hero-copy{max-width:none;width:100%}\n.article-hero h1,.article-deck{max-width:none;width:100%}\n.article-banner{aspect-ratio:2.55/1;max-height:min(536px,48vh)}   /* +16px of height */\n.article-hero h1{font-size:clamp(2.25rem,5vw,3rem);margin:16px 0 16px}\n.article-deck{font-size:1rem;line-height:1.62;max-width:none}\n\n\n/* ---- Explore other blogs ---- */\n.more-blogs{padding:64px 0 76px;background:var(--paper);border-top:1px solid var(--line)}\n.more-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:baseline;margin-bottom:26px}\n.more-head h2{margin:0;font-family:var(--display);font-size:clamp(1.5rem,3.7vw,2.25rem);letter-spacing:-.025em}\n.more-head a{margin-left:auto;font-size:.875rem;font-weight:800;color:var(--violet)}\n.more-head a:hover{color:var(--coral)}\n.more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}\n@media(max-width:980px){.more-grid{grid-template-columns:1fr 1fr}}\n@media(max-width:680px){.more-grid{grid-template-columns:1fr}}\n\n/* ================= The blog card ================= */\n.blog-tile{\n  display:flex;flex-direction:column;overflow:hidden;\n  border:1px solid var(--line);border-radius:22px;background:#fff;color:inherit;\n  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;\n}\n.blog-tile:hover{transform:translateY(-5px);border-color:rgba(103, 95, 252,.32);box-shadow:0 18px 44px rgba(17, 15, 53,.1)}\n.bc-media{display:block;aspect-ratio:16/9;overflow:hidden;background:#f0effa}\n/* contain, not cover: the whole illustration stays visible and uncropped. */\n.bc-media img{display:block;width:100%;height:100%;object-fit:contain;background:#f6f5ff;transition:transform .4s ease}\n.blog-tile:hover .bc-media img{transform:scale(1.02)}\n.bc-body{display:flex;flex:1;flex-direction:column;padding:22px}\n.bc-eyebrow{\n  display:flex;gap:8px;align-items:center;color:var(--coral);\n  font-family:var(--body);font-size:.75rem;font-weight:700;\n  letter-spacing:.13em;text-transform:uppercase;\n}\n.bc-eyebrow i{font-style:normal;opacity:.55}\n.bc-title{\n  margin:13px 0 10px;font-family:var(--display);font-size:1rem;font-weight:700;\n  line-height:1.32;letter-spacing:-.01em;color:var(--ink);\n}\n.bc-desc{\n  flex:1;color:var(--muted);font-size:.875rem;line-height:1.55;\n  /* Live decks vary from one line to six; four keeps every card readable and\n     the grid even without truncating anything that matters. */\n  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;\n}\n.bc-action{\n  display:inline-flex;gap:8px;margin-top:18px;align-items:center;\n  color:var(--violet);font-size:.75rem;font-weight:800;\n}\n.bc-action em{font-style:normal;transition:transform .22s ease}\n.blog-tile:hover .bc-action{color:var(--coral)}\n.blog-tile:hover .bc-action em{transform:translateX(4px)}\n.blog-tile[hidden]{display:none}\n/* three across wherever the card is used */\n.blog-grid,.more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}\n@media(max-width:980px){.blog-grid,.more-grid{grid-template-columns:1fr 1fr}}\n@media(max-width:680px){.blog-grid,.more-grid{grid-template-columns:1fr}}\n\n/* ---- The contents rail is back, alongside the body ---- */\n.article-aside{display:block}\n.article-layout{\n  display:grid;grid-template-columns:236px minmax(0,760px);gap:70px;\n  justify-content:start;padding-top:14px;\n}\n@media(min-width:981px) and (max-width:1180px){.article-layout{grid-template-columns:210px minmax(0,640px);gap:48px}}\n@media(max-width:980px){.article-layout{grid-template-columns:1fr;gap:26px}}\n\n/* ---- explore-other-blogs uses the same card, three across ---- */\n.more-blogs{padding:60px 0 74px;background:var(--paper);border-top:1px solid var(--line)}\n.more-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:baseline;margin-bottom:26px}\n.more-head h2{margin:0;font-family:var(--display);font-size:clamp(1.5rem,3.7vw,2.25rem);letter-spacing:-.025em}\n.more-head a{margin-left:auto;font-size:.875rem;font-weight:800;color:var(--violet)}\n.more-head a:hover{color:var(--coral)}\n\n/* .sr-only lived only in the home stylesheet, so hidden labels were showing. */\n.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}\n.footer-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:80px}\n.footer-about p{max-width:500px;color:#b0aed3;font-size:.75rem}\n.footer-links{display:grid;grid-template-columns:repeat(2,1fr);gap:30px}\n.footer-links strong{display:block;margin-bottom:13px;color:#fff;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-family:var(--body)}\n.footer-links a{display:block;margin:8px 0;color:#b0aed3;font-size:.75rem}\n.footer-links a:hover{color:var(--coral)}\n.footer-brand-logo{display:inline-flex;width:auto;height:46px;align-items:center;filter:none}\n.footer-brand-logo img{height:38px;width:auto;max-height:none;transform:translateY(4px)}\n@media(max-width:980px){.footer-grid{grid-template-columns:1fr;gap:36px}}\n@media(max-width:680px){.footer-links{grid-template-columns:1fr;gap:18px}.footer-bottom{gap:10px;flex-direction:column;align-items:flex-start}}\n\n.article-banner{\n  /* 78vh of width is 44vh of height at 16:9, so the height cap is expressed\n     as a width and the box never has to letterbox to obey it. */\n  width:min(100%,760px,78vh);margin-inline:auto;\n  aspect-ratio:16/9;\n  border-radius:22px;overflow:hidden;\n}\n.article-hero-grid>.article-banner{margin-bottom:6px}\n@media(max-width:980px){.article-banner{width:100%}}\n\n/* ================= Back navigation: one button, one place ================= */\n.back-link{\n  display:inline-flex;gap:8px;align-items:center;\n  min-height:42px;padding:0 18px;\n  border:1px solid var(--line);border-radius:999px;background:#fff;\n  /* Stated explicitly: this button was inheriting white from the legal header\n     and only appeared on hover. It is always visible now. */\n  color:var(--ink);opacity:1;visibility:visible;\n  font-family:var(--body);font-size:.75rem;font-weight:750;letter-spacing:0;\n  text-decoration:none;white-space:nowrap;\n  transition:border-color .2s ease,color .2s ease,transform .2s ease,box-shadow .2s ease;\n}\n.back-link .back-arrow{font-size:1em;line-height:1;transition:transform .2s ease}\n.back-link:hover,.back-link:focus-visible{\n  border-color:var(--violet);color:var(--violet);\n  transform:translateY(-1px);box-shadow:0 6px 18px rgba(103, 95, 252,.13);\n}\n.back-link:hover .back-arrow{transform:translateX(-3px)}\n.back-link:focus-visible{outline:2px solid var(--violet);outline-offset:2px}\n/* Kill the older per-page overrides by name so nothing re-colours it. */\n.legal-nav .back-link,.article-nav .back-link,.login-nav .back-link,\n.legal-nav .legal-back,.login-back{color:var(--ink);font-size:.75rem;min-height:42px;padding:0 18px}\n@media(max-width:680px){.back-link{min-height:38px;padding:0 14px;font-size:.75rem}}\n\n/* Headings-only rail: room for a real heading to wrap without becoming a wall\n   of text, and no snippet styling to tempt anything else in. */\n.article-aside a{display:block;line-height:1.4;font-size:.75rem}\n.article-aside a br,.article-aside p,.article-aside small{display:none}\n\n/* ===== Book a Demo dialog, so it opens over this page ===== */\nbody.modal-open{overflow:hidden}\n.icon-btn{display:grid;width:42px;height:42px;place-items:center;border:1px solid var(--line);border-radius:50%;background:#fff;cursor:pointer}\n.modal{position:fixed;z-index:200;inset:0;display:none;padding:30px;place-items:center;background:rgba(8, 6, 30,.78);backdrop-filter:blur(10px)}\n.modal.open{display:grid;animation:fade .2s ease}\n.modal-panel{position:relative;width:min(1120px,100%);max-height:calc(100vh - 50px);padding:28px;overflow:auto;border-radius:28px;background:var(--paper);box-shadow:0 35px 120px rgba(0,0,0,.34)}\n.modal-close{position:absolute;z-index:2;right:18px;top:18px}\n.modal-title{padding:8px 55px 24px 4px}\n.modal-title h2{margin:6px 0 0;font-family:var(--display);font-size:2.25rem;letter-spacing:-.04em}\n.modal-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:26px}\n.modal-video{display:grid;min-height:470px;padding:28px;place-items:center;border-radius:23px;background:var(--ink);color:#fff}\n.demo-form{padding:26px}\n.demo-form h3{margin:0;font-family:var(--display);font-size:1.5rem}\n.demo-form>p{color:var(--muted);font-size:.75rem}\n.field{display:grid;gap:5px;margin-top:12px;color:var(--ink);font-size:.75rem;font-weight:800}\n.field input,.field textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none}\n.field input:focus,.field textarea:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(103, 95, 252,.12)}\n.field textarea{min-height:84px;resize:vertical}\n.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.demo-form .btn{width:100%;margin-top:16px}\n.form-note{display:block;margin-top:9px;color:var(--muted);font-size:.75rem}\n.modal-grid{grid-template-columns:1fr}\n.modal-video{min-height:390px}}\n.modal{padding:8px}\n.modal-panel{padding:18px}\n.modal-title h2{font-size:1.5rem}\n.modal-video{min-height:330px;padding:16px}\n.demo-form{padding:20px 4px}\n.form-row{grid-template-columns:1fr}}\n.developer-video-slot{position:relative;z-index:1;display:flex;width:100%;min-height:370px;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;border-radius:24px;background-color:#14123d;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:36px 36px;color:#fff;text-align:center}\n.developer-video-slot::after{position:absolute;width:210px;height:210px;right:-68px;bottom:-72px;border:25px solid rgba(238,133,27,.11);border-radius:50%;content:\"\"}\n.developer-video-slot strong{position:relative;z-index:1;margin-top:22px;font-size:.875rem}\n.developer-video-slot small{position:relative;z-index:1;margin-top:7px;color:#c7c6dc;font-size:.75rem}\n.video-slot-play{position:relative;z-index:2;display:grid;width:62px;height:62px;place-items:center;border:0;border-radius:50%;background:linear-gradient(90deg,var(--coral),var(--violet),var(--teal));color:#fff;box-shadow:0 0 0 12px rgba(103, 95, 252,.12);cursor:pointer;transition:transform .22s ease,box-shadow .22s ease}\n.video-slot-play:hover{transform:scale(1.08);box-shadow:0 0 0 17px rgba(103, 95, 252,.1)}\n.modal-title h2{font-size:1.5rem;letter-spacing:-.025em}\n.demo-form h3{font-size:1.125rem}\n.modal-video{min-height:380px}\n.modal{padding:24px}\n.modal-panel{max-height:calc(100vh - 48px);padding:22px}\n.modal-title{padding:4px 48px 16px 2px}\n.modal-title h2{font-size:1.125rem;margin-top:4px}\n.modal-grid{gap:20px;align-items:stretch}\n.modal-video{min-height:0;padding:18px}\n.modal-video .developer-video-slot{min-height:0;height:100%}\n.demo-form{display:flex;flex-direction:column;justify-content:center;padding:4px 2px}\n.demo-form h3{font-size:1.125rem;margin-bottom:2px}\n.demo-form>p{font-size:.75rem;margin:4px 0 2px}\n.field{margin-top:9px;font-size:.75rem}\n.field input{padding:9px 12px;border-radius:9px}\n.field textarea{min-height:60px;padding:9px 12px;border-radius:9px}\n.demo-form .btn{min-height:46px;margin-top:12px}\n.form-note{margin-top:7px;font-size:.75rem}\n.modal-panel{padding:28px}\n.modal-title{padding:2px 48px 20px 2px}\n.modal-title h2{font-size:1.5rem;margin-top:6px}\n.modal-grid{gap:38px}\n.modal-video{padding:24px;border-radius:20px}\n.demo-form{padding:2px 4px 2px 6px}\n.demo-form h3{font-size:1.125rem}\n.field{margin-top:11px}\n.modal .demo-form .btn.primary{min-height:52px;font-size:.875rem}\n\n/* ================= Icons centre in their own backgrounds ================= */\n/* A glyph in a round background was being positioned by its text baseline, so\n   most of them sat a pixel or two low. Applied once, for every such control on\n   every page, rather than nudged case by case. */\n.icon-btn,.faq-list summary::after,.chat-icon,.chat-send,.chat-card-btn i,\n.chat-avatar,.chat-launch,.video-slot-play,.modal-close,.chat-face,\n.trust-rows li>span,.feature-rows li>span,.flow-card::before,.bc-media-tile{\n  display:grid;place-items:center;place-content:center;\n  line-height:1;text-align:center;\n}\n.icon-btn>svg,.chat-icon>svg,.chat-send>svg,.chat-card-btn i>svg,.modal-close>svg{display:block}\n.faq-list summary::after{line-height:1;padding-bottom:1px}\n\n/* ================= Phones ================= */\n@media(max-width:680px){\n  /* 24px down both edges, on every page, for every block that uses the shell */\n  :root{--page-gutter:24px}\n  .shell,.article-banner-text,.legal-body,.login-card{\n    width:min(1280px,calc(100% - (var(--page-gutter) * 2)));\n    margin-inline:auto;\n  }\n\n  /* one rhythm between sections instead of desktop's tall breathing room */\n  .section,.trust-section,.workspace-section,.reports-section{padding:24px 0}\n  .hero{min-height:0;padding:96px 0 24px}\n  .final-cta{padding:28px 0}\n  .trust-strip{padding:12px 0}\n  .section-head{margin-bottom:18px}\n  .section-cta{margin-top:20px}\n\n  /* type and controls, scaled for the hand */\n  :root{\n    --step-hero:clamp(2.25rem,8.6vw,2.25rem);\n    --step-h2:clamp(1.125rem,5.6vw,1.5rem);\n    --step-h3:clamp(1.125rem,4.6vw,1.125rem);\n    --step-lead:.875rem;\n    --step-body:.875rem;\n    --step-small:.75rem;\n  }\n  h2{font-size:var(--step-h2);line-height:1.2}\n  .section-head>p,.hero .lead{font-size:var(--step-lead);line-height:1.55}\n  .btn{min-height:46px;padding:0 18px;font-size:.875rem}\n  .btn.primary,.btn.outline,.btn.light{width:100%;justify-content:center}\n  .button-row{display:grid;gap:10px}\n\n  /* header: mark left, menu right, and a dark blur behind the dropdown */\n  .site-header{padding-top:8px}\n  /* no padding of its own: the shell's 24px gutter is the header's margin too */\n  .nav-wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}\n  .brand-logo{margin-right:auto}\n  /* The hamburger lives inside .nav-actions, so the group stays laid out and\n     only its other children (Book a demo, Log in) step aside on a phone. */\n  .nav-actions{display:flex;gap:0;margin-left:auto}\n  .nav-actions>*:not(.menu-toggle){display:none!important}\n  .nav-wrap .menu-toggle{display:grid;width:40px;height:40px;border-radius:50%;padding:0}\n  .menu-toggle svg{width:19px;height:19px}\n  .main-nav{top:70px;padding:16px;border-radius:16px}\n  .nav-scrim{\n    position:fixed;z-index:90;inset:0;\n    background:rgba(9, 8, 31,.55);\n    backdrop-filter:blur(7px) saturate(120%);-webkit-backdrop-filter:blur(7px) saturate(120%);\n    animation:scrim-in .2s ease both;\n  }\n  .nav-scrim[hidden]{display:none!important}\n  @keyframes scrim-in{from{opacity:0}to{opacity:1}}\n  .site-header{z-index:120}\n  body.nav-open{overflow:hidden}\n\n  /* hero: three fixed lines, so a longer word cannot reflow the block */\n  .hero-grid{padding-top:0;gap:20px}\n  .h1-line{display:block}\n  .hero h1{font-size:var(--step-hero);line-height:1.14}\n  .audience-rotator{display:inline-block}\n  .hero-keyline{margin-top:14px}\n  .signal-stage{margin-top:4px}\n\n  /* product: the tabs stack instead of sliding sideways */\n  .product-tabs{\n    display:grid;grid-template-columns:1fr;overflow:visible;\n    border-bottom:1px solid var(--line);\n  }\n  .product-tab{\n    min-width:0;width:100%;padding:12px 14px;text-align:left;\n    border-right:0;border-bottom:1px solid var(--line);\n  }\n  .product-tab:last-child{border-bottom:0}\n  .product-tab strong{font-size:.875rem;text-align:left}\n  .product-tab.active::after{right:auto;left:0;width:3px;height:100%;top:0;transform-origin:top;transform:scaleY(var(--p,0))}\n  .product-panel{grid-template-columns:1fr;min-height:0}\n  .product-copy{padding:20px}\n  .product-copy h3{font-size:var(--step-h3)}\n  .walkthrough{min-height:210px;padding:18px}\n  .feature-list li{font-size:.75rem}\n\n  /* how it works: the three cards sit close together */\n  .flow{gap:10px}\n  .flow-card{min-height:0;padding:18px}\n  .flow-card h3{font-size:1rem;margin:10px 0 8px}\n  .flow-card p{font-size:.875rem}\n  .flow-card::before{width:34px;height:34px;font-size:.75rem}\n  .human-note{margin-top:14px;padding:16px}\n\n  /* workspace and reports rows */\n  .split-feature{gap:16px}\n  .dashboard-placeholder{min-height:190px;padding:18px}\n  .feature-rows li{padding:11px 0}\n  .feature-rows li>span{width:30px;height:30px;font-size:.75rem}\n  .feature-rows h3{font-size:.875rem}\n  .feature-rows li p,.reports-section .feature-rows li p{font-size:.75rem;max-width:none;min-height:0}\n\n  /* use cases: the questions wrap instead of running off the edge */\n  .use-case-explorer{gap:12px}\n  .use-case-tabs{display:grid;grid-template-columns:1fr;gap:8px;overflow:visible}\n  .use-case-tab{\n    width:100%;min-width:0;padding:11px 14px;\n    font-size:.75rem;line-height:1.35;white-space:normal;overflow:visible;text-overflow:clip;\n  }\n  .use-case-panel{padding:20px}\n  .use-case-panel h3{font-size:var(--step-h3)}\n  .use-case-panel>p:not(.section-label){font-size:.875rem}\n  .use-case-tags{padding-top:16px}\n  .use-case-tags span{font-size:.75rem}\n\n  /* trust: the dark card on top, the list beneath it, both readable */\n  .trust-layout{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}\n  .trust-hero-card{height:auto;min-height:0;padding:20px;order:1}\n  .trust-hero-card h3{font-size:1.125rem;line-height:1.24}\n  .trust-hero-card p{font-size:.875rem;color:rgba(255,255,255,.86)}\n  .trust-rows{display:block;height:auto;order:2}\n  .trust-rows li{height:auto;padding:11px 0}\n  .trust-rows li>div{display:block}\n  .trust-rows h3{font-size:.875rem}\n  .trust-rows p{font-size:.75rem;margin-top:3px}\n\n  /* the closing CTA: the ring centred behind the words, and less air */\n  .cta-layout{gap:16px}\n  .final-cta h2{font-size:var(--step-h2)}\n  .final-cta p{font-size:.875rem}\n  .cta-ring,.cta-orbit{left:50%;top:44%;width:min(300px,72vw)}\n  .cta-signal{padding:18px}\n  .cta-steps span{font-size:.75rem;padding:8px 12px}\n\n  /* resources and FAQ */\n  .blog-grid,.more-grid{gap:12px}\n  .faq-layout{gap:14px}\n  .faq-list summary{padding:14px 0;font-size:.875rem;gap:14px}\n  .faq-list summary::after{width:26px;height:26px;font-size:.875rem}\n  .faq-list details p{font-size:.875rem}\n\n  /* footer: the columns close up */\n  .site-footer{padding:26px 0 20px}\n  .footer-grid{display:grid;grid-template-columns:1fr;gap:20px}\n  .footer-links{display:grid;grid-template-columns:1fr 1fr;gap:16px}\n  .footer-about p{font-size:.875rem;margin-top:8px}\n  .footer-bottom{margin-top:18px;padding-top:14px;gap:8px;font-size:.75rem}\n\n  /* the assistant keeps a margin off both edges, ring included */\n  /* The launcher sits 28px in from both edges, and its ring is drawn 14px\n     proud of the button rather than 19px, so the whole ring clears the screen.\n     The panel is inset by the same 28px on both sides, so opening it does not\n     shift the widget against the edge it was resting on. */\n  .chat-dock{right:28px;bottom:28px}\n  .chat-ring{inset:-14px;width:calc(100% + 28px);height:calc(100% + 28px)}\n  .chat-panel{width:calc(100vw - 56px);height:min(78vh,560px)}\n\n  /* the demo dialog reads at phone size */\n  .modal{padding:14px}\n  .modal-panel{padding:18px;border-radius:20px}\n  .modal-title{padding:0 40px 12px 0}\n  .modal-title h2{font-size:1.125rem;line-height:1.2}\n  .modal-grid{display:grid;grid-template-columns:1fr;gap:16px}\n  .modal-video{padding:12px;border-radius:14px}\n  /* The still was shorter than the play button plus its two lines of caption,\n     so the button was pinned to the top edge and the caption spilled out the\n     bottom. The slot sizes to its own content again and the group centres. */\n  .developer-video-slot,.modal-video-slot{height:auto;min-height:176px;padding:16px 14px}\n  .developer-video-slot strong{margin-top:14px}\n  .developer-video-slot strong{font-size:.875rem}\n  .developer-video-slot small{font-size:.75rem}\n  .video-slot-play{width:46px;height:46px;font-size:.875rem}\n  .demo-form h3{font-size:1rem}\n  .demo-form p{font-size:.75rem}\n  .field{font-size:.75rem}\n  .field input,.field textarea{min-height:42px;font-size:.875rem}\n  .form-row{display:grid;grid-template-columns:1fr;gap:0}\n  .form-note{font-size:.75rem}\n\n  /* login: even margins, centred column, phone-sized type */\n  .login-nav{padding:0;justify-content:space-between}\n  .login-main{padding-inline:0}\n  .login-card{max-width:none;padding:24px 20px;border-radius:20px;text-align:center}\n  .login-pane h1,.login-card h1{font-size:1.5rem;line-height:1.18}\n  .login-card>p{font-size:.875rem}\n  .login-form{margin-top:20px}\n  .login-form>label{font-size:.75rem}\n  .login-form input{min-height:48px;font-size:.875rem}\n  .login-submit{min-height:50px;font-size:.875rem}\n  .login-footer{flex-wrap:wrap;gap:8px;font-size:.75rem;padding-bottom:18px}\n\n  /* legal and article pages */\n  .legal-nav,.article-nav{gap:10px}\n  .article-body h2{font-size:1.125rem}\n  .article-body p,.article-body li{font-size:.875rem}\n  .more-head h2{font-size:1.125rem}\n}\n\n/* ================= Blog cards, two across on a phone ================= */\n@media(max-width:680px){\n  .blog-grid,.more-grid,.blogs-grid,.idx-grid{grid-template-columns:1fr 1fr;gap:12px}\n  .bc-body{padding:12px}\n  .bc-eyebrow{font-size:.75rem;letter-spacing:.09em}\n  .bc-title{font-size:.875rem;margin:8px 0 6px;line-height:1.28}\n  .bc-desc{font-size:.75rem;line-height:1.45;-webkit-line-clamp:3}\n  .bc-action{font-size:.75rem;margin-top:12px}\n  /* the whole picture, never a crop, whatever the card width */\n  .bc-media{aspect-ratio:16/9;background:#f0efff}\n  .bc-media img{object-fit:contain}\n}\n\n/* ================= The article's contents rail ================= */\n/* Each heading sat in a filled white pill, which fought the page for attention\n   and turned a quiet list into a row of buttons. On a phone it is plain text,\n   and the heading you are reading is marked by weight and colour alone. */\n@media(max-width:680px){\n  .article-aside a{\n    padding:5px 0;border-radius:0;background:none;\n    color:var(--muted);font-size:.75rem;line-height:1.4;\n  }\n  .article-aside a.active{background:none;color:var(--ink);font-weight:800}\n  .article-aside{padding:16px 0 16px 14px}\n}\n\n/* ================= The hero heading, at every width ================= */\n/* Three lines that hold their shape while the rotating word changes, sized\n   from the viewport itself so the block fills the column at any width rather\n   than jumping between fixed sizes. */\n.hero h1 .h1-line{display:inline}\n@media(max-width:680px){\n  .hero h1{font-size:var(--step-hero);line-height:1.08;letter-spacing:-.035em}\n  .hero h1 .h1-line{display:block}\n  .hero h1 .h1-rot{min-height:1.08em}\n}\n/* On the narrowest phones still in use the longest line would touch the gutter,\n   so the floor comes down with the screen rather than letting it overflow. */\n@media(max-width:360px){\n  :root{--step-hero:clamp(2.25rem,9.4vw,2.25rem)}\n}\n\n@media(max-width:680px){\n  /* --- the cards go back to full width --------------------------------\n     Two across left each card too narrow to read: four-word lines, a title\n     broken over six rows, a picture too small to see. One per row is the\n     layout the site had, and it is the layout it keeps. */\n  .blog-grid,.more-grid,.blogs-grid,.idx-grid{grid-template-columns:1fr;gap:16px}\n  .bc-body{padding:18px}\n  .bc-eyebrow{font-size:.75rem;letter-spacing:.11em}\n  .bc-title{font-size:1rem;margin:10px 0 8px;line-height:1.22}\n  .bc-desc{font-size:.875rem;line-height:1.55;-webkit-line-clamp:3}\n  .bc-action{font-size:.75rem;margin-top:14px}\n  .bc-media{aspect-ratio:16/9;background:#f0efff}\n  .bc-media img{object-fit:contain}\n\n  /* --- the header, off the edge ---------------------------------------\n     The mark and the menu were flush against the 24px content gutter, which\n     read as pinned to the screen. The bar keeps its own inset on top of the\n     gutter, and enough height that neither sits tight to the rule beneath. */\n  .site-header{padding-top:10px}\n  .nav-wrap{padding:12px 8px;min-height:60px}\n  .brand-logo img,.brand-logo svg{height:26px}\n  .nav-wrap .menu-toggle{width:42px;height:42px}\n  .main-nav{top:82px}\n}\n\n@media(max-width:680px){\n  .site-header{padding:10px 0 0}\n  /* Two measurements, and they are separate things. The bar is a plate that\n     floats 24px in from each edge of the screen, the same gutter every other\n     block on the page uses. Inside that plate, 16px of padding on all four\n     sides holds the mark and the menu.\n     (An earlier pass pinned the bar to a fixed 62px, which with border-box\n     sizing squeezed its padding box to 28px and let the 40px button hang out\n     of it; the bar is sized by what it holds again.) */\n  .site-header .shell.nav-wrap{\n    width:calc(100% - 48px);max-width:none;margin-inline:auto;\n    padding:16px;height:auto;min-height:0;\n    display:flex;align-items:center;justify-content:space-between;gap:12px;\n  }\n  /* The row is as tall as its tallest child, so the 40px menu button fits\n     inside the padding box instead of overflowing it — otherwise the gap\n     above and below the button measures 11px while the padding says 16. */\n  .brand-logo{display:flex;height:40px;align-items:center}\n  .brand-logo img,.brand-logo svg{height:26px;display:block}\n  .nav-wrap .menu-toggle{width:40px;height:40px;margin:0;flex:0 0 auto}\n  /* the dropdown hangs eight pixels below the bar and lines up with its edges,\n     whatever the bar measures at that moment */\n  .main-nav{top:calc(100% + 8px);left:0;right:0}\n  .login-header .login-nav{padding:16px;min-height:0}\n  .legal-nav,.article-nav,.blogs-nav{padding:16px}\n\n  /* --- and it holds that size all the way down the page ------------------\n     The bar does not contract on scroll. The padding stays at 16, the mark\n     stays at 26 and the menu button stays at 40, at the top of the page and\n     everywhere below it — a bar that shrinks as you read makes the mark and\n     the menu move under the thumb that is reaching for them. What does change\n     on scroll is the plate behind them: transparent over the hero, glass once\n     there is content passing underneath. */\n  .site-header .shell.nav-wrap{\n    transition:background .35s ease,backdrop-filter .35s ease,\n               box-shadow .35s ease,border-color .35s ease;\n  }\n  .site-header.scrolled .shell.nav-wrap{padding:16px}\n  .site-header.scrolled .brand-logo{height:40px}\n  .site-header.scrolled .brand-logo img,.site-header.scrolled .brand-logo svg{height:26px}\n  .site-header.scrolled .nav-wrap .menu-toggle{width:40px;height:40px}\n  .site-header.scrolled .nav-wrap .menu-toggle svg{width:19px;height:19px}\n}\n\n@media(max-width:680px){\n  .product-shell{border-radius:20px;box-shadow:0 12px 32px rgba(17, 15, 53,.07)}\n\n  /* --- the three options ------------------------------------------------ */\n  .product-tabs{\n    display:grid;grid-template-columns:1fr;gap:8px;\n    padding:12px;border-bottom:1px solid var(--line);background:#fafaff;\n  }\n  .product-tab{\n    position:relative;display:flex;align-items:center;gap:10px;\n    padding:13px 14px;border:1px solid var(--line);border-right:1px solid var(--line);\n    border-radius:13px;background:#fff;overflow:hidden;\n    transition:border-color .2s ease,background .2s ease;\n  }\n  .product-tab strong{margin:0;font-size:.875rem;font-weight:750;line-height:1.25}\n  .product-tab span{display:none}\n  /* a ring on the left says which one you are on, the way a radio would */\n  .product-tab::before{\n    content:\"\";flex:0 0 auto;width:15px;height:15px;border-radius:50%;\n    border:2px solid #d4d3ea;background:#fff;transition:border-color .2s ease,box-shadow .2s ease;\n  }\n  .product-tab.active{border-color:rgba(103, 95, 252,.45);background:#f3f2ff}\n  .product-tab.active strong{font-weight:850}\n  .product-tab.active::before{border-color:var(--violet);box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 9px var(--violet)}\n  /* The fifteen-second line runs along the bottom of the option you are on —\n     and only that one. Painting every ::after left a violet bar under the\n     options you were not reading. */\n  .product-tab::after{\n    right:0;bottom:0;left:0;height:3px;border-radius:0;\n    background:transparent;transform:scaleX(0);transform-origin:left;\n  }\n  .product-tab.active::after{background:var(--violet);transform:scaleX(var(--p,0))}\n\n  /* --- the panel, in parts ---------------------------------------------- */\n  .product-panel{display:block;min-height:0}\n  .product-copy{padding:20px 16px 4px}\n  .product-copy .kicker{font-size:.75rem;letter-spacing:.12em}\n  .product-copy h3{max-width:none;margin:9px 0 10px;font-size:1.125rem;line-height:1.16;letter-spacing:-.025em}\n  .product-copy>p{margin:0;font-size:.875rem;line-height:1.6}\n\n  /* what it gives you: each capability on its own tinted row */\n  .feature-list{gap:7px;margin:16px 0 0}\n  .feature-list li{\n    align-items:flex-start;gap:9px;padding:10px 12px;\n    border-radius:11px;background:#f6f6fd;\n    font-size:.75rem;font-weight:700;line-height:1.42;\n  }\n  .feature-list i{flex:0 0 auto;width:19px;height:19px;margin-top:1px;font-size:.75rem}\n\n  /* who it suits: the run-on line becomes the tags it always was */\n  .best-for{margin-top:16px;padding-top:14px}\n  .best-for small{font-size:.75rem;letter-spacing:.12em}\n  .best-for strong{display:block;margin-top:9px;font-size:.75rem}\n  /* once the tags are built the sentence steps aside — display:block above\n     would otherwise beat the browser's own rule for a hidden element */\n  .best-for strong[hidden]{display:none!important}\n  .best-for-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}\n  .best-for-tags b{\n    padding:6px 11px;border:1px solid rgba(103, 95, 252,.22);border-radius:999px;\n    background:#f5f4ff;color:#3a3596;font-size:.75rem;font-weight:750;\n  }\n\n  /* what it looks like: framed inside the card, not bleeding off it */\n  .walkthrough{min-height:0;padding:16px;background:transparent}\n  .walkthrough::before{display:none}\n  .walkthrough .developer-video-slot{\n    width:100%;min-height:172px;border-radius:16px;padding:16px 14px;\n  }\n  .walkthrough .developer-video-slot strong{margin-top:13px;font-size:.875rem;line-height:1.3}\n  .walkthrough .developer-video-slot small{font-size:.75rem}\n}\n\n.footer-sub{margin:10px 0 0;font-size:.75rem;opacity:.72}\n\n/* ================= Article banner ================= */\n/* The picture's box is exactly the artwork's own proportion, so cover fills\n   the band edge to edge and crops nothing — full size, nothing cut. The title\n   panel is layered over it rather than sitting inside it, which is what kept\n   forcing the box taller than the picture and cropping it. */\n.article-hero{position:relative;padding:0;background:#ebeaff}\n.article-banner{\n  position:relative;display:block;width:100%;max-width:none;margin:0;\n  /* aspect-ratio is set per article from the picture itself */\n  max-height:min(86vh,820px);\n  border:0;border-radius:0;overflow:hidden;\n  background:#ebeaff center/cover no-repeat;\n}\n/* contain, with the box already at the picture's proportion: it fills the band\n   edge to edge with nothing cropped, and if the height cap ever binds it backs\n   off rather than cutting into the image. */\n.article-banner>img{\n  position:absolute;inset:0;width:100%;height:100%;\n  object-fit:contain;object-position:center;\n}\n/* a soft rise so the panel is not a hard band across the picture */\n.article-hero::after{\n  position:absolute;z-index:1;right:0;bottom:0;left:0;height:52%;content:\"\";\n  background:linear-gradient(to bottom,rgba(17, 15, 53,0) 0%,rgba(17, 15, 53,.06) 32%,rgba(17, 15, 53,.24) 68%,rgba(17, 15, 53,.4) 100%);\n  pointer-events:none;\n}\n.article-banner-text{\n  position:absolute;z-index:2;right:0;bottom:0;left:0;\n  width:min(1280px,calc(100% - (var(--page-gutter) * 2)));\n  margin:0 auto;padding:26px 30px 30px;\n  border-radius:20px 20px 0 0;\n  background:rgba(17, 15, 53,.34);\n  backdrop-filter:blur(14px) saturate(125%);\n  -webkit-backdrop-filter:blur(14px) saturate(125%);\n  color:#fff;\n  text-shadow:0 1px 14px rgba(9, 8, 31,.55);\n}\n@supports not (backdrop-filter:blur(1px)){.article-banner-text{background:rgba(17, 15, 53,.56)}}\n/* The eyebrow gets a backing of its own so it reads over any part of the art. */\n.article-banner-text .article-meta{\n  display:inline-block;margin:0 0 12px;padding:5px 11px;border-radius:999px;\n  background:rgba(9, 8, 31,.5);color:#ffd7c6;\n  text-shadow:0 1px 8px rgba(9, 8, 31,.9);\n}\n.article-banner-text h1{margin:0;color:#fff;font-size:clamp(1.5rem,3.7vw,2.25rem);line-height:1.12;letter-spacing:-.03em}\n.article-banner-text .article-deck{margin:14px 0 0;color:rgba(255,255,255,.88);font-size:1rem;line-height:1.6;max-width:74ch}\n/* On a narrow screen the band is too short to hold the title over the picture,\n   so the title moves below it — the picture still shows in full. */\n@media(max-width:980px){\n  .article-hero::after{display:none}\n  .article-banner-text{\n    position:static;width:100%;padding:22px var(--page-gutter) 26px;border-radius:0;\n    background:var(--ink);backdrop-filter:none;-webkit-backdrop-filter:none;text-shadow:none;\n  }\n  .article-banner-text .article-deck{font-size:.875rem}\n}\n.article-hero-grid,.article-hero-copy{display:contents}\n\n/* ===================== footer ===================== */\n.site-footer{padding:76px 0 30px}\n.footer-grid{grid-template-columns:minmax(260px,1fr) minmax(0,1.35fr);gap:56px 72px;align-items:start}\n.footer-about p{max-width:42ch;font-size:.875rem;line-height:1.65}\n.footer-sub{margin:12px 0 0;font-size:.75rem;line-height:1.6;opacity:.68}\n\n/* three columns that never squeeze below a readable width */\n.footer-links{grid-template-columns:repeat(3,minmax(150px,1fr));gap:40px 48px}\n.footer-links strong{margin-bottom:18px;font-size:.75rem;letter-spacing:.1em}\n.footer-links a{margin:0;padding:7px 0;font-size:.875rem;line-height:1.45}\n\n.footer-bottom{margin-top:60px;padding-top:24px;font-size:.75rem;align-items:center}\n.legal-footer-links{display:flex;gap:10px;align-items:center}\n\n/* below 1040px the brand sits above the links, which get the full width */\n@media(max-width:1040px){\n  .footer-grid{grid-template-columns:1fr;gap:44px}\n  .footer-about p{max-width:60ch}\n  .footer-links{grid-template-columns:repeat(3,minmax(160px,1fr));gap:36px 40px}\n}\n/* two columns before anything has to wrap awkwardly */\n@media(max-width:720px){\n  .site-footer{padding:52px 0 26px}\n  .footer-links{grid-template-columns:repeat(2,minmax(140px,1fr));gap:32px 28px}\n  .footer-bottom{margin-top:38px}\n}\n/* one column on a phone, with the rows far enough apart to tap */\n@media(max-width:520px){\n  .site-footer{padding:34px 0 24px}\n  .footer-links{grid-template-columns:1fr;gap:28px}\n  .footer-links strong{margin-bottom:12px}\n  .footer-links a{padding:9px 0}\n  .footer-bottom{margin-top:30px;gap:12px;flex-direction:column;align-items:flex-start}\n}\n\n/* ============ readability (not animation) ============ */\n.report-formats p,.human-note p,.use-case-ways p,.section-head>p,.hero .lead,\n.vid-deck,.cs-deck,.uc-outro p,.trust-strip-note span,.faq-intro p,\n.use-case-panel>p,.product-copy p,.legal-copy p,.article-body p,.cs-body p,\n.idx-hero p,.vid-lead-copy p,.chat-greet-sub,.modal-deck,.demo-form>p{max-width:68ch}\n.trust-strip-head h2{max-width:26ch}\n.plain-rows li p,.step-rows li p{max-width:60ch}\n@media(max-width:680px){\n  .use-case-tags span,.bc-eyebrow,.trust-metric span,.cs-figure span{font-size:.75rem}\n}\n\n/* ============ the four steps stay fully visible ============ */\n/* asked for earlier: no step is dimmed; the current one is marked by colour */\n.step-rows li{opacity:1}\n.step-rows li.active h3{color:var(--violet)}\n\n/* ===== v3 §13 · contrast and readable labels ===== */\n:root{--coral-ink:#EE851B}\n.eyebrow,.section-label,.bc-eyebrow,.cs-cta-eyebrow,.vid-cta-eyebrow,.uc-chip-label,.use-case-ways small,.cs-aside strong,.product-copy .kicker,.idx-pill.active,.chat-ring text,.trust-strip-head .trust-strip-label,.best-for small,.panel-label,.kicker{color:var(--coral-ink)}\n/* footer headings keep the brand coral, at the readable tone */\n.footer-links strong{color:var(--coral-ink)}\n.btn.primary{background:var(--coral);box-shadow:0 12px 24px rgba(238,133,27,.26)}\n.btn.primary:hover{background:#EE851B}\n/* Link hovers are interactive text, not labels, so they keep a readable\n   orange chosen for the background they sit on: the darker tone on the\n   light pages, the brand orange in the dark footer where it is the\n   stronger of the two. */\n.text-link:hover,.main-nav a:hover{color:#EE851B}\n.footer-links a:hover{color:#EE851B}\n.eyebrow,.section-label{font-size:.75rem}\n.form-note,.bc-eyebrow,.trust-metric span,.cs-figure span,.use-case-tags span,.uc-chip-label,.use-case-ways small,.cs-aside a{font-size:.75rem}\n.footer-links strong{font-size:.75rem}\n@media(max-width:680px){\n  .eyebrow,.section-label{font-size:.75rem;letter-spacing:.1em}\n  .form-note,.bc-eyebrow,.trust-metric span,.cs-figure span,.use-case-tags span,.uc-chip-label,.use-case-ways small{font-size:.75rem}\n  .demo-form .field{font-size:.875rem}\n  .login-form>label{font-size:.75rem}\n}\n\n/* ---- proof strip: eyebrow alignment and summary row ----\n   The eyebrow used to be the first cell inside the metric card and still\n   carried that cell's min-height:112px and padding:22px 26px. Out of the\n   card those became a 26px indent and a ~70px void above the headline.\n   .trust-metric keeps the original rule; only the label is corrected. */\n.trust-strip-head .trust-strip-label{display:block;min-height:0;padding:0;margin:0 0 14px}\n/* The old cell padding was also what held the eyebrow clear of the hero\n   above it. Put that breathing room back on the band itself. */\n@media(max-width:520px){.trust-strip{padding-top:20px}}\n@media(min-width:521px){.trust-strip{padding-top:28px}}\n@media(min-width:981px){.trust-strip{padding-top:48px}}\n\n/* The summary line runs the full width of the metric card above it, with\n   the link on its own line underneath. One line from 1440px up; below\n   that it wraps naturally. */\n.trust-strip-note{display:block}\n\n/* ---- How It Works: all four steps visible, one explained ----\n   Every step keeps its number, its heading and full opacity — nothing is\n   dimmed. Only the selected step shows its paragraph, which is what the\n   picture beside it is already wired to follow. Four paragraphs at once\n   was 179 words against an empty frame; this is the same component doing\n   what it was built to do. */\n.step-rows li>button>div>p{display:none}\n.step-rows li.active>button>div>p{display:block}\n.step-rows li{opacity:1}\n.step-rows li>button{cursor:pointer}\n\n/* ---- Reports and Trust: the static lists go two across ----\n   These lists have no selected state to collapse, so the only way to stop\n   them towering over the picture is to let them run in two columns. Four\n   items become 2x2, five become 3+2, and the column height drops by\n   roughly half. */\n@media(min-width:1180px){\n  .reports-section .feature-rows{\n    display:grid;grid-template-columns:1fr 1fr;column-gap:34px;align-content:start;\n  }\n  /* the marker is absolutely positioned at left:2px, so the row keeps\n     left padding to clear it */\n  .reports-section .feature-rows>li{border-top:0;padding:0 0 24px 24px}\n}\n.step-rows li:not(.active) h3{color:var(--ink)}\n.step-rows li.active h3{color:var(--violet)}\n\n/* ---- picture and text, in proportion ----\n   The picture was 705px of mostly-empty frame against a 521px column of\n   dense text: the widest thing on the row carried the least, and the\n   narrowest carried the most. Reversed. The picture is now 560px in all\n   three sections (Trust already used 560, so the three finally match),\n   and the text column takes the rest — which also widens the paragraphs\n   so they wrap to fewer lines and stop reading as a wall. */\n@media(min-width:981px){\n  .split-feature,\n  .reports-section .split-feature{grid-template-columns:560px minmax(0,1fr)}\n  .split-feature>.feature-rows p,\n  .plain-rows li p,.step-rows li p{max-width:72ch}\n}\n\n/* ---- two defects ----\n   1. .use-case-panel .uc-chip-label{margin:26px 0 0} was written to give\n      the Example use cases label room, but .use-case-panel>p:not(.section-label)\n      {margin:0} outranks it (the :not() argument adds a point of\n      specificity), so the label sat flush against the paragraph above it.\n      Restated here at a specificity that holds.\n   2. The two closing cards carried different label treatments: one\n      uppercase with tracking, one sentence case. Both now render the\n      words as they are written in the markup, styled as labels by weight\n      and colour instead of by transforming the text. */\n.use-case-panel>p.uc-chip-label{margin:26px 0 0}\n.human-note strong,.report-formats strong{\n  color:var(--coral);font-size:.75rem;font-weight:800;\n  letter-spacing:0;text-transform:none;\n}\n\n/* ---- type scale: hold the headings on a step below desktop too ----\n   Fluid headings are mid-climb at phone and tablet widths, which puts\n   them between steps (25.35px, 28.42px, 38.4px). Pinned to the scale. */\n@media(max-width:980px){\n  .hero-copy h1{font-size:2.25rem}\n  .section-head h2,.trust-strip-head h2,.faq-layout h2,.cta-layout h2,\n  .use-case-panel h3,.product-copy h3{font-size:1.5rem}\n}\n\n/* ---- final CTA joins the section rhythm ----\n   It had its own padding at every width: 28 where sections used 24, 80\n   where they used 60, 80 where they used 76, and 80 where they used 96 —\n   so above 1800px it was the tightest band on the page instead of the\n   most generous. Matched to .section at each breakpoint. */\n@media(max-width:680px){.final-cta{padding:24px 0}}\n@media(min-width:681px){.final-cta{padding:60px 0}}\n@media(min-width:981px){.final-cta{padding:76px 0}}\n@media(min-width:1800px){.final-cta{padding:96px 0}}\n\n/* ---- product walkthrough video ----\n   The slot was width:100% with a fixed min-height:370px, so its shape\n   drifted from 1.48 to 2.30 across screen sizes and never matched the\n   16:9 of real footage. Lock the ratio and let the height follow the\n   width. The dark panel keeps its own height and centres the video. */\n#product .developer-video-slot{aspect-ratio:16/9;min-height:0;height:auto}\n\n/* ---- screenshot placeholders ----\n   Same problem as the video, worse: these had no ratio and no fixed\n   height either, so their height came from whatever column sat beside\n   them. They ranged from 0.37 to 4.26. Locked to 16:9, matching the\n   walkthrough video, so every media box on the site is one shape.\n   .split-feature>.dashboard-placeholder carried height:100%, which fed\n   the row height back into the ratio and blew the picture across the\n   text column — that is why height is reset here too. */\n.dashboard-placeholder{aspect-ratio:16/9;min-height:0;height:auto;align-self:center}\n.split-feature>.dashboard-placeholder{height:auto;min-height:0;min-width:0}\n\n/* ---- section balance ----\n   1. The picture sits in a row whose height comes from the list beside it,\n      and it was centred in that row — so with the list 118-163px taller the\n      picture floated ~80px below the list's first line and nothing lined\n      up. Top-aligned, the two columns start together.\n   2. .report-formats had no styling at all beyond a margin and a colour,\n      so 'Your findings, your format' read as an orphan with ~700px of\n      empty space beside it. It now uses the same card as .human-note in\n      How It Works, so the two sections close the same way.\n   3. Both of those closing blocks sat 18px and 26px under their row,\n      against 54px gaps elsewhere in the same sections. Now 40px. */\n@media(min-width:981px){\n  .split-feature>.dashboard-placeholder,\n  .trust-layout>.dashboard-placeholder{align-self:start}\n}\n.human-note{margin-top:40px}\n.report-formats{\n  display:grid;grid-template-columns:.34fr 1fr;gap:30px;\n  margin:40px 0 0;padding:24px 28px;border-radius:20px;\n  background:var(--ink);color:#fff;font-size:.75rem;\n}\n/* Sentence case kept: uppercasing would change the words on screen and\n   strand the full stop. Styled as a label by colour and weight instead. */\n.report-formats strong{color:var(--coral);font-size:.75rem;font-weight:800;letter-spacing:0}\n.report-formats p{margin:0;max-width:none;color:#d5d4ea;font-size:.75rem}\n@media(min-width:981px){\n  .report-formats{min-height:78px;grid-template-columns:280px minmax(0,1fr);align-items:center}\n  .report-formats strong{white-space:nowrap}\n}\n@media(max-width:980px){\n  .human-note,.report-formats{margin-top:28px}\n  .report-formats{grid-template-columns:1fr;gap:8p ' +\n      '<span class=\"bc-body\"><span class=\"bc-eyebrow\">' + \"<span class=\\\"tp-sro\\\">\" + esc(x.c) + \" &middot; <\/span>\" + esc(x.r) + \" read<\/span>\" +\n      '<span class=\"bc-title\">' + esc(x.t) + \"<\/span>\" +\n      '<span class=\"bc-desc\">' + esc(x.d) + \"<\/span>\" +\n      '<span class=\"bc-action\">Read Article <em>&rarr;<\/em><\/span><\/span><\/a>';\n  }).join(\"\");\n})();\n<\/script>\n<script>\nconst modal = document.querySelector(\"[data-demo-modal]\");\nconst FOCUSABLE = 'a[href],button:not([disabled]),input,textarea,select,[tabindex]:not([tabindex=\"-1\"])';\nlet lastFocused = null;\nfunction openModal(focus) {\n  lastFocused = document.activeElement;\n  modal.classList.add(\"open\");\n  document.body.classList.add(\"modal-open\");\n  modal.setAttribute(\"aria-hidden\", \"false\");\n  if (focus === \"form\") setTimeout(() => modal.querySelector(\"input\")?.focus(), 120);\n  else setTimeout(() => modal.querySelector(\".modal-close\")?.focus(), 120);\n}\nfunction closeModal() {\n  if (!modal.classList.contains(\"open\")) return;\n  modal.classList.remove(\"open\");\n  document.body.classList.remove(\"modal-open\");\n  modal.setAttribute(\"aria-hidden\", \"true\");\n  // Return focus to whatever opened the dialog.\n  lastFocused?.focus?.();\n}\n// Keep Tab inside the dialog while it is open.\nmodal.addEventListener(\"keydown\", (event) => {\n  if (event.key !== \"Tab\") return;\n  const items = [...modal.querySelectorAll(FOCUSABLE)].filter((el) => el.offsetParent !== null);\n  if (!items.length) return;\n  const first = items[0], last = items[items.length - 1];\n  if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }\n  else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }\n});\nfunction bindDemoButtons() {\n  document.querySelectorAll(\"[data-open-demo]\").forEach((button) => {\n    button.onclick = () => openModal(button.dataset.openDemo || \"form\");\n  });\n}\nmodal.querySelector(\".modal-close\").addEventListener(\"click\", closeModal);\nmodal.addEventListener(\"mousedown\", (event) => { if (event.target === modal) closeModal(); });\ndocument.addEventListener(\"keydown\", (event) => { if (event.key === \"Escape\") closeModal(); });\nbindDemoButtons();\n<\/script>\n<script>document.querySelectorAll(\"[data-year]\").forEach(function(el){el.textContent=new Date().getFullYear();});<\/script>\n<div class=\"tp-chat-faq\" hidden><details><summary>What is TruPulse?<\/summary><p>TruPulse is an AI-led research platform that creates, conducts, and analyzes surveys, 1:1 discussions, and focus groups. Your team sets the direction, approves the questions, and reviews the findings.<\/p><\/details><details><summary>Who sees a participant&rsquo;s identity?<\/summary><p>The Creator chooses whether a session is anonymous or identified. Participants are told which setting applies before they take part.<\/p><p>In anonymous sessions, participant names are hidden from individual responses and reports. Details participants share in their responses may still reveal their identity.<\/p><p>In identified sessions, individual reports include the participant&rsquo;s name. These reports are available to the Creator, people the Creator has authorized to view the results, and admins with global viewing access.<\/p><p>In anonymous focus groups, all participants appear as &ldquo;Anonymous&rdquo; in the chat. Details shared during the discussion may still reveal their identity to other participants.<\/p><\/details><details><summary>Who can access individual responses?<\/summary><p>Anyone with access to a session&mdash;the creator, people the creator has shared access with, and admins with global viewing access&mdash;can access all reports and responses for that session, including group reports, individual reports, discussion transcripts, and survey responses.<\/p><p>In anonymous sessions, participant names are hidden in all reports and transcripts. Details participants share in their responses may still reveal their identity. In identified sessions, individual reports include the participant&rsquo;s name.<\/p><\/details><details><summary>Does privacy work the same way in every session type?<\/summary><p>No. A survey can be answered without anyone else present; a 1:1 discussion is between the participant and the AI; a focus group is held with multiple participants in the session. Participants are always notified if a session is anonymous or identified.<\/p><\/details><details><summary>How much control does our team have?<\/summary><p>Your team defines the research objectives, reviews and approves the session details before launch, and chooses participants. TruPulse conducts the research and prepares findings for your team to review. You decide what happens next.<\/p><\/details><details><summary>Are participant responses used to train AI models?<\/summary><p>No. TruPulse does not use participant responses&mdash;including survey answers, 1:1 discussions, and focus-group conversations&mdash;to train AI models. Responses are used to conduct your research and generate findings and reports for your organization.<\/p><\/details><\/div>\n<div class=\"chat-dock\">\n    <div class=\"chat-panel\" data-chat-panel hidden role=\"dialog\" aria-label=\"TruPulse AI Assistant\">\n      <header class=\"chat-head\">\n        <button class=\"chat-icon chat-back\" type=\"button\" aria-label=\"Back\" data-chat-back hidden><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M15 5l-7 7 7 7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/button>\n        <span class=\"chat-avatar\" data-chat-avatar aria-hidden=\"true\"><svg class=\"ico-bubble\" viewBox=\"0 0 32 32\" aria-hidden=\"true\" focusable=\"false\">\n<path d=\"M16 4c7.2 0 13 4.6 13 10.3S23.2 24.6 16 24.6c-1.2 0-2.4-.1-3.5-.4l-6 3a.7.7 0 0 1-1-.8l1.2-4A9.6 9.6 0 0 1 3 14.3C3 8.6 8.8 4 16 4Z\" fill=\"currentColor\"/>\n<circle cx=\"10.6\" cy=\"14.3\" r=\"1.9\" fill=\"var(--bubble-dot,#fff)\"/><circle cx=\"16\" cy=\"14.3\" r=\"1.9\" fill=\"var(--bubble-dot,#fff)\"/><circle cx=\"21.4\" cy=\"14.3\" r=\"1.9\" fill=\"var(--bubble-dot,#fff)\"/>\n<\/svg><\/span>\n        <span class=\"chat-id\"><strong data-chat-title>TruPulse AI Assistant<\/strong><small data-chat-sub><i class=\"chat-dot\"><\/i>AI assistant<\/small><\/span>\n        <span class=\"chat-head-actions\">\n          <button class=\"chat-icon\" type=\"button\" aria-label=\"Conversation menu\" aria-expanded=\"false\" data-chat-menu><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 7h16M4 12h16M4 17h16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.1\" stroke-linecap=\"round\"/><\/svg><\/button>\n          <button class=\"chat-icon\" type=\"button\" aria-label=\"Close chat\" title=\"Close chat\" data-chat-close><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M7 7l10 10M17 7L7 17\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><\/svg><\/button>\n        <\/span>\n        <div class=\"chat-menu\" data-chat-menu-list hidden role=\"menu\">\n          <button type=\"button\" role=\"menuitem\" data-chat-action=\"new\">Start a new conversation<\/button>\n          <button type=\"button\" role=\"menuitem\" data-chat-action=\"clear\">Clear this conversation<\/button>\n          <button type=\"button\" role=\"menuitem\" data-chat-action=\"demo\">Book a demo instead<\/button>\n        <\/div>\n      <\/header>\n\n      <div class=\"chat-body\">\n        <!-- home -->\n        <section class=\"chat-view is-on\" data-view=\"home\">\n          <div class=\"chat-greet\">\n            <p class=\"chat-hi\">Hi! <span class=\"chat-wave\" aria-hidden=\"true\">👋<\/span><\/p>\n            <p class=\"chat-greet-sub\">I can help you explore how TruPulse uses AI to create, conduct, and analyze surveys, 1:1 discussions, and focus groups—with your team guiding the process.<\/p>\n          <\/div>\n          \n          <button class=\"chat-card chat-card-btn\" type=\"button\" data-chat-new>\n            <span><strong>New conversation<\/strong><small>AI assistant<\/small><\/span>\n            <i aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M3.4 20.6 21 12 3.4 3.4l2.1 7.2 9 1.4-9 1.4-2.1 7.2Z\" fill=\"currentColor\"/><\/svg><\/i>\n          <\/button>\n        <\/section>\n\n        <!-- conversation -->\n        <section class=\"chat-view\" data-view=\"chat\">\n          <div class=\"chat-log\" data-chat-log role=\"log\" aria-live=\"polite\"><\/div>\n          <form class=\"chat-form\" data-chat-form>\n            <label class=\"sr-only\" for=\"chat-input\">Your message<\/label>\n            <input id=\"chat-input\" type=\"text\" placeholder=\"Ask a question about TruPulse…\" autocomplete=\"off\">\n            <button class=\"chat-icon chat-emoji\" type=\"button\" aria-label=\"Insert emoji\" title=\"Insert emoji\" data-chat-emoji><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"8.4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\"/><circle cx=\"9.3\" cy=\"10.2\" r=\"1.15\" fill=\"currentColor\"/><circle cx=\"14.7\" cy=\"10.2\" r=\"1.15\" fill=\"currentColor\"/><path d=\"M8.4 14.2a4.4 4.4 0 0 0 7.2 0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\"/><\/svg><\/button>\n            <button class=\"chat-send\" type=\"submit\" aria-label=\"Send message\" title=\"Send\" disabled><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M3.4 20.6 21 12 3.4 3.4l2.1 7.2 9 1.4-9 1.4-2.1 7.2Z\" fill=\"currentColor\"/><\/svg><\/button>\n          <\/form>\n          <div class=\"chat-picker\" data-chat-picker hidden>\n            <label class=\"chat-search\">\n              <span class=\"sr-only\">Search emoji<\/span><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"6.4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><path d=\"M15.8 15.8 20 20\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/><\/svg>\n              <input type=\"search\" placeholder=\"Search emoji\" autocomplete=\"off\" data-emoji-search>\n            <\/label>\n            <div class=\"chat-emoji-grid\" data-emoji-grid><\/div>\n          <\/div>\n        <\/section>\n\n        <!-- messages -->\n        <section class=\"chat-view\" data-view=\"messages\">\n          <p class=\"chat-section-title\">Start a new chat<\/p>\n          <button class=\"chat-card chat-card-btn\" type=\"button\" data-chat-new>\n            <span><strong>New conversation<\/strong><small>AI assistant<\/small><\/span>\n            <i aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M3.4 20.6 21 12 3.4 3.4l2.1 7.2 9 1.4-9 1.4-2.1 7.2Z\" fill=\"currentColor\"/><\/svg><\/i>\n          <\/button>\n          <p class=\"chat-section-title\">Recent<\/p>\n          <ul class=\"chat-threads\" data-chat-threads><\/ul>\n          <p class=\"chat-empty\" data-chat-empty>No conversations yet — start one above.<\/p>\n        <\/section>\n      <\/div>\n\n      <nav class=\"chat-tabs\" aria-label=\"Assistant sections\">\n        <button type=\"button\" class=\"is-on\" data-chat-tab=\"home\" aria-label=\"Home\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"/><\/svg><span>Home<\/span><\/button>\n        <button type=\"button\" data-chat-tab=\"messages\" aria-label=\"Messages\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M20 12.4c0 3.6-3.6 6.5-8 6.5-.9 0-1.7-.1-2.5-.3L5 21l1-3.2A6.6 6.6 0 0 1 4 12.4C4 8.8 7.6 6 12 6s8 2.8 8 6.4Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"/><\/svg><span>Messages<\/span><\/button>\n      <\/nav>\n    <\/div>\n\n    <button class=\"chat-launch\" type=\"button\" aria-expanded=\"false\" aria-label=\"Open chat\" data-chat-launch>\n      <svg class=\"chat-ring\" viewBox=\"0 0 120 120\" aria-hidden=\"true\" focusable=\"false\">\n<defs><path id=\"chat-ring-path\" d=\"M60 12a48 48 0 1 1 0 96 48 48 0 1 1 0-96\"/><\/defs>\n<text text-anchor=\"start\"><textPath href=\"#chat-ring-path\" startOffset=\"0\" textLength=\"301.6\" lengthAdjust=\"spacing\">we're here to help · we're here to help ·<\/textPath><\/text>\n<\/svg>\n      <span class=\"chat-launch-face\" aria-hidden=\"true\"><svg class=\"ico-bubble\" viewBox=\"0 0 32 32\" aria-hidden=\"true\" focusable=\"false\">\n<path d=\"M16 4c7.2 0 13 4.6 13 10.3S23.2 24.6 16 24.6c-1.2 0-2.4-.1-3.5-.4l-6 3a.7.7 0 0 1-1-.8l1.2-4A9.6 9.6 0 0 1 3 14.3C3 8.6 8.8 4 16 4Z\" fill=\"currentColor\"/>\n<circle cx=\"10.6\" cy=\"14.3\" r=\"1.9\" fill=\"var(--bubble-dot,#fff)\"/><circle cx=\"16\" cy=\"14.3\" r=\"1.9\" fill=\"var(--bubble-dot,#fff)\"/><circle cx=\"21.4\" cy=\"14.3\" r=\"1.9\" fill=\"var(--bubble-dot,#fff)\"/>\n<\/svg><\/span>\n      <span class=\"chat-launch-down\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/span>\n      <span class=\"chat-launch-hand\" aria-hidden=\"true\">👋<\/span>\n    <\/button>\n  <\/div>\n<script>\n/* ================= TruPulse assistant =================\n   Home → help centre search and a new-conversation card; a conversation with\n   quick replies, a typing beat and an emoji picker; a messages list that keeps\n   what you have already asked. The help centre searches this page's own FAQ,\n   so the answers here and the answers on the page can never drift apart. */\n(function () {\n  var dock = document.querySelector(\".chat-dock\");\n  if (!dock) return;\n  var panel = dock.querySelector(\"[data-chat-panel]\");\n  var launch = dock.querySelector(\"[data-chat-launch
