ent:center}\n  .button-row{display:grid;gap:10px}\n\n  /* header: mark left, menu right, and a dark blur behind the dropdown */\n  .site-header{padding-top:8px}\n  /* no padding of its own: the shell's 24px gutter is the header's margin too */\n  .nav-wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}\n  .brand-logo{margin-right:auto}\n  /* The hamburger lives inside .nav-actions, so the group stays laid out and\n     only its other children (Book a demo, Log in) step aside on a phone. */\n  .nav-actions{display:flex;gap:0;margin-left:auto}\n  .nav-actions>*:not(.menu-toggle){display:none!important}\n  .nav-wrap .menu-toggle{display:grid;width:40px;height:40px;border-radius:50%;padding:0}\n  .menu-toggle svg{width:19px;height:19px}\n  .main-nav{top:70px;padding:16px;border-radius:16px}\n  .nav-scrim{\n    position:fixed;z-index:90;inset:0;\n    background:rgba(9, 8, 31,.55);\n    backdrop-filter:blur(7px) saturate(120%);-webkit-backdrop-filter:blur(7px) saturate(120%);\n    animation:scrim-in .2s ease both;\n  }\n  .nav-scrim[hidden]{display:none!important}\n  @keyframes scrim-in{from{opacity:0}to{opacity:1}}\n  .site-header{z-index:120}\n  body.nav-open{overflow:hidden}\n\n  /* hero: three fixed lines, so a longer word cannot reflow the block */\n  .hero-grid{padding-top:0;gap:20px}\n  .h1-line{display:block}\n  .hero h1{font-size:var(--step-hero);line-height:1.14}\n  .audience-rotator{display:inline-block}\n  .hero-keyline{margin-top:14px}\n  .signal-stage{margin-top:4px}\n\n  /* product: the tabs stack instead of sliding sideways */\n  .product-tabs{\n    display:grid;grid-template-columns:1fr;overflow:visible;\n    border-bottom:1px solid var(--line);\n  }\n  .product-tab{\n    min-width:0;width:100%;padding:12px 14px;text-align:left;\n    border-right:0;border-bottom:1px solid var(--line);\n  }\n  .product-tab:last-child{border-bottom:0}\n  .product-tab strong{font-size:.875rem;text-align:left}\n  .product-tab.active::after{right:auto;left:0;width:3px;height:100%;top:0;transform-origin:top;transform:scaleY(var(--p,0))}\n  .product-panel{grid-template-columns:1fr;min-height:0}\n  .product-copy{padding:20px}\n  .product-copy h3{font-size:var(--step-h3)}\n  .walkthrough{min-height:210px;padding:18px}\n  .feature-list li{font-size:.75rem}\n\n  /* how it works: the three cards sit close together */\n  .flow{gap:10px}\n  .flow-card{min-height:0;padding:18px}\n  .flow-card h3{font-size:1rem;margin:10px 0 8px}\n  .flow-card p{font-size:.875rem}\n  .flow-card::before{width:34px;height:34px;font-size:.75rem}\n  .human-note{margin-top:14px;padding:16px}\n\n  /* workspace and reports rows */\n  .split-feature{gap:16px}\n  .dashboard-placeholder{min-height:190px;padding:18px}\n  .feature-rows li{padding:11px 0}\n  .feature-rows li>span{width:30px;height:30px;font-size:.75rem}\n  .feature-rows h3{font-size:.875rem}\n  .feature-rows li p,.reports-section .feature-rows li p{font-size:.75rem;max-width:none;min-height:0}\n\n  /* use cases: the questions wrap instead of running off the edge */\n  .use-case-explorer{gap:12px}\n  .use-case-tabs{display:grid;grid-template-columns:1fr;gap:8px;overflow:visible}\n  .use-case-tab{\n    width:100%;min-width:0;padding:11px 14px;\n    font-size:.75rem;line-height:1.35;white-space:normal;overflow:visible;text-overflow:clip;\n  }\n  .use-case-panel{padding:20px}\n  .use-case-panel h3{font-size:var(--step-h3)}\n  .use-case-panel>p:not(.section-label){font-size:.875rem}\n  .use-case-tags{padding-top:16px}\n  .use-case-tags span{font-size:.75rem}\n\n  /* trust: the dark card on top, the list beneath it, both readable */\n  .trust-layout{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}\n  .trust-hero-card{height:auto;min-height:0;padding:20px;order:1}\n  .trust-hero-card h3{font-size:1.125rem;line-height:1.24}\n  .trust-hero-card p{font-size:.875rem;color:rgba(255,255,255,.86)}\n  .trust-rows{display:block;height:auto;order:2}\n  .trust-rows li{height:auto;padding:11px 0}\n  .trust-rows li>div{display:block}\n  .trust-rows h3{font-size:.875rem}\n  .trust-rows p{font-size:.75rem;margin-top:3px}\n\n  /* the closing CTA: the ring centred behind the words, and less air */\n  .cta-layout{gap:16px}\n  .final-cta h2{font-size:var(--step-h2)}\n  .final-cta p{font-size:.875rem}\n  .cta-ring,.cta-orbit{left:50%;top:44%;width:min(300px,72vw)}\n  .cta-signal{padding:18px}\n  .cta-steps span{font-size:.75rem;padding:8px 12px}\n\n  /* resources and FAQ */\n  .blog-grid,.more-grid{gap:12px}\n  .faq-layout{gap:14px}\n  .faq-list summary{padding:14px 0;font-size:.875rem;gap:14px}\n  .faq-list summary::after{width:26px;height:26px;font-size:.875rem}\n  .faq-list details p{font-size:.875rem}\n\n  /* footer: the columns close up */\n  .site-footer{padding:26px 0 20px}\n  .footer-grid{display:grid;grid-template-columns:1fr;gap:20px}\n  .footer-links{display:grid;grid-template-columns:1fr 1fr;gap:16px}\n  .footer-about p{font-size:.875rem;margin-top:8px}\n  .footer-bottom{margin-top:18px;padding-top:14px;gap:8px;font-size:.75rem}\n\n  /* the assistant keeps a margin off both edges, ring included */\n  /* The launcher sits 28px in from both edges, and its ring is drawn 14px\n     proud of the button rather than 19px, so the whole ring clears the screen.\n     The panel is inset by the same 28px on both sides, so opening it does not\n     shift the widget against the edge it was resting on. */\n  .chat-dock{right:28px;bottom:28px}\n  .chat-ring{inset:-14px;width:calc(100% + 28px);height:calc(100% + 28px)}\n  .chat-panel{width:calc(100vw - 56px);height:min(78vh,560px)}\n\n  /* the demo dialog reads at phone size */\n  .modal{padding:14px}\n  .modal-panel{padding:18px;border-radius:20px}\n  .modal-title{padding:0 40px 12px 0}\n  .modal-title h2{font-size:1.125rem;line-height:1.2}\n  .modal-grid{display:grid;grid-template-columns:1fr;gap:16px}\n  .modal-video{padding:12px;border-radius:14px}\n  /* The still was shorter than the play button plus its two lines of caption,\n     so the button was pinned to the top edge and the caption spilled out the\n     bottom. The slot sizes to its own content again and the group centres. */\n  .developer-video-slot,.modal-video-slot{height:auto;min-height:176px;padding:16px 14px}\n  .developer-video-slot strong{margin-top:14px}\n  .developer-video-slot strong{font-size:.875rem}\n  .developer-video-slot small{font-size:.75rem}\n  .video-slot-play{width:46px;height:46px;font-size:.875rem}\n  .demo-form h3{font-size:1rem}\n  .demo-form p{font-size:.75rem}\n  .field{font-size:.75rem}\n  .field input,.field textarea{min-height:42px;font-size:.875rem}\n  .form-row{display:grid;grid-template-columns:1fr;gap:0}\n  .form-note{font-size:.75rem}\n\n  /* login: even margins, centred column, phone-sized type */\n  .login-nav{padding:0;justify-content:space-between}\n  .login-main{padding-inline:0}\n  .login-card{max-width:none;padding:24px 20px;border-radius:20px;text-align:center}\n  .login-pane h1,.login-card h1{font-size:1.5rem;line-height:1.18}\n  .login-card>p{font-size:.875rem}\n  .login-form{margin-top:20px}\n  .login-form>label{font-size:.75rem}\n  .login-form input{min-height:48px;font-size:.875rem}\n  .login-submit{min-height:50px;font-size:.875rem}\n  .login-footer{flex-wrap:wrap;gap:8px;font-size:.75rem;padding-bottom:18px}\n\n  /* legal and article pages */\n  .legal-nav,.article-nav{gap:10px}\n  .article-body h2{font-size:1.125rem}\n  .article-body p,.article-body li{font-size:.875rem}\n  .more-head h2{font-size:1.125rem}\n}\n\n/* ================= Blog cards, two across on a phone ================= */\n@media(max-width:680px){\n  .blog-grid,.more-grid,.blogs-grid,.idx-grid{grid-template-columns:1fr 1fr;gap:12px}\n  .bc-body{padding:12px}\n  .bc-eyebrow{font-size:.75rem;letter-spacing:.09em}\n  .bc-title{font-size:.875rem;margin:8px 0 6px;line-height:1.28}\n  .bc-desc{font-size:.75rem;line-height:1.45;-webkit-line-clamp:3}\n  .bc-action{font-size:.75rem;margin-top:12px}\n  /* the whole picture, never a crop, whatever the card width */\n  .bc-media{aspect-ratio:16/9;background:#f0efff}\n  .bc-media img{object-fit:contain}\n}\n\n/* ================= The article's contents rail ================= */\n/* Each heading sat in a filled white pill, which fought the page for attention\n   and turned a quiet list into a row of buttons. On a phone it is plain text,\n   and the heading you are reading is marked by weight and colour alone. */\n@media(max-width:680px){\n  .article-aside a{\n    padding:5px 0;border-radius:0;background:none;\n    color:var(--muted);font-size:.75rem;line-height:1.4;\n  }\n  .article-aside a.active{background:none;color:var(--ink);font-weight:800}\n  .article-aside{padding:16px 0 16px 14px}\n}\n\n/* ================= The hero heading, at every width ================= */\n/* Three lines that hold their shape while the rotating word changes, sized\n   from the viewport itself so the block fills the column at any width rather\n   than jumping between fixed sizes. */\n.hero h1 .h1-line{display:inline}\n@media(max-width:680px){\n  .hero h1{font-size:var(--step-hero);line-height:1.08;letter-spacing:-.035em}\n  .hero h1 .h1-line{display:block}\n  .hero h1 .h1-rot{min-height:1.08em}\n}\n/* On the narrowest phones still in use the longest line would touch the gutter,\n   so the floor comes down with the screen rather than letting it overflow. */\n@media(max-width:360px){\n  :root{--step-hero:clamp(2.25rem,9.4vw,2.25rem)}\n}\n\n@media(max-width:680px){\n  /* --- the cards go back to full width --------------------------------\n     Two across left each card too narrow to read: four-word lines, a title\n     broken over six rows, a picture too small to see. One per row is the\n     layout the site had, and it is the layout it keeps. */\n  .blog-grid,.more-grid,.blogs-grid,.idx-grid{grid-template-columns:1fr;gap:16px}\n  .bc-body{padding:18px}\n  .bc-eyebrow{font-size:.75rem;letter-spacing:.11em}\n  .bc-title{font-size:1rem;margin:10px 0 8px;line-height:1.22}\n  .bc-desc{font-size:.875rem;line-height:1.55;-webkit-line-clamp:3}\n  .bc-action{font-size:.75rem;margin-top:14px}\n  .bc-media{aspect-ratio:16/9;background:#f0efff}\n  .bc-media img{object-fit:contain}\n\n  /* --- the header, off the edge ---------------------------------------\n     The mark and the menu were flush against the 24px content gutter, which\n     read as pinned to the screen. The bar keeps its own inset on top of the\n     gutter, and enough height that neither sits tight to the rule beneath. */\n  .site-header{padding-top:10px}\n  .nav-wrap{padding:12px 8px;min-height:60px}\n  .brand-logo img,.brand-logo svg{height:26px}\n  .nav-wrap .menu-toggle{width:42px;height:42px}\n  .main-nav{top:82px}\n}\n\n@media(max-width:680px){\n  .site-header{padding:10px 0 0}\n  /* Two measurements, and they are separate things. The bar is a plate that\n     floats 24px in from each edge of the screen, the same gutter every other\n     block on the page uses. Inside that plate, 16px of padding on all four\n     sides holds the mark and the menu.\n     (An earlier pass pinned the bar to a fixed 62px, which with border-box\n     sizing squeezed its padding box to 28px and let the 40px button hang out\n     of it; the bar is sized by what it holds again.) */\n  .site-header .shell.nav-wrap{\n    width:calc(100% - 48px);max-width:none;margin-inline:auto;\n    padding:16px;height:auto;min-height:0;\n    display:flex;align-items:center;justify-content:space-between;gap:12px;\n  }\n  /* The row is as tall as its tallest child, so the 40px menu button fits\n     inside the padding box instead of overflowing it — otherwise the gap\n     above and below the button measures 11px while the padding says 16. */\n  .brand-logo{display:flex;height:40px;align-items:center}\n  .brand-logo img,.brand-logo svg{height:26px;display:block}\n  .nav-wrap .menu-toggle{width:40px;height:40px;margin:0;flex:0 0 auto}\n  /* the dropdown hangs eight pixels below the bar and lines up with its edges,\n     whatever the bar measures at that moment */\n  .main-nav{top:calc(100% + 8px);left:0;right:0}\n  .login-header .login-nav{padding:16px;min-height:0}\n  .legal-nav,.article-nav,.blogs-nav{padding:16px}\n\n  /* --- and it holds that size all the way down the page ------------------\n     The bar does not contract on scroll. The padding stays at 16, the mark\n     stays at 26 and the menu button stays at 40, at the top of the page and\n     everywhere below it — a bar that shrinks as you read makes the mark and\n     the menu move under the thumb that is reaching for them. What does change\n     on scroll is the plate behind them: transparent over the hero, glass once\n     there is content passing underneath. */\n  .site-header .shell.nav-wrap{\n    transition:background .35s ease,backdrop-filter .35s ease,\n               box-shadow .35s ease,border-color .35s ease;\n  }\n  .site-header.scrolled .shell.nav-wrap{padding:16px}\n  .site-header.scrolled .brand-logo{height:40px}\n  .site-header.scrolled .brand-logo img,.site-header.scrolled .brand-logo svg{height:26px}\n  .site-header.scrolled .nav-wrap .menu-toggle{width:40px;height:40px}\n  .site-header.scrolled .nav-wrap .menu-toggle svg{width:19px;height:19px}\n}\n\n@media(max-width:680px){\n  .product-shell{border-radius:20px;box-shadow:0 12px 32px rgba(17, 15, 53,.07)}\n\n  /* --- the three options ------------------------------------------------ */\n  .product-tabs{\n    display:grid;grid-template-columns:1fr;gap:8px;\n    padding:12px;border-bottom:1px solid var(--line);background:#fafaff;\n  }\n  .product-tab{\n    position:relative;display:flex;align-items:center;gap:10px;\n    padding:13px 14px;border:1px solid var(--line);border-right:1px solid var(--line);\n    border-radius:13px;background:#fff;overflow:hidden;\n    transition:border-color .2s ease,background .2s ease;\n  }\n  .product-tab strong{margin:0;font-size:.875rem;font-weight:750;line-height:1.25}\n  .product-tab span{display:none}\n  /* a ring on the left says which one you are on, the way a radio would */\n  .product-tab::before{\n    content:\"\";flex:0 0 auto;width:15px;height:15px;border-radius:50%;\n    border:2px solid #d4d3ea;background:#fff;transition:border-color .2s ease,box-shadow .2s ease;\n  }\n  .product-tab.active{border-color:rgba(103, 95, 252,.45);background:#f3f2ff}\n  .product-tab.active strong{font-weight:850}\n  .product-tab.active::before{border-color:var(--violet);box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 9px var(--violet)}\n  /* The fifteen-second line runs along the bottom of the option you are on —\n     and only that one. Painting every ::after left a violet bar under the\n     options you were not reading. */\n  .product-tab::after{\n    right:0;bottom:0;left:0;height:3px;border-radius:0;\n    background:transparent;transform:scaleX(0);transform-origin:left;\n  }\n  .product-tab.active::after{background:var(--violet);transform:scaleX(var(--p,0))}\n\n  /* --- the panel, in parts ---------------------------------------------- */\n  .product-panel{display:block;min-height:0}\n  .product-copy{padding:20px 16px 4px}\n  .product-copy .kicker{font-size:.75rem;letter-spacing:.12em}\n  .product-copy h3{max-width:none;margin:9px 0 10px;font-size:1.125rem;line-height:1.16;letter-spacing:-.025em}\n  .product-copy>p{margin:0;font-size:.875rem;line-height:1.6}\n\n  /* what it gives you: each capability on its own tinted row */\n  .feature-list{gap:7px;margin:16px 0 0}\n  .feature-list li{\n    align-items:flex-start;gap:9px;padding:10px 12px;\n    border-radius:11px;background:#f6f6fd;\n    font-size:.75rem;font-weight:700;line-height:1.42;\n  }\n  .feature-list i{flex:0 0 auto;width:19px;height:19px;margin-top:1px;font-size:.75rem}\n\n  /* who it suits: the run-on line becomes the tags it always was */\n  .best-for{margin-top:16px;padding-top:14px}\n  .best-for small{font-size:.75rem;letter-spacing:.12em}\n  .best-for strong{display:block;margin-top:9px;font-size:.75rem}\n  /* once the tags are built the sentence steps aside — display:block above\n     would otherwise beat the browser's own rule for a hidden element */\n  .best-for strong[hidden]{display:none!important}\n  .best-for-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}\n  .best-for-tags b{\n    padding:6px 11px;border:1px solid rgba(103, 95, 252,.22);border-radius:999px;\n    background:#f5f4ff;color:#3a3596;font-size:.75rem;font-weight:750;\n  }\n\n  /* what it looks like: framed inside the card, not bleeding off it */\n  .walkthrough{min-height:0;padding:16px;background:transparent}\n  .walkthrough::before{display:none}\n  .walkthrough .developer-video-slot{\n    width:100%;min-height:172px;border-radius:16px;padding:16px 14px;\n  }\n  .walkthrough .developer-video-slot strong{margin-top:13px;font-size:.875rem;line-height:1.3}\n  .walkthrough .developer-video-slot small{font-size:.75rem}\n}\n\n/* ---- the hero's supporting line, under the buttons ---- */\n.hero-cta-support{\n  max-width:46ch;margin:16px 0 0;color:var(--muted);\n  font-size:.875rem;line-height:1.55;\n}\n\n/* ---- the proof strip's attribution and case-study link ---- */\n.trust-strip-note{\n  display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;\n  margin-top:12px;color:var(--muted);font-size:.75rem;\n}\n.case-study-link{\n  display:inline-flex;gap:6px;align-items:center;\n  color:var(--violet);font-weight:750;\n}\n.case-study-link span{transition:transform .2s ease}\n.case-study-link:hover span{transform:translateX(3px)}\n/* no case study page exists yet, so the link is shown but does not navigate */\n.case-study-link[aria-disabled=\"true\"]{cursor:default;opacity:.62}\n.case-study-link[aria-disabled=\"true\"]:hover span{transform:none}\n\n@media(max-width:680px){\n  .hero-cta-support{margin-top:12px;font-size:.75rem}\n  .trust-strip-note{margin-top:10px;font-size:.75rem}\n}\n\n/* ---- merged How TruPulse Works: steps select the visual ----\n   .feature-rows li is a 44px/1fr grid, so a <li> holding one <button> would put\n   the whole step in the 44px number column. The row becomes a block and the\n   button carries the grid instead. */\n.step-rows li{display:block;padding:20px 0;border-bottom:1px solid var(--line);opacity:.62;transition:opacity .25s ease}\n.step-rows li:last-child{border-bottom:0}\n.step-rows li.active,.step-rows li:hover{opacity:1}\n.step-rows li button{display:grid;grid-template-columns:44px 1fr;gap:18px;width:100%;padding:0;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}\n.step-rows li button>span{display:grid;width:38px;height:38px;place-items:center;border-radius:50%;background:var(--lilac);color:var(--violet);font-size:.75rem;font-weight:900}\n.step-rows li:nth-child(2) button>span{background:#fff0e8;color:var(--coral)}\n.step-rows li:nth-child(3) button>span{background:#e5f9f3;color:var(--teal)}\n.step-rows li:nth-child(4) button>span{background:#efeeff;color:#3a34a5}\n.step-rows li.active h3{color:#3b34c6}\n\n/* ---- unnumbered benefit rows (Reports, Your brand) ---- */\n.plain-rows{list-style:none;margin:0;padding:0}\n.plain-rows li{display:block;position:relative;padding:20px 0 20px 24px;border-bottom:1px solid var(--line)}\n.plain-rows li:last-child{border-bottom:0}\n.plain-rows li::before{content:\"\";position:absolute;left:2px;top:28px;width:9px;height:9px;border-radius:50%;background:var(--coral)}\n.plain-rows li:nth-child(2n)::before{background:var(--violet)}\n.report-formats{margin:22px 0 0;color:var(--muted);font-size:.875rem}\n/* Dirk: the report preview is the focal point, so it leads on the left */\n.reports-section .split-feature{grid-template-columns:1.15fr .85fr}\n.reports-section .split-feature>.dashboard-placeholder{order:1}\n.reports-section .split-feature>.feature-rows{order:2}\n@media(max-width:900px){.reports-section .split-feature{grid-template-columns:1fr}}\n\n/* ---- use cases ---- */\n.uc-chip-label,.use-case-ways small{display:block;color:var(--muted);font-size:.75rem;font-weight:850;letter-spacing:.13em;text-transform:uppercase}\n/* the panel is a 4-row grid; it now holds six children */\n.use-case-panel{grid-template-rows:auto auto auto auto auto auto}\n.use-case-panel .uc-chip-label{margin:26px 0 0}\n.use-case-panel .use-case-ways p{margin:8px 0 0}\n.use-case-panel .use-case-tags{margin-top:12px}\n.use-case-ways{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}\n.use-case-ways p{margin:8px 0 0;color:var(--muted);font-size:.875rem;line-height:1.6}\n.uc-outro{display:flex;flex-wrap:wrap;gap:18px 26px;align-items:center;justify-content:space-between;margin-top:26px;padding:24px 26px;border:1px solid var(--line);border-radius:22px;background:#fff}\n.uc-outro strong{display:block;font-family:var(--display);font-size:1.125rem;letter-spacing:-.02em}\n.uc-outro p{margin:6px 0 0;color:var(--muted);font-size:.875rem}\n\n/* ---- your brand preview ---- */\n.brand-preview strong{margin-top:10px}\n\n/* ---- FAQ ---- */\n.faq-intro .btn{margin-top:22px}\n.faq-prompts{display:flex;flex-direction:column;gap:10px;margin-top:16px}\n.faq-prompts button{padding:11px 15px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);font:inherit;font-size:.75rem;text-align:left;cursor:pointer;transition:border-color .2s ease,transform .2s ease}\n.faq-prompts button:hover{border-color:var(--violet);transform:translateY(-1px)}\n.faq-alt{margin:18px 0 0;color:var(--muted);font-size:.875rem}\n.linkish{padding:0;border:0;background:none;color:var(--violet);font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}\n.cta-alt{margin:16px 0 0;color:rgba(255,255,255,.78);font-size:.875rem}\n/* the three journey labels are longer words now, so they wrap rather than spill */\n.cta-steps{flex-wrap:wrap}\n.cta-steps span{padding:10px 12px;font-size:.75rem;line-height:1.25;text-align:center}\n.cta-alt .linkish{color:#fff}\n\n/* ---- footer ---- */\n.footer-sub{margin:10px 0 0;font-size:.75rem;opacity:.72}\n\n/* ---- demo dialog ---- */\n.modal-deck{margin:10px 0 0;color:var(--muted);font-size:.875rem;line-height:1.6}\n.modal-video-note{margin-top:18px}\n.modal-video-note strong{display:block;font-family:var(--display);font-size:1rem;letter-spacing:-.02em}\n.modal-video-note p{margin:8px 0 6px;color:var(--muted);font-size:.875rem}\n.modal-video-note ul{margin:0;padding-left:18px;color:var(--muted);font-size:.875rem;line-height:1.6}\n.modal-video-note li{margin:5px 0}\n\n@media(max-width:680px){\n  .step-rows li button{gap:12px}\n  .uc-outro{flex-direction:column;align-items:flex-start;padding:18px}\n  .uc-outro .btn{width:100%;justify-content:center}\n  .faq-intro .btn{width:100%;justify-content:center}\n  .use-case-ways p{font-size:.875rem}\n}\n\n/* ---- v2: the proof strip gains a headline above the figures ---- */\n.trust-strip-head{margin-bottom:16px}\n.trust-strip-head .trust-strip-label{margin:0 0 10px;color:var(--coral);font-family:var(--body);font-size:.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}\n.trust-strip-head h2{margin:0;max-width:22ch;font-family:var(--display);font-size:clamp(1.5rem,3.7vw,2.25rem);line-height:1.14;letter-spacing:-.03em}\n.trust-strip-grid{grid-template-columns:repeat(4,1fr)}\n.trust-metric:first-child{border-left:0}\n\n/* ---- v2: the reports closing block ---- */\n.report-formats{margin:26px 0 0}\n.report-formats strong{display:block;font-family:var(--display);font-size:1rem;letter-spacing:-.02em;color:var(--ink)}\n.report-formats p{margin:7px 0 0;color:var(--muted);font-size:.875rem;line-height:1.65}\n\n/* ---- v2: \"Explore this in a demo\" ---- */\n.uc-demo{margin-top:22px}\n\n@media(max-width:980px){.trust-strip-grid{grid-template-columns:repeat(2,1fr)}\n  .trust-metric:nth-child(3){border-left:0}}\n@media(max-width:680px){\n  .trust-strip-head h2{font-size:1.125rem}\n  .trust-strip-grid{grid-template-columns:1fr}\n  .trust-metric{border-left:0}\n  .uc-demo{width:100%;justify-content:center}\n}\n\n/* ===================== footer ===================== */\n.site-footer{padding:76px 0 30px}\n.footer-grid{grid-template-columns:minmax(260px,1fr) minmax(0,1.35fr);gap:56px 72px;align-items:start}\n.footer-about p{max-width:42ch;font-size:.875rem;line-height:1.65}\n.footer-sub{margin:12px 0 0;font-size:.75rem;line-height:1.6;opacity:.68}\n\n/* three columns that never squeeze below a readable width */\n.footer-links{grid-template-columns:repeat(3,minmax(150px,1fr));gap:40px 48px}\n.footer-links strong{margin-bottom:18px;font-size:.75rem;letter-spacing:.1em}\n.footer-links a{margin:0;padding:7px 0;font-size:.875rem;line-height:1.45}\n\n.footer-bottom{margin-top:60px;padding-top:24px;font-size:.75rem;align-items:center}\n.legal-footer-links{display:flex;gap:10px;align-items:center}\n\n/* below 1040px the brand sits above the links, which get the full width */\n@media(max-width:1040px){\n  .footer-grid{grid-template-columns:1fr;gap:44px}\n  .footer-about p{max-width:60ch}\n  .footer-links{grid-template-columns:repeat(3,minmax(160px,1fr));gap:36px 40px}\n}\n/* two columns before anything has to wrap awkwardly */\n@media(max-width:720px){\n  .site-footer{padding:52px 0 26px}\n  .footer-links{grid-template-columns:repeat(2,minmax(140px,1fr));gap:32px 28px}\n  .footer-bottom{margin-top:38px}\n}\n/* one column on a phone, with the rows far enough apart to tap */\n@media(max-width:520px){\n  .site-footer{padding:34px 0 24px}\n  .footer-links{grid-template-columns:1fr;gap:28px}\n  .footer-links strong{margin-bottom:12px}\n  .footer-links a{padding:9px 0}\n  .footer-bottom{margin-top:30px;gap:12px;flex-direction:column;align-items:flex-start}\n}\n\n/* ============ readability (not animation) ============ */\n.report-formats p,.human-note p,.use-case-ways p,.section-head>p,.hero .lead,\n.vid-deck,.cs-deck,.uc-outro p,.trust-strip-note span,.faq-intro p,\n.use-case-panel>p,.product-copy p,.legal-copy p,.article-body p,.cs-body p,\n.idx-hero p,.vid-lead-copy p,.chat-greet-sub,.modal-deck,.demo-form>p{max-width:68ch}\n.trust-strip-head h2{max-width:26ch}\n.plain-rows li p,.step-rows li p{max-width:60ch}\n@media(max-width:680px){\n  .use-case-tags span,.bc-eyebrow,.trust-metric span,.cs-figure span{font-size:.75rem}\n}\n\n/* ============ the four steps stay fully visible ============ */\n/* asked for earlier: no step is dimmed; the current one is marked by colour */\n.step-rows li{opacity:1}\n.step-rows li.active h3{color:var(--violet)}\n\n/* ===== v3 §13 · contrast and readable labels ===== */\n:root{--coral-ink:#EE851B}\n.eyebrow,.section-label,.bc-eyebrow,.cs-cta-eyebrow,.vid-cta-eyebrow,.uc-chip-label,.use-case-ways small,.cs-aside strong,.product-copy .kicker,.idx-pill.active,.chat-ring text,.trust-strip-head .trust-strip-label,.best-for small,.panel-label,.kicker{color:var(--coral-ink)}\n/* footer headings keep the brand coral, at the readable tone */\n.footer-links strong{color:var(--coral-ink)}\n.btn.primary{background:var(--coral);box-shadow:0 12px 24px rgba(238,133,27,.26)}\n.btn.primary:hover{background:#EE851B}\n/* Link hovers are interactive text, not labels, so they keep a readable\n   orange chosen for the background they sit on: the darker tone on the\n   light pages, the brand orange in the dark footer where it is the\n   stronger of the two. */\n.text-link:hover,.main-nav a:hover{color:#EE851B}\n.footer-links a:hover{color:#EE851B}\n.eyebrow,.section-label{font-size:.75rem}\n.form-note,.bc-eyebrow,.trust-metric span,.cs-figure span,.use-case-tags span,.uc-chip-label,.use-case-ways small,.cs-aside a{font-size:.75rem}\n.footer-links strong{font-size:.75rem}\n@media(max-width:680px){\n  .eyebrow,.section-label{font-size:.75rem;letter-spacing:.1em}\n  .form-note,.bc-eyebrow,.trust-metric span,.cs-figure span,.use-case-tags span,.uc-chip-label,.use-case-ways small{font-size:.75rem}\n  .demo-form .field{font-size:.875rem}\n  .login-form>label{font-size:.75rem}\n}\n\n/* ---- proof strip: eyebrow alignment and summary row ----\n   The eyebrow used to be the first cell inside the metric card and still\n   carried that cell's min-height:112px and padding:22px 26px. Out of the\n   card those became a 26px indent and a ~70px void above the headline.\n   .trust-metric keeps the original rule; only the label is corrected. */\n.trust-strip-head .trust-strip-label{display:block;min-height:0;padding:0;margin:0 0 14px}\n/* The old cell padding was also what held the eyebrow clear of the hero\n   above it. Put that breathing room back on the band itself. */\n@media(max-width:520px){.trust-strip{padding-top:20px}}\n@media(min-width:521px){.trust-strip{padding-top:28px}}\n@media(min-width:981px){.trust-strip{padding-top:48px}}\n\n/* The summary line runs the full width of the metric card above it, with\n   the link on its own line underneath. One line from 1440px up; below\n   that it wraps naturally. */\n.trust-strip-note{display:block}\n\n/* ---- How It Works: all four steps visible, one explained ----\n   Every step keeps its number, its heading and full opacity — nothing is\n   dimmed. Only the selected step shows its paragraph, which is what the\n   picture beside it is already wired to follow. Four paragraphs at once\n   was 179 words against an empty frame; this is the same component doing\n   what it was built to do. */\n.step-rows li>button>div>p{display:none}\n.step-rows li.active>button>div>p{display:block}\n.step-rows li{opacity:1}\n.step-rows li>button{cursor:pointer}\n\n/* ---- Reports and Trust: the static lists go two across ----\n   These lists have no selected state to collapse, so the only way to stop\n   them towering over the picture is to let them run in two columns. Four\n   items become 2x2, five become 3+2, and the column height drops by\n   roughly half. */\n@media(min-width:1180px){\n  .reports-section .feature-rows{\n    display:grid;grid-template-columns:1fr 1fr;column-gap:34px;align-content:start;\n  }\n  /* the marker is absolutely positioned at left:2px, so the row keeps\n     left padding to clear it */\n  .reports-section .feature-rows>li{border-top:0;padding:0 0 24px 24px}\n}\n.step-rows li:not(.active) h3{color:var(--ink)}\n.step-rows li.active h3{color:var(--violet)}\n\n/* ---- picture and text, in proportion ----\n   The picture was 705px of mostly-empty frame against a 521px column of\n   dense text: the widest thing on the row carried the least, and the\n   narrowest carried the most. Reversed. The picture is now 560px in all\n   three sections (Trust already used 560, so the three finally match),\n   and the text column takes the rest — which also widens the paragraphs\n   so they wrap to fewer lines and stop reading as a wall. */\n@media(min-width:981px){\n  .split-feature,\n  .reports-section .split-feature{grid-template-columns:560px minmax(0,1fr)}\n  .split-feature>.feature-rows p,\n  .plain-rows li p,.step-rows li p{max-width:72ch}\n}\n\n/* ---- two defects ----\n   1. .use-case-panel .uc-chip-label{margin:26px 0 0} was written to give\n      the Example use cases label room, but .use-case-panel>p:not(.section-label)\n      {margin:0} outranks it (the :not() argument adds a point of\n      specificity), so the label sat flush against the paragraph above it.\n      Restated here at a specificity that holds.\n   2. The two closing cards carried different label treatments: one\n      uppercase with tracking, one sentence case. Both now render the\n      words as they are written in the markup, styled as labels by weight\n      and colour instead of by transforming the text. */\n.use-case-panel>p.uc-chip-label{margin:26px 0 0}\n.human-note strong,.report-formats strong{\n  color:var(--coral);font-size:.75rem;font-weight:800;\n  letter-spacing:0;text-transform:none;\n}\n\n/* ---- type scale: hold the headings on a step below desktop too ----\n   Fluid headings are mid-climb at phone and tablet widths, which puts\n   them between steps (25.35px, 28.42px, 38.4px). Pinned to the scale. */\n@media(max-width:980px){\n  .hero-copy h1{font-size:2.25rem}\n  .section-head h2,.trust-strip-head h2,.faq-layout h2,.cta-layout h2,\n  .use-case-panel h3,.product-copy h3{font-size:1.5rem}\n}\n\n/* ---- final CTA joins the section rhythm ----\n   It had its own padding at every width: 28 where sections used 24, 80\n   where they used 60, 80 where they used 76, and 80 where they used 96 —\n   so above 1800px it was the tightest band on the page instead of the\n   most generous. Matched to .section at each breakpoint. */\n@media(max-width:680px){.final-cta{padding:24px 0}}\n@media(min-width:681px){.final-cta{padding:60px 0}}\n@media(min-width:981px){.final-cta{padding:76px 0}}\n@media(min-width:1800px){.final-cta{padding:96px 0}}\n\n/* ---- product walkthrough video ----\n   The slot was width:100% with a fixed min-height:370px, so its shape\n   drifted from 1.48 to 2.30 across screen sizes and never matched the\n   16:9 of real footage. Lock the ratio and let the height follow the\n   width. The dark panel keeps its own height and centres the video. */\n#product .developer-video-slot{aspect-ratio:16/9;min-height:0;height:auto}\n\n/* ---- screenshot placeholders ----\n   Same problem as the video, worse: these had no ratio and no fixed\n   height either, so their height came from whatever column sat beside\n   them. They ranged from 0.37 to 4.26. Locked to 16:9, matching the\n   walkthrough video, so every media box on the site is one shape.\n   .split-feature>.dashboard-placeholder carried height:100%, which fed\n   the row height back into the ratio and blew the picture across the\n   text column — that is why height is reset here too. */\n.dashboard-placeholder{aspect-ratio:16/9;min-height:0;height:auto;align-self:center}\n.split-feature>.dashboard-placeholder{height:auto;min-height:0;min-width:0}\n\n/* ---- section balance ----\n   1. The picture sits in a row whose height comes from the list beside it,\n      and it was centred in that row — so with the list 118-163px taller the\n      picture floated ~80px below the list's first line and nothing lined\n      up. Top-aligned, the two columns start together.\n   2. .report-formats had no styling at all beyond a margin and a colour,\n      so 'Your findings, your format' read as an orphan with ~700px of\n      empty space beside it. It now uses the same card as .human-note in\n      How It Works, so the two sections close the same way.\n   3. Both of those closing blocks sat 18px and 26px under their row,\n      against 54px gaps elsewhere in the same sections. Now 40px. */\n@media(min-width:981px){\n  .split-feature>.dashboard-placeholder,\n  .trust-layout>.dashboard-placeholder{align-self:start}\n}\n.human-note{margin-top:40px}\n.report-formats{\n  display:grid;grid-template-columns:.34fr 1fr;gap:30px;\n  margin:40px 0 0;padding:24px 28px;border-radius:20px;\n  background:var(--ink);color:#fff;font-size:.75rem;\n}\n/* Sentence case kept: uppercasing would change the words on screen and\n   strand the full stop. Styled as a label by colour and weight instead. */\n.report-formats strong{color:var(--coral);font-size:.75rem;font-weight:800;letter-spacing:0}\n.report-formats p{margin:0;max-width:none;color:#d5d4ea;font-size:.75rem}\n@media(min-width:981px){\n  .report-formats{min-height:78px;grid-template-columns:280px minmax(0,1fr);align-items:center}\n  .report-formats strong{white-space:nowrap}\n}\n@media(max-width:980px){\n  .human-note,.report-formats{margin-top:28px}\n  .report-formats{grid-template-columns:1fr;gap:8px;padding:20px 26px}\n}\n@media(max-width:680px){\n  .human-note,.report-formats{margin-top:20px;padding:16px}\n}\n@media(max-width:360px){\n  /* the smallest phones: trim the inside so the caption still clears\n     the edges without breaking the ratio */\n  .dashboard-placeholder{padding:14px}\n  .dashboard-placeholder .placeholder-mark{width:46px;height:46px}\n  .dashboard-placeholder strong{margin-top:10px;font-size:.875rem}\n  .dashboard-placehol tion.final-cta{padding-top:51px!important}}@media (min-width:981px) and (max-width:1180px){main>section.final-cta{padding-top:43px!important}}@media (max-width:980px){main>section.final-cta{padding-top:34px!important}}@media (min-width:681px) and (max-width:980px){main>section.trust-strip{padding-top:8px!important}main>section.final-cta{padding-top:35px!important}}<\/style><style id=\"tp-kl\">.hero-keyline .tp-kl{display:inline-flex;align-items:center;flex-wrap:wrap;gap:0}.hero-keyline .tp-kl strong{margin:0!important;padding:0!important}.hero-keyline .tp-kl b{display:inline-block;margin:0 4px;font-weight:inherit}<\/style><\/head>\n<body>\n  <a class=\"skip-link\" href=\"#top\">Skip to main content<\/a>\n  <div class=\"nav-scrim\" data-nav-scrim hidden><\/div>\n  <header class=\"site-header\">\n    <div class=\"shell nav-wrap\">\n      <a class=\"logo brand-logo\" href=\"#top\" aria-label=\"TruPulse home\"><img src=\"__ASSET1__\" alt=\"TruPulse\" width=\"384\" height=\"121\"><\/a>\n      <nav class=\"main-nav\" aria-label=\"Main navigation\">\n        <a href=\"#product\">Product<\/a><a href=\"#how-it-works\">How It Works<\/a><a href=\"#use-cases\">Use Cases<\/a><a href=\"#reports\">Reports<\/a><a href=\"#resources\">Resources<\/a>\n        <div class=\"mobile-actions\"><a class=\"login\" href=\"/login\" data-single-route=\"login\">Sign in<\/a><button class=\"btn primary\" type=\"button\" data-open-demo=\"form\">Book a Demo <span>→<\/span><\/button><\/div>\n      <\/nav>\n      <div class=\"nav-actions\"><a class=\"login\" href=\"/login\" data-single-route=\"login\">Sign in<\/a><button class=\"btn primary\" type=\"button\" data-open-demo=\"form\">Book a Demo <span>→<\/span><\/button><button class=\"icon-btn menu-toggle\" type=\"button\" aria-label=\"Toggle navigation\" aria-expanded=\"false\" data-menu-toggle><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M4 7h16M4 12h16M4 17h16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.1\" stroke-linecap=\"round\"/><\/svg><\/button><\/div>\n    <\/div>\n  <\/header>\n\n  <main id=\"top\">\n    <section class=\"hero\">\n      <div class=\"shell hero-grid\">\n        <div class=\"hero-copy reveal in\">\n          <p class=\"eyebrow\">AI-powered research. Human insight.<\/p>\n          <h1><span class=\"h1-line\">Go beyond what people think.<\/span> <span class=\"h1-line\"><em>Understand why.<\/em><\/span><\/h1>\n          <p class=\"lead\">TruPulse uses AI to create, conduct, and analyze surveys, 1:1 discussions, and focus groups. Your team sets the direction, approves the research, and reviews the findings&mdash;getting richer feedback with less manual work.<\/p>\n          <div class=\"button-row\"><button class=\"btn primary\" type=\"button\" data-open-demo=\"form\">Book a Demo <span>&rarr;<\/span><\/button><button class=\"btn outline\" type=\"button\" data-single-route=\"videos\" hidden style=\"display:none\"><span class=\"play\">▶<\/span>Watch Product Demo<\/button><\/div>\n          <p class=\"hero-cta-support\">Bring one question about your organization. See how TruPulse researches it.<\/p>\n          <div class=\"hero-keyline\"><i aria-hidden=\"true\"><\/i><span class=\"tp-kl\"><strong>1:1 Discussions<\/strong><b aria-hidden=\"true\">·<\/b>Focus Groups<b aria-hidden=\"true\">·<\/b>Surveys<\/span><\/div>\n        <\/div>\n        <div class=\"signal-stage reveal in delay-1\" aria-label=\"TruPulse walkthrough video preview\">\n          <div class=\"developer-video-slot hero-video-frame\">\n            <div class=\"hero-video-content\">\n              <button class=\"video-slot-play\" type=\"button\" aria-label=\"Play the TruPulse product walkthrough video\" data-open-video=\"hero\" data-video-title=\"TruPulse product walkthrough\">▶<\/button>\n              <strong>TruPulse product walkthrough<\/strong>\n              <small>A two-minute tour of the TruPulse research workflow<\/small>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"trust-strip\" aria-label=\"Customer case study\">\n      <div class=\"shell trust-strip-head\">\n        <p class=\"trust-strip-label\">Customer case study<\/p>\n        <h2>50 top performers. Answers in two weeks. A clear path to action.<\/h2>\n      <\/div>\n      <div class=\"shell trust-strip-grid\">\n        <div class=\"trust-metric\"><strong>50<\/strong><span>Top performers participated<\/span><\/div>\n        <div class=\"trust-metric\"><strong>25+ hours<\/strong><span>Discussions analyzed<\/span><\/div>\n        <div class=\"trust-metric\"><strong>2 weeks<\/strong><span>From setup to executive report<\/span><\/div>\n        <div class=\"trust-metric\"><strong>2 leaders<\/strong><span>Oversaw the research<\/span><\/div>\n      <\/div>\n      <div class=\"shell trust-strip-note\">\n        <span>The CEO needed answers quickly. TruPulse researched 50 top sales performers and delivered findings in two weeks. Those findings informed targeted training, updated job descriptions, and plans to expand the research.<\/span>\n        <a class=\"case-study-link\" href=\"/case-study\" data-single-route=\"case-study\">Read the case study <span aria-hidden=\"true\">→<\/span><\/a>\n      <\/div>\n    <\/section>\n\n    <section class=\"section\" id=\"product\">\n      <div class=\"shell\">\n        <header class=\"section-head reveal\"><div><p class=\"section-label\">Product<\/p><h2>Choose the research experience that fits your question.<\/h2><\/div><p>One platform. Three session types: 1:1 Discussions, Surveys, and Focus Groups. Select a tab to explore when to use each, its benefits, and a walkthrough.<\/p><\/header>\n        <div class=\"product-shell reveal\">\n          <div class=\"product-tabs\" role=\"tablist\" aria-label=\"TruPulse product features\">\n            <button class=\"product-tab active\" type=\"button\" role=\"tab\" id=\"ptab-0\" aria-controls=\"ppanel\" aria-selected=\"true\" tabindex=\"0\" data-product-tab><strong>AI-led 1:1 discussions<\/strong><\/button>\n            <button class=\"product-tab\" type=\"button\" role=\"tab\" id=\"ptab-1\" aria-controls=\"ppanel\" aria-selected=\"false\" tabindex=\"-1\" data-product-tab><strong>Surveys with AI-powered follow-ups<\/strong><\/button>\n            <button class=\"product-tab\" type=\"button\" role=\"tab\" id=\"ptab-2\" aria-controls=\"ppanel\" aria-selected=\"false\" tabindex=\"-1\" data-product-tab><strong>AI-moderated focus groups<\/strong><\/button>\n          <\/div>\n          <div class=\"product-panel\" id=\"ppanel\" role=\"tabpanel\" aria-labelledby=\"ptab-0\" tabindex=\"0\" data-product-panel><\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    \n\n    <section class=\"section alt workspace-section\" id=\"how-it-works\">\n      <div class=\"shell\">\n        <header class=\"section-head reveal\"><div><p class=\"section-label\">How TruPulse Works<\/p><h2>You set the direction. TruPulse does the research.<\/h2><\/div><p>From your first question to findings you can use, in four steps.<\/p><\/header>\n        <div class=\"split-feature reveal\">\n          <div class=\"tp-shot tp-hiw-stage\" style=\"aspect-ratio:16/9\" data-step-visual><span hidden data-step-title><\/span><span hidden data-step-note><\/span><img src=\"[BASE64_ASSET]\" alt=\"Session setup: research objective and drafted questions\" width=\"1600\" height=\"900\" loading=\"lazy\" decoding=\"async\" data-i=\"0\" class=\"on\"><img src=\"[BASE64_ASSET]\" alt=\"Inviting the right participants and tracking who has started\" width=\"1600\" height=\"900\" loading=\"lazy\" decoding=\"async\" data-i=\"1\"><img src=\"[BASE64_ASSET]\" alt=\"A live AI-led conversation asking follow-up questions\" width=\"1600\" height=\"900\" loading=\"lazy\" decoding=\"async\" data-i=\"2\"><img src=\"[BASE64_ASSET]\" alt=\"Key finding with supporting quote and suggested next steps\" width=\"1600\" height=\"900\" loading=\"lazy\" decoding=\"async\" data-i=\"3\"><\/div>\n          <ol class=\"feature-rows step-rows\" data-step-rows>\n            <li class=\"active\"><button type=\"button\" data-step=\"0\" data-visual=\"Session creation and question review\" data-label=\"Define what you want to understand\"><span>01<\/span><div><h3>Define what you want to understand<\/h3><p>Start with your own topic, research objective, or a ready-made template from the use case library. TruPulse&rsquo;s session creation agent asks questions to clarify your audience, goals, and important details you might otherwise overlook. Together, you shape a session guide for your review and approval before launch.<\/p><\/div><\/button><\/li>\n            <li><button type=\"button\" data-step=\"1\" data-visual=\"Participant selection and invitations\" data-label=\"Invite the right participants\"><span>02<\/span><div><h3>Invite the right participants<\/h3><p>Choose who you want to hear from using saved contacts, participant groups, or an imported list. Send invitations and track participation in one workspace.<\/p><\/div><\/button><\/li>\n            <li><button type=\"button\" data-step=\"2\" data-visual=\"An AI-led participant conversation\" data-label=\"Let AI conduct the research\"><span>03<\/span><div><h3>Let AI conduct the research<\/h3><p>TruPulse guides participants through the session, asking relevant follow-up questions to explore their answers and understand the reasons behind them.<\/p><\/div><\/button><\/li>\n            <li><button type=\"button\" data-step=\"3\" data-visual=\"Findings and supporting evidence\" data-label=\"Review the findings and decide what&rsquo;s next\"><span>04<\/span><div><h3>Review the findings and decide what&rsquo;s next<\/h3><p>TruPulse analyzes responses and prepares reports with key findings, themes, and supporting evidence. Your team reviews the results and decides how to act.<\/p><\/div><\/button><\/li>\n          <\/ol>\n        <\/div>\n        <div class=\"human-note reveal\"><strong>Connect your sessions. See the bigger picture.<\/strong><p>Group related sessions into a Campaign. Review each session’s report, then explore a Campaign report that brings together insights from all its sessions.<\/p><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section reports-section\" id=\"reports\">\n      <div class=\"shell\">\n        <header class=\"section-head reveal\"><div><p class=\"section-label\">Reports built around your question<\/p><h2>From every response to one clear view.<\/h2><\/div><p>TruPulse turns participant feedback into structured reports that connect findings to your research objectives&mdash;with supporting evidence and suggested next steps for your team to review.<\/p><\/header>\n        <div class=\"split-feature reveal\">\n          <div class=\"tp-shot tp-rep-stage\" style=\"aspect-ratio:5/3\"><img class=\"on\" src=\"[BASE64_ASSET]\" alt=\"Key findings: three findings tied to the research objective\" width=\"1600\" height=\"960\" loading=\"lazy\" decoding=\"async\"><img src=\"[BASE64_ASSET]\" alt=\"Recurring themes and where perspectives differ by tenure\" width=\"1600\" height=\"960\" loading=\"lazy\" decoding=\"async\"><img src=\"[BASE64_ASSET]\" alt=\"Supporting evidence: participant quotes linked to transcripts\" width=\"1600\" height=\"960\" loading=\"lazy\" decoding=\"async\"><img src=\"[BASE64_ASSET]\" alt=\"Suggested next steps for the team to discuss\" width=\"1600\" height=\"960\" loading=\"lazy\" decoding=\"async\"><\/div>\n          <ul class=\"feature-rows plain-rows tp-rep-rows\">\n            <li><div><h3>See the key findings<\/h3><p>Understand the main takeaways and how they relate to what you set out to learn.<\/p><\/div><\/li>\n            <li><div><h3>Explore patterns and differences<\/h3><p>Explore recurring themes, contrasting perspectives, and question-level findings, with context from participants&rsquo; responses.<\/p><\/div><\/li>\n            <li><div><h3>Examine the supporting evidence<\/h3><p>Examine the supporting evidence and illustrative quotes included in each report. Explore the complete source material through discussion transcripts and survey responses.<\/p><\/div><\/li>\n            <li><div><h3>Consider what comes next<\/h3><p>Use conclusions and Suggested Next Steps to guide discussion, further research, and decisions.<\/p><\/div><\/li>\n          <\/ul>\n        <\/div>\n        <div class=\"report-formats reveal\"><strong>Your findings, your format.<\/strong><p>Get reports for an entire session or one participant, and customize them by adding or removing sections and making editorial comments. Access discussion transcripts and complete survey responses. Download reports in Word, PDF, or PowerPoint where available, and export survey response data to Excel or CSV.<\/p><button class=\"tp-sr-link\" type=\"button\" data-sample-reports>View Sample Reports <span aria-hidden=\"true\">&rarr;<\/span><\/button><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section alt\" id=\"use-cases\">\n      <div class=\"shell\">\n        <header class=\"section-head reveal\"><div><p class=\"section-label\">Use Cases<\/p><h2>Start with the question you need answered.<\/h2><\/div><p>Understand the people your decisions affect&mdash;employees, customers, students, members, and communities. Explore these examples, or bring your own question.<\/p><\/header>\n        <div class=\"use-case-explorer reveal\">\n          <div class=\"use-case-tabs\" role=\"tablist\" aria-label=\"Research needs\">\n            <button class=\"use-case-tab active\" type=\"button\" role=\"tab\" id=\"utab-0\" aria-controls=\"upanel\" aria-selected=\"true\" tabindex=\"0\" data-use-case-tab>Understand experiences<\/button>\n            <button class=\"use-case-tab\" type=\"button\" role=\"tab\" id=\"utab-1\" aria-controls=\"upanel\" aria-selected=\"false\" tabindex=\"-1\" data-use-case-tab>Discover needs<\/button>\n            <button class=\"use-case-tab\" type=\"button\" role=\"tab\" id=\"utab-2\" aria-controls=\"upanel\" aria-selected=\"false\" tabindex=\"-1\" data-use-case-tab>Test ideas<\/button>\n            <button class=\"use-case-tab\" type=\"button\" role=\"tab\" id=\"utab-3\" aria-controls=\"upanel\" aria-selected=\"false\" tabindex=\"-1\" data-use-case-tab>Navigate change<\/button>\n            <button class=\"use-case-tab\" type=\"button\" role=\"tab\" id=\"utab-4\" aria-controls=\"upanel\" aria-selected=\"false\" tabindex=\"-1\" data-use-case-tab>Strengthen engagement<\/button>\n            <button class=\"use-case-tab\" type=\"button\" role=\"tab\" id=\"utab-5\" aria-controls=\"upanel\" aria-selected=\"false\" tabindex=\"-1\" data-use-case-tab>Improve communication<\/button>\n          <\/div>\n          <div class=\"use-case-panel\" id=\"upanel\" role=\"tabpanel\" aria-labelledby=\"utab-0\" tabindex=\"0\" data-use-case-panel><\/div>\n        <\/div>\n        <div class=\"uc-outro reveal\">\n          <div><strong>Have a different question?<\/strong><p>Create research around your own topic, audience, and objectives.<\/p><\/div>\n          <button class=\"btn primary\" type=\"button\" data-open-demo=\"form\">Book a Demo <span>&rarr;<\/span><\/button>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section trust-section\" id=\"trust\">\n      <div class=\"shell\">\n        <header class=\"section-head reveal\"><div><p class=\"section-label\">Your brand. Your rules. Your review.<\/p><h2>AI-led research. Guided by you.<\/h2><\/div><p>Set the standards for your research, manage access to information, and give participants an experience that reflects your organization.<\/p><\/header>\n        <div class=\"trust-layout reveal\">\n          <div class=\"tp-brand-stage\" aria-live=\"polite\"><img src=\"[BASE64_ASSET]\" alt=\"Participant invitation screen with the organization’s own logo and colors\" width=\"1600\" height=\"1200\" loading=\"lazy\" decoding=\"async\" class=\"on\" data-i=\"0\"><img src=\"[BASE64_ASSET]\" alt=\"Corporate guardrails applied to every session\" width=\"1600\" height=\"1200\" loading=\"lazy\" decoding=\"async\" data-i=\"1\"><img src=\"[BASE64_ASSET]\" alt=\"Roles and permissions showing access based on responsibilities\" width=\"1600\" height=\"1200\" loading=\"lazy\" decoding=\"async\" data-i=\"2\"><img src=\"[BASE64_ASSET]\" alt=\"Automatic data deletion policy settings\" width=\"1600\" height=\"1200\" loading=\"lazy\" decoding=\"async\" data-i=\"3\"><img src=\"[BASE64_ASSET]\" alt=\"Launch approval screen: session ready for your review\" width=\"1600\" height=\"1200\" loading=\"lazy\" decoding=\"async\" data-i=\"4\"><\/div>\n          <ul class=\"feature-rows plain-rows trust-rows tp-brand-rows\">\n            <li><div><h3>Your brand, throughout the experience<\/h3><p>Bring your organization&rsquo;s identity to participant invitations, sessions, and reports for a consistent, recognizable experience.<\/p><\/div><\/li>\n            <li><div><h3>Research guidelines you define<\/h3><p>Set guidelines for the AI&rsquo;s language, questions, and handling of sensitive topics to support your research objectives and organizational standards.<\/p><\/div><\/li>\n            <li><div><h3>Access based on responsibilities<\/h3><p>Manage who can create and run research, review responses, and access reports through roles and permissions.<\/p><\/div><\/li>\n            <li><div><h3>Control over data retention<\/h3><p>Set how long research data is retained and manage deletion according to your organization&rsquo;s requirements.<\/p><\/div><\/li>\n            <li><div><h3>Your review at key steps<\/h3><p>Review and approve sessions before launch. Evaluate the findings and supporting evidence before deciding what happens next.<\/p><\/div><\/li>\n          <\/ul>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section alt\" id=\"resources\">\n      <div class=\"shell\">\n        <header class=\"section-head reveal\"><div><p class=\"section-label\">Resources<\/p><h2>Better research, in practice.<\/h2><\/div><p>Practical guidance on AI-led surveys, discussions, focus groups, and turning participant feedback into informed decisions.<\/p><\/header>\n        <div class=\"blog-grid\"><a class=\"blog-tile\" href=\"/blogs/blog/create-feedback-sessions-with-the-trupulse-ai-agent\" data-single-route=\"article\" data-article=\"create-feedback-sessions-with-the-trupulse-ai-agent\" data-cat=\"Product &amp; Use Cases\" data-title=\"let trupulse turn your research question into a session ai research research design reporting and evidence\"><span class=\"bc-media\"><img src=\"[BASE64_ASSET]\" alt=\"Let TruPulse turn your research question into a session\" width=\"640\" height=\"248\" loading=\"lazy\" decoding=\"async\"><\/span><span class=\"bc-body\"><span class=\"bc-eyebrow\"><span class=\"tp-sro\">Product &amp; Use Cases · <\/span>3 min read<\/span><span class=\"bc-title\">Let TruPulse turn your research question into a session<\/span><span class=\"bc-desc\">You know what you want to learn. TruPulse helps turn that goal into a feedback session through a short conversation with its AI creation agent. Explore how the agent prepares session content and participant materials, so your team can focus on the question and the results.<\/span><span class=\"bc-action\">Read Article <em>→<\/em><\/span><\/span><\/a><a class=\"blog-tile\" href=\"/blogs/blog/trupulse-survey-follow-ups-that-explore-the-why\" data-single-route=\"article\" data-article=\"trupulse-survey-follow-ups-that-explore-the-why\" data-cat=\"Product &amp; Use Cases\" data-title=\"let your survey ask the next useful question surveys research design participant experience\"><span class=\"bc-media\"><img src=\"[BASE64_ASSET]\" alt=\"Let your survey ask the next useful question\" width=\"640\" height=\"248\" loading=\"lazy\" decoding=\"async\"><\/span><span class=\"bc-body\"><span class=\"bc-eyebrow\"><span class=\"tp-sro\">Product &amp; Use Cases · <\/span>3 min read<\/span><span class=\"bc-title\">Let your survey ask the next useful question<\/span><span class=\"bc-desc\">A rating can point to a problem without explaining it. TruPulse lets you add Fixed, Conditional, or Adaptive survey follow-ups and select the kind of explanation you need. See how AI helps create the questions and brings follow-up responses into the report alongside each survey result.<\/span><span class=\"bc-action\">Read Article <em>→<\/em><\/span><\/span><\/a><a class=\"blog-tile\" href=\"/blogs/blog/trupulse-ai-reports-for-useful-feedback-and-next-steps\" data-single-route=\"article\" data-article=\"trupulse-ai-reports-for-useful-feedback-and-next-steps\" data-cat=\"Product &amp; Use Cases\" data-title=\"let ai prepare the findings so your team can focus on the next move reporting and evidence ai research research design\"><span class=\"bc-media\"><img src=\"[BASE64_ASSET]\" alt=\"Let AI prepare the findings so your team can focus on the next move\" width=\"640\" height=\"248\" loading=\"lazy\" decoding=\"async\"><\/span><span class=\"bc-body\"><span class=\"bc-eyebrow\"><span class=\"tp-sro\">Product &amp; Use Cases · <\/span>3 min read<\/span><span class=\"bc-title\">Let AI prepare the findings so your team can focus on the next move<\/span><span class=\"bc-desc\">Collecting feedback is only part of the work. TruPulse prepares structured reports that bring the responses together, with summaries, relevant detail, and next steps. Explore the different reporting formats and see how your team can spend its attention on understanding the findings and deciding what comes next.<\/span><span class=\"bc-action\">Read Article <em>→<\/em><\/span><\/span><\/a><\/div>\n        <div class=\"section-cta reveal\"><a class=\"btn outline\" href=\"/blogs\" data-single-route=\"blogs\">View All Articles <span>→<\/span><\/a><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section\" id=\"faq\">\n      <div class=\"shell faq-layout\">\n        <div class=\"reveal faq-intro\"><p class=\"eyebrow\">Questions about TruPulse?<\/p><h2>Start here. Ask us more.<\/h2><p>Explore the FAQs, or ask our AI assistant how TruPulse works and how it could help your organization.<\/p>\n          <button class=\"btn primary\" type=\"button\" data-chat-ask>Ask the TruPulse AI Assistant <span>&rarr;<\/span><\/button>\n          <p class=\"faq-alt tp-faq-alt\">Prefer a conversation?<\/p><button class=\"btn outline tp-faq-demo\" type=\"button\" data-open-demo=\"form\">Book a Demo <span>&rarr;<\/span><\/button>\n        <\/div>\n        <div class=\"faq-list reveal delay-1\">\n          <details><summary>What is TruPulse?<\/summary><p>TruPulse is an AI-led research platform that creates, conducts, and analyzes surveys, 1:1 discussions, and focus groups. Your team sets the direction, approves the questions, and reviews the findings.<\/p><\/details>\n          <details><summary>Who can use TruPulse?<\/summary><p>Businesses, schools, nonprofits, public agencies, and other organizations can use TruPulse to better understand employees, customers, students, members, and communities.<\/p><\/details>\n          <details><summary>How is TruPulse different from a traditional survey tool?<\/summary><p>TruPulse goes beyond collecting answers. It can ask relevant follow-up questions, conduct individual and group discussions, and analyze responses to help you understand the experiences and reasons behind the feedback.<\/p><\/details>\n          <details><summary>Who sees a participant&rsquo;s identity?<\/summary><p>The Creator chooses whether a session is anonymous or identified. Participants are told which setting applies before they take part.<\/p><p>In anonymous sessions, participant names are hidden from individual responses and reports. Details participants share in their responses may still reveal their identity.<\/p><p>In identified sessions, individual reports include the participant&rsquo;s name. These reports are available to the Creator, people the Creator has authorized to view the results, and admins with global viewing access.<\/p><p>In anonymous focus groups, all participants appear as &ldquo;Anonymous&rdquo; in the chat. Details shared during the discussion may still reveal their identity to other participants.<\/p><\/details>\n          <details><summary>Who can access individual responses?<\/summary><p>Anyone with access to a session&mdash;the creator, people the creator has shared access with, and admins with global viewing access&mdash;can access all reports and responses for that session, including group reports, individual reports, discussion transcripts, and survey responses.<\/p><p>In anonymous sessions, participant names are hidden in all reports and transcripts. Details participants share in their responses may still reveal their identity. In identified sessions, individual reports include the participant&rsquo;s name.<\/p><\/details>\n          <details><summary>Does privacy work the same way in every session type?<\/summary><p>No. A survey can be answered without anyone else present; a 1:1 discussion is between the participant and the AI; a focus group is held with multiple participants in the session. Participants are always notified if a session is anonymous or identified.<\/p><\/details>\n          <details><summary>How much control does our team have?<\/summary><p>Your team defines the research objectives, reviews and approves the session details before launch, and chooses participants. TruPulse conducts the research and prepares findings for your team to review. You decide what happens next.<\/p><\/details>\n          <details><summary>Are participant responses used to train AI models?<\/summary><p>No. TruPulse does not use participant responses&mdash;including survey answers, 1:1 discussions, and focus-group conversations&mdash;to train AI models. Responses are used to conduct your research and generate findings and reports for your organization.<\/p><\/details>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"final-cta\"><span class=\"cta-aurora\" aria-hidden=\"true\"><i class=\"cta-ring\"><\/i><i class=\"cta-orbit\"><b><\/b><\/i><\/span>\n      <div class=\"shell cta-layout\">\n        <div class=\"reveal\"><p class=\"eyebrow\" style=\"color:#fff\">Book a Demo<\/p><h2>What do you need to understand?<\/h2><p>Bring a question about the people who matter to your organization. See how TruPulse helps you create the session, gather meaningful feedback, and turn responses into findings you can use&mdash;with your team guiding the process.<\/p><button class=\"btn light\" type=\"button\" data-open-demo=\"form\">Book a Demo <span>→<\/span><\/button><p class=\"cta-alt\">Have a question first? <button type=\"button\" class=\"linkish\" data-chat-ask>Ask our AI assistant<\/button>.<\/p><\/div>\n        <div class=\"cta-signal reveal delay-1\"><small>Your research journey<\/small><div class=\"cta-steps\"><span>Your question<\/span><span>AI-led research<\/span><span>Findings you can use<\/span><\/div><strong>Clear research your team can review.<\/strong><\/div>\n      <\/div>\n    <\/section>\n  <\/main>\n\n  <footer class=\"site-footer\"><div class=\"shell\"><div class=\"footer-grid\"><div class=\"footer-about\"><a class=\"logo brand-logo footer-brand-logo\" href=\"#top\"><img src=\"__ASSET5__\" alt=\"TruPulse\" width=\"384\" height=\"121\"><\/a><p>AI-led research to understand the people who matter to your organization. Create, conduct, and analyze surveys, 1:1 discussions, and focus groups&mdash;with your team guiding the process.<\/p><\/div><div class=\"footer-links\"><div><strong>Explore<\/strong><a href=\"#how-it-works\">How TruPulse Works<\/a><a href=\"#product\">Session Types<\/a><a href=\"#reports\">Reports<\/a><a href=\"#use-cases\">Use Cases<\/a><\/div><div><strong>Resources &amp; Help<\/strong><a href=\"/blogs\" data-single-route=\"blogs\">Articles<\/a><a href=\"#\" data-chat-ask>Ask Our AI Assistant<\/a><a href=\"mailto:hello@trupulse.ai\
