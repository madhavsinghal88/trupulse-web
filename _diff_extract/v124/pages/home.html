><p>See how you can:<\/p><ul><li>Create and approve a survey, 1:1 discussion, or focus group.<\/li><li>Gather feedback through AI-led sessions and relevant follow-up questions.<\/li><li>Review findings and supporting evidence to inform your next steps.<\/li><\/ul><\/div><\/div><form class=\"demo-form\" data-demo-form><h3>Tell us what you&rsquo;re interested in.<\/h3><p>Share a few details so we can tailor the demo to your needs. You don&rsquo;t need a research plan to get started.<\/p><label class=\"field\">Full name<input required type=\"text\" placeholder=\"Your name\"><\/label><label class=\"field\">Email address<input required type=\"email\" placeholder=\"name@company.com\"><\/label><label class=\"field\">Organization<input required type=\"text\" placeholder=\"Organization name\"><\/label><label class=\"field\">What would you like to explore?<textarea placeholder=\"Tell us about your audience, intended use or what specifically you want to learn.\"><\/textarea><\/label><button class=\"btn primary\" type=\"submit\" data-pick-a-time>Pick a Time<\/button>\n              <!-- INTEGRATION POINT: wire this form to your CRM / scheduling endpoint. --><\/form><\/div><\/section>\n  <\/div>\n\n  <script>\nconst reduceMotion = window.matchMedia(\"(prefers-reduced-motion: reduce)\");\nconst products = [\n  {\n    kicker: \"AI-led 1:1 discussions\",\n    title: \"Go deeper, without spending hours conducting interviews.\",\n    body: \"Set the direction and approve the discussion guide. AI conducts each discussion, so your team can gather in-depth feedback without spending time scheduling or running interviews.\",\n    benefits: [\"Flexible timing—participants take part whenever it suits them\", \"Chat or voice responses in any of 17 languages\", \"AI follow-up questions that explore the “why”\"],\n    bestLabel: \"EXAMPLE USE CASES\",\n    best: \"Stay interviews · Customer discovery · Member feedback\",\n    video: \"1:1 discussion product walkthrough\",\n    note: \"See a 1:1 session end to end\"\n  },\n  {\n    kicker: \"Surveys with AI-powered follow-ups\",\n    title: \"Go beyond the score. Understand the answer.\",\n    body: \"Combine structured questions with follow-ups that explore the reasons behind each answer. AI helps recommend questions and follow-up approaches based on your research objectives. Review and approve the survey before launch.\",\n    benefits: [\"<strong>Base questions:<\/strong> The core questions that address your research objectives.\", \"<strong>Fixed follow-ups:<\/strong> The same follow-up question for everyone, gathering consistent detail.\", \"<strong>Conditional follow-ups:<\/strong> Follow-up questions that appear only when an answer meets criteria you set.\", \"<strong>Adaptive follow-ups:<\/strong> Follow-up questions tailored to each participant’s answers to explore the reasons behind them.\"],\n    bestLabel: \"EXAMPLE USE CASES\",\n    best: \"Employee engagement · Customer satisfaction · Member experience\",\n    video: \"Employee Survey product walkthrough\",\n    note: \"See a survey built and analyzed\"\n  },\n  {\n    kicker: \"AI-moderated focus groups\",\n    title: \"Bring people together. Build on every perspective.\",\n    body: \"Set the direction and approve the discussion guide. AI moderates the live discussion, reducing the work involved in facilitating the session.\",\n    benefits: [\"Encourages participation: AI invites quieter voices and manages dominant speakers.\", \"Explores perspectives: AI asks for examples and probes differing viewpoints.\", \"Checks understanding: AI shares summaries with the group so participants can clarify or add more.\"],\n    bestLabel: \"EXAMPLE USE CASES\",\n    best: \"Idea workshops · Product concept feedback · Team improvement\",\n    video: \"Focus Group product walkthrough\",\n    note: \"See a moderated group discussion\"\n  }\n];\n\nconst panel = document.querySelector(\"[data-product-panel]\");\nconst tabs = [...document.querySelectorAll(\"[data-product-tab]\")];\n\nfunction storyMarkup(title, note, withButton = true) {\n  return `<div class=\"developer-video-slot\" aria-label=\"${title} video placeholder\">\n    ${withButton ? '<button class=\"video-slot-play\" type=\"button\" aria-label=\"Play the ' + title + ' video\" data-open-video=\"' + title + '\" data-video-title=\"' + title + '\">▶<\/button>' : ''}\n    <strong>${title}<\/strong>\n    <small>${note}<\/small>\n  <\/div>`;\n}\n\nfunction renderProduct(index) {\n  const item = products[index];\n  tabs.forEach((tab, tabIndex) => {\n    tab.classList.toggle(\"active\", tabIndex === index);\n    tab.setAttribute(\"aria-selected\", String(tabIndex === index));\n    tab.setAttribute(\"tabindex\", tabIndex === index ? \"0\" : \"-1\");\n  });\n  panel.setAttribute(\"aria-labelledby\", \"ptab-\" + index);\n\n  panel.innerHTML = `<div class=\"product-copy\">\n    <span class=\"kicker\">${item.kicker}<\/span>\n    <h3>${item.title}<\/h3>\n    <p>${item.body}<\/p>\n    <ul class=\"feature-list\">${item.benefits.map((benefit) => `<li><i>✓<\/i><span>${benefit}<\/span><\/li>`).join(\"\")}<\/ul>\n    <div class=\"best-for\"><small>${item.bestLabel || \"BEST FOR\"}<\/small><strong>${item.best}<\/strong><\/div>\n  <\/div><div class=\"walkthrough\">${storyMarkup(item.video, item.note)}<\/div>`;\n  bindDemoButtons();\n}\n\nlet activeProduct = 0;\nlet productTimer;\nconst PRODUCT_DWELL = 15000;   // 15s of reading on each tab, then advance at once\nconst shellEl = document.querySelector(\".product-shell\");\nlet rafId = 0, cycleStart = 0, heldAt = 0;\nfunction setLine(p) { shellEl?.style.setProperty(\"--p\", Math.max(0, Math.min(1, p)).toFixed(4)); }\nfunction frame(now) {\n  const p = (now - cycleStart) / PRODUCT_DWELL;\n  if (p >= 1) {\n    // The line has just filled. Advance on this very frame.\n    activeProduct = (activeProduct + 1) % products.length;\n    renderProduct(activeProduct);\n    cycleStart = now;\n    setLine(0);\n  } else setLine(p);\n  rafId = requestAnimationFrame(frame);\n}\nfunction restartProductRotation() {\n  cancelAnimationFrame(rafId);\n  // Skipped only for users who ask for reduced motion.\n  /* The v2 brief had held the panel still until the visitor picked a tab.\n     Re-enabled on request: 15s per tab, cycling, pausing while read. */\n  if (true) { setLine(1); shellEl?.setAttribute(\"data-rotation\", \"off\"); return; }\n  shellEl?.setAttribute(\"data-rotation\", \"running\");\n  cycleStart = performance.now() - heldAt;\n  heldAt = 0;\n  setLine(0);\n}\nfunction pauseProductRotation() {\n  cancelAnimationFrame(rafId);\n  heldAt = Math.min(PRODUCT_DWELL - 1, performance.now() - cycleStart);\n  shellEl?.setAttribute(\"data-rotation\", \"paused\");\n}\n/* Choosing a tab starts its dwell from zero. */\nfunction resetProductCycle() { heldAt = 0; setLine(0); restartProductRotation(); }\n// Choosing a tab restarts the dwell on that tab rather than ending the loop.\nfunction stopProductRotation() { resetProductCycle(); }\n\nconst productShell = document.querySelector(\".product-shell\");\n// Pause while the pointer or keyboard focus is inside the component.\n/* Hovering does not pause: the line runs continuously. */\n/* ...and leaving does not restart it, which would have snapped it back to zero. */\nproductShell?.addEventListener(\"focusin\", () => pauseProductRotation());\nproductShell?.addEventListener(\"focusout\", (event) => {\n  if (!productShell.contains(event.relatedTarget)) restartProductRotation();\n});\nreduceMotion.addEventListener(\"change\", () => restartProductRotation());\n\ntabs.forEach((tab, index) => tab.addEventListener(\"click\", () => {\n  activeProduct = index;\n  stopProductRotation();\n  renderProduct(activeProduct);\n}));\n// Roving-tabindex keyboard support, required for role=\"tab\".\nfunction tabKeys(list, onPick) {\n  list.forEach((tab, index) => tab.addEventListener(\"keydown\", (event) => {\n    const map = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };\n    let next = null;\n    if (event.key in map) next = (index + map[event.key] + list.length) % list.length;\n    else if (event.key === \"Home\") next = 0;\n    else if (event.key === \"End\") next = list.length - 1;\n    if (next === null) return;\n    event.preventDefault();\n    onPick(next);\n    list[next].focus();\n  }));\n}\ntabKeys(tabs, (i) => { activeProduct = i; stopProductRotation(); renderProduct(i); });\n\nconst audienceWord = document.querySelector(\"[data-audience-word]\");\nconst audiences = [\"employees\", \"students\", \"customers\", \"patients\", \"citizens\", \"members\"];\nlet audienceIndex = 0;\nlet audienceTimer;\n/* The word turns like a face of a pencil rolling on its horizontal axis: the\n   current word rotates up and out of view, the text is swapped while it is edge\n   on, and the next word rolls up into place from below. */\nconst rotator = document.querySelector(\"[data-rotator]\");\nconst roll = document.querySelector(\"[data-roll]\");\nconst faceFront = document.querySelector(\"[data-face-front]\");\nconst faceNext = document.querySelector(\"[data-face-next]\");\nlet rolling = false;\n\n/* Size the cylinder from the real line box, and the slot from the widest word,\n   so nothing jumps sideways as the words change length. */\nfunction sizeRotator() {\n  if (!rotator || !faceFront) return;\n  const h = faceFront.getBoundingClientRect().height;\n  roll.style.setProperty(\"--radius\", (h / 2) + \"px\");\n  rotator.style.height = h + \"px\";\n  fitRotator();\n}\n\n/* The slot widens or narrows to the word currently showing, in step with the\n   turn, so there is never dead space beside a short word. */\nfunction fitRotator() {\n  if (!rotator || !faceFront) return;\n  rotator.style.width = Math.ceil(faceFront.getBoundingClientRect().width) + \"px\";\n}\n\nfunction rollAudienceWord() {\n  if (!roll || rolling) return;\n  rolling = true;\n  faceNext.textContent = audiences[(audienceIndex + 1) % audiences.length];\n  // Widen to the incoming word while the cylinder turns, not after it.\n  const probe = faceNext.getBoundingClientRect().width;\n  rotator.style.width = Math.ceil(probe) + \"px\";\n  roll.classList.add(\"turning\");\n  setTimeout(() => {\n    // The next face is now front. Copy it down and reset the cylinder silently.\n    audienceIndex = (audienceIndex + 1) % audiences.length;\n    faceFront.textContent = audiences[audienceIndex];\n    roll.classList.add(\"no-transition\");\n    roll.classList.remove(\"turning\");\n    void roll.offsetWidth;\n    roll.classList.remove(\"no-transition\");\n    rolling = false;\n  }, 620);\n}\nfunction startAudienceRotation() {\n  clearInterval(audienceTimer);\n  // The H1 is the page's primary heading: leave it static for reduced-motion users\n  // rather than rolling the word underneath them every few seconds.\n  if (reduceMotion.matches) {\n    if (faceFront) faceFront.textContent = audiences[0];\n    return;\n  }\n  audienceTimer = setInterval(rollAudienceWord, 2600);\n}\nsizeRotator();\nwindow.addEventListener(\"resize\", sizeRotator);\nif (document.fonts && document.fonts.ready) document.fonts.ready.then(sizeRotator);\nstartAudienceRotation();\nreduceMotion.addEventListener(\"change\", startAudienceRotation);\n\n// Deepen the header blur once content has scrolled underneath it.\nconst siteHeader = document.querySelector(\".site-header\");\nfunction updateHeaderState(){ siteHeader?.classList.toggle(\"scrolled\", window.scrollY > 12); }\nwindow.addEventListener(\"scroll\", updateHeaderState, { passive: true });\nupdateHeaderState();\n\nconst hero = document.querySelector(\".hero\");\nconst heroGrid = document.querySelector(\".hero-grid\");\nconst heroCopyEl = document.querySelector(\".hero-copy\");\n/* Measured against the grid, which is the frame's containing block. */\nfunction heroRestBox() {\n  if (!heroGrid || !heroCopyEl) return { top: 154, bottom: 52 };\n  const g = heroGrid.getBoundingClientRect();\n  const c = heroCopyEl.getBoundingClientRect();\n  const top = Math.max(0, c.top - g.top);\n  const bottom = Math.max(0, g.bottom - c.bottom);\n  return { top, bottom };\n}\nfunction updateHeroExpansion() {\n  if (!hero) return;\n  const compact = window.matchMedia(\"(max-width: 980px)\").matches || reduceMotion.matches;\n  const distance = Math.max(hero.offsetHeight - window.innerHeight, 1);\n  const progress = 1 ? 0 : Math.min(Math.max((window.scrollY - hero.offsetTop) / distance, 0), 1);\n  const remaining = 1 - progress;\n  hero.style.setProperty(\"--hero-expand\", progress.toFixed(3));\n  // Fully faded when the video is half expanded, and symmetrical on the way back.\n  const copyOpacity = Math.max(0, Math.min(1, 1 - progress * 2));\n  hero.style.setProperty(\"--hero-copy-opacity\", copyOpacity.toFixed(3));\n  hero.style.setProperty(\"--hero-copy-shift\", `${-48 * progress}px`);\n  // The frame is a real positioned box rather than a clip-path window, so its\n  // contents stay optically centred at every point of the expansion.\n  const gutter = Math.max(parseFloat(getComputedStyle(document.documentElement).getPropertyValue(\"--page-gutter\")) || 80, 20);\n  const heroGrid = hero.querySelector(\".hero-grid\");\n  const sideRest = Math.max(gutter, heroGrid ? heroGrid.getBoundingClientRect().left : (window.innerWidth - 1280) / 2);\n  const rest = heroRestBox();\n  hero.style.setProperty(\"--hero-video-top\", `${rest.top * remaining}px`); { const _fr = hero.querySelector(\".hero-video-frame\"), _cp = heroCopyEl; if (_fr && _cp && !window.matchMedia(\"(max-width: 980px)\").matches) { const a = _cp.getBoundingClientRect(), f = _fr.getBoundingClientRect(); const d = (a.top + a.height / 2) - (f.top + f.height / 2); hero.style.setProperty(\"--hero-video-top\", `${(rest.top + d) * remaining}px`); } }\n  hero.style.setProperty(\"--hero-video-right\", `${sideRest * remaining}px`);\n  hero.style.setProperty(\"--hero-video-bottom\", `${rest.bottom * remaining}px`);\n  hero.style.setProperty(\"--hero-video-left\", `${(window.innerWidth / 2 + 12) * remaining}px`);\n  hero.style.setProperty(\"--hero-video-radius\", `${30 * remaining}px`);\n  hero.classList.toggle(\"video-expanded\", progress > 0.82);\n}\nwindow.addEventListener(\"scroll\", updateHeroExpansion, { passive: true });\nwindow.addEventListener(\"resize\", updateHeroExpansion);\nupdateHeroExpansion();\nwindow.addEventListener(\"load\", updateHeroExpansion);if (document.fonts && document.fonts.ready) document.fonts.ready.then(updateHeroExpansion);setTimeout(updateHeroExpansion, 300);\n\nconst useCases = [\n  {\n    kicker: \"Understand experiences\",\n    title: \"What is the experience really like&mdash;and why?\",\n    body: \"Explore what people value, where they encounter friction, and how their experiences differ. Look beyond satisfaction scores to understand the moments shaping their views.\",\n    tags: [\"Employee onboarding\",\"Customer service\",\"Student support\",\"Community programs\"],\n    ways: \"Use a survey to gather feedback across your audience, or AI-led 1:1 discussions to explore specific experiences in depth.\"\n  },\n  {\n    kicker: \"Discover needs\",\n    title: \"What do people need that we are not yet addressing?\",\n    body: \"Learn about unmet needs, everyday challenges, and gaps in support. Understand what people say would help and why it matters to them.\",\n    tags: [\"Customer discovery\",\"Employee development\",\"Member services\",\"Community needs\"],\n    ways: \"Start with 1:1 discussions to uncover individual needs, or focus groups to explore shared challenges. Use a survey to investigate emerging themes with a wider audience.\"\n  },\n  {\n    kicker: \"Test ideas\",\n    title: \"How do people respond to this idea&mdash;and what would improve it?\",\n    body: \"Explore initial reactions to a proposed product, service, policy, or program. Understand what feels useful, what creates uncertainty, and what questions remain.\",\n    tags: [\"Product concepts\",\"Service proposals\",\"School initiatives\",\"Membership benefits\"],\n    ways: \"Use focus groups to discuss reactions and improvements, or 1:1 discussions for independent feedback. Use a survey to gather structured responses to specific options.\"\n  },\n  {\n    kicker: \"Navigate change\",\n    title: \"How are people experiencing this change?\",\n    body: \"Understand expectations, concerns, and support needs before, during, or after a change. Explore where people feel prepared and where they need more clarity or help.\",\n    tags: [\"Organizational changes\",\"New technology\",\"Campus changes\",\"Public service updates\"],\n    ways: \"Use surveys at key stages to gather feedback, with 1:1 discussions or focus groups to explore the experiences behind the answers.\"\n  },\n  {\n    kicker: \"Strengthen engagement\",\n    title: \"What keeps people involved&mdash;and what gets in the way?\",\n    body: \"Explore the experiences and motivations that shape participation, connection, and continued involvement. Hear from people who are engaged and those who are stepping back.\",\n    tags: [\"Employee retention\",\"Customer loyalty\",\"Member renewal\",\"Volunteer participation\"],\n    ways: \"Use 1:1 discussions to explore personal motivations and reasons for leaving, or surveys to gather feedback from people with different levels of involvement.\"\n  },\n  {\n    kicker: \"Improve communication\",\n    title: \"Is our message understood the way we intended?\",\n    body: \"Learn how people interpret a message, what remains unclear, and what additional information they need. Explore differences between what you intend to communicate and what people take away.\",\n    tags: [\"Employee announcements\",\"Customer messaging\",\"Student guidance\",\"Public information\"],\n    ways: \"Use 1:1 discussions to hear interpretations in people&rsquo;s own words, or surveys with follow-up questions to explore clarity and understanding across your audience.\"\n  }\n];\n\nconst useCaseTabs = [...document.querySelectorAll(\"[data-use-case-tab]\")];\nlet activeUseCase = 0;\nconst useCasePanel = document.querySelector(\"[data-use-case-panel]\");\nfunction renderUseCase(index) {\n  activeUseCase = index;\n  const item = useCases[index];\n  useCaseTabs.forEach((tab, tabIndex) => {\n    tab.classList.toggle(\"active\", tabIndex === index);\n    tab.setAttribute(\"aria-selected\", String(tabIndex === index));\n    tab.setAttribute(\"tabindex\", tabIndex === index ? \"0\" : \"-1\");\n  });\n  useCasePanel.setAttribute(\"aria-labelledby\", \"utab-\" + index);\n  useCasePanel.innerHTML = `<p class=\"section-label\">${item.kicker}<\/p><h3>${item.title}<\/h3><p>${item.body}<\/p><p class=\"uc-chip-label\">Example use cases<\/p><div class=\"use-case-tags\">${item.tags.map((tag) => `<span>${tag}<\/span>`).join(\"\")}<\/div><div class=\"use-case-ways\"><small>Ways to explore it<\/small><p>${item.ways}<\/p><\/div>`;\n  bindDemoButtons();\n}\nuseCaseTabs.forEach((tab, index) => tab.addEventListener(\"click\", () => renderUseCase(index)));\ntabKeys(useCaseTabs, (i) => renderUseCase(i));\n\nconst modal = document.querySelector(\"[data-demo-modal]\");\nconst FOCUSABLE = 'a[href],button:not([disabled]),input,textarea,select,[tabindex]:not([tabindex=\"-1\"])';\nlet lastFocused = null;\nfunction openModal(focus) {\n  lastFocused = document.activeElement;\n  modal.classList.add(\"open\");\n  document.body.classList.add(\"modal-open\");\n  modal.setAttribute(\"aria-hidden\", \"false\");\n  if (focus === \"form\") setTimeout(() => modal.querySelector(\"input\")?.focus(), 120);\n  else setTimeout(() => modal.querySelector(\".modal-close\")?.focus(), 120);\n}\nfunction closeModal() {\n  if (!modal.classList.contains(\"open\")) return;\n  modal.classList.remove(\"open\");\n  document.body.classList.remove(\"modal-open\");\n  modal.setAttribute(\"aria-hidden\", \"true\");\n  // Return focus to whatever opened the dialog.\n  lastFocused?.focus?.();\n}\n// Keep Tab inside the dialog while it is open.\nmodal.addEventListener(\"keydown\", (event) => {\n  if (event.key !== \"Tab\") return;\n  const items = [...modal.querySelectorAll(FOCUSABLE)].filter((el) => el.offsetParent !== null);\n  if (!items.length) return;\n  const first = items[0], last = items[items.length - 1];\n  if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }\n  else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }\n});\nfunction bindDemoButtons() {\n  document.querySelectorAll(\"[data-open-demo]\").forEach((button) => {\n    button.onclick = () => openModal(button.dataset.openDemo || \"form\");\n  });\n}\nmodal.querySelector(\".modal-close\").addEventListener(\"click\", closeModal);\nmodal.addEventListener(\"mousedown\", (event) => { if (event.target === modal) closeModal(); });\ndocument.addEventListener(\"keydown\", (event) => { if (event.key === \"Escape\") closeModal(); });\n\ndocument.querySelector(\"[data-demo-form]\").addEventListener(\"submit\", (event) => {\n  event.preventDefault();\n  event.currentTarget.querySelector(\".form-success\").classList.add(\"show\");\n});\n\nconst revealObserver = new IntersectionObserver((entries) => {\n  entries.forEach((entry) => {\n    if (entry.isIntersecting) {\n      entry.target.classList.add(\"in\");\n      revealObserver.unobserve(entry.target);\n    }\n  });\n}, { threshold: .12 });\ndocument.querySelectorAll(\".reveal\").forEach((el) => revealObserver.observe(el));\n\nconst menuToggle = document.querySelector(\"[data-menu-toggle]\");\nconst mainNav = document.querySelector(\".main-nav\");\nfunction setMenu(open) {\n  mainNav.classList.toggle(\"mobile-open\", open);\n  menuToggle.setAttribute(\"aria-expanded\", String(open));\n}\nmenuToggle?.addEventListener(\"click\", () => setMenu(!mainNav.classList.contains(\"mobile-open\")));\n// The menu previously stayed open after tapping a link, covering the target section.\nmainNav?.querySelectorAll(\"a\").forEach((link) => link.addEventListener(\"click\", () => setMenu(false)));\ndocument.addEventListener(\"keydown\", (event) => { if (event.key === \"Escape\") setMenu(false); });\n\n// Keep the footer copyright current without an annual edit.\n/* The copyright year is fixed editorial content, not the visitor clock. */\n\n// Blog pages ask the shell to open the demo dialog after routing here.\nwindow.addEventListener(\"message\", (event) => {\n  if (event.source === window.parent && event.data && event.data.type === \"trupulse-open-demo\") openModal(\"form\");\n});\n\nrenderProduct(0);\nrenderUseCase(0);\nrestartProductRotation();\nbindDemoButtons();\n\n/* The assistant has its own script at the end of this file. */\n\n/* ---------- Equal-height panels ---------- */\nfunction panelMax(el, count, render, restore) {\n  if (!el) return;\n  el.style.minHeight = \"0px\";\n  let max = 0;\n  // offsetHeight, not scrollHeight: on an overflow:hidden box scrollHeight\n  // under-counts the bottom padding, which left the panel clipping by ~40px.\n  for (let i = 0; i < count; i++) { render(i); max = Math.max(max, el.offsetHeight); }\n  render(restore);\n  el.style.minHeight = Math.ceil(max) + \"px\";\n}\n\nfunction equalisePanels() {\n  panelMax(document.querySelector(\"[data-use-case-panel]\"), useCases.length, renderUseCase, activeUseCase);\n  panelMax(document.querySelector(\"[data-product-panel]\"), products.length, renderProduct, activeProduct);\n}\n\nlet resizeTimer;\nwindow.addEventListener(\"resize\", () => {\n  clearTimeout(resizeTimer);\n  resizeTimer = setTimeout(equalisePanels, 180);\n});\n// Re-measure once webfonts land, since Plus Jakarta Sans and Inter change the wrap.\nif (document.fonts && document.fonts.ready) document.fonts.ready.then(equalisePanels);\nequalisePanels();\n\n<\/script>\n<script>\n\n/* In an about:srcdoc document a bare \"#section\" link has no base URL to resolve\n   against, so the browser resolves it against the PARENT url and navigates the frame\n   away from the site entirely - every nav link blanked the page. Handle in-page\n   anchors ourselves instead. */\ndocument.addEventListener(\"click\",function(event){\n  var a=event.target.closest('a[href^=\"#\"]');\n  if(!a||a.hasAttribute(\"data-single-route\"))return;\n  event.preventDefault();\n  var id=a.getAttribute(\"href\").slice(1);\n  if(!id||id===\"top\"){window.scrollTo({top:0,behavior:\"smooth\"});return;}\n  var target=document.getElementById(id);\n  if(target){target.scrollIntoView({behavior:\"smooth\",block:\"start\"});\n    if(target.hasAttribute(\"tabindex\")||/^(a|button|input|h[1-6])$/i.test(target.tagName)){target.focus({preventScroll:true});}}\n});\n/* Route clicks are handled by the capture-phase listener in <head>. */\n<\/script>\n<script>\n/* ================= TruPulse assistant =================\n   Home → help centre search and a new-conversation card; a conversation with\n   quick replies, a typing beat and an emoji picker; a messages list that keeps\n   what you have already asked. The help centre searches this page's own FAQ,\n   so the answers here and the answers on the page can never drift apart. */\n(function () {\n  var dock = document.querySelector(\".chat-dock\");\n  if (!dock) return;\n  var panel = dock.querySelector(\"[data-chat-panel]\");\n  var launch = dock.querySelector(\"[data-chat-launch]\");\n  var log = dock.querySelector(\"[data-chat-log]\");\n  var form = dock.querySelector(\"[data-chat-form]\");\n  var input = form.querySelector(\"input\");\n  var sendBtn = form.querySelector(\".chat-send\");\n  var titleEl = dock.querySelector(\"[data-chat-title]\");\n  var subEl = dock.querySelector(\"[data-chat-sub]\");\n  var backBtn = dock.querySelector(\"[data-chat-back]\");\n  var menuBtn = dock.querySelector(\"[data-chat-menu]\");\n  var menu = dock.querySelector(\"[data-chat-menu-list]\");\n  var picker = dock.querySelector(\"[data-chat-picker]\");\n  var threadsEl = dock.querySelector(\"[data-chat-threads]\");\n  var emptyEl = dock.querySelector(\"[data-chat-empty]\");\n  var view = \"home\";\n  var threads = [];\n  var current = null;\n\n  /* ---------- the help centre is this page's FAQ ---------- */\n  var FAQ = [].map.call(document.querySelectorAll(\".faq-list details\"), function (d) {\n    return { q: d.querySelector(\"summary\").textContent.trim(), a: [].map.call(d.querySelectorAll(\"p\"), function (p) { return p.textContent.trim(); }).filter(Boolean).join(\"\\n\\n\") };\n  });\n\n  /* ---------- open / close ---------- */\n  function setOpen(open) {\n    panel.hidden = !open;\n    launch.setAttribute(\"aria-expanded\", String(open));\n    launch.setAttribute(\"aria-label\", open ? \"Close chat\" : \"Open chat\");\n    launch.setAttribute(\"title\", open ? \"Close chat\" : \"Chat with TruPulse\");\n    if (open) setTimeout(function () { (view === \"chat\" ? input : (dock.querySelector(\"[data-chat-search]\") || dock.querySelector(\"[data-chat-new]\"))).focus(); }, 80);\n    if (!open) closeMenu();\n  }\n  setOpen(false);                       /* closed until the icon is clicked */\n  launch.addEventListener(\"click\", function () { setOpen(panel.hidden); });\n  dock.querySelector(\"[data-chat-close]\").addEventListener(\"click\", function () { setOpen(false); launch.focus(); });\n  document.addEventListener(\"keydown\", function (e) {\n    if (e.key !== \"Escape\") return;\n    if (!picker.hidden) { picker.hidden = true; return; }\n    if (!menu.hidden) { closeMenu(); return; }\n    if (!panel.hidden) { setOpen(false); launch.focus(); }\n  });\n\n  /* ---------- views ---------- */\n  function go(next) {\n    view = next;\n    [].forEach.call(dock.querySelectorAll(\".chat-view\"), function (v) { v.classList.toggle(\"is-on\", v.dataset.view === next); });\n    [].forEach.call(dock.querySelectorAll(\"[data-chat-tab]\"), function (t) {\n      t.classList.toggle(\"is-on\", t.dataset.chatTab === next || (next === \"chat\" && t.dataset.chatTab === \"messages\"));\n \"div\");\n    row.className = \"chat-row\";\n    row.innerHTML = '<span class=\"chat-face\" aria-hidden=\"true\"><svg class=\"ico-bubble\" viewBox=\"0 0 32 32\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M16 4c7.2 0 13 4.6 13 10.3S23.2 24.6 16 24.6c-1.2 0-2.4-.1-3.5-.4l-6 3a.7.7 0 0 1-1-.8l1.2-4A9.6 9.6 0 0 1 3 14.3C3 8.6 8.8 4 16 4Z\" fill=\"currentColor\"/><circle cx=\"10.6\" cy=\"14.3\" r=\"1.9\" fill=\"var(--bubble-dot,#fff)\"/><circle cx=\"16\" cy=\"14.3\" r=\"1.9\" fill=\"var(--bubble-dot,#fff)\"/><circle cx=\"21.4\" cy=\"14.3\" r=\"1.9\" fill=\"var(--bubble-dot,#fff)\"/><\/svg><\/span>' +\n      '<p class=\"chat-msg bot chat-typing\"><i><\/i><i><\/i><i><\/i><\/p>';\n    log.appendChild(row);\n    log.scrollTop = log.scrollHeight;\n    setTimeout(function () { row.remove(); then(); }, 850);\n  }\n\n  /* INTEGRATION POINT: swap this for your support inbox or assistant endpoint. */\n  function reply(text) {\n    var q = text.toLowerCase();\n    var hit = FAQ.find(function (f) {\n      var words = f.q.toLowerCase().replace(/[^a-z0-9 ]/g, \"\").split(\" \").filter(function (w) { return w.length > 3; });\n      return words.filter(function (w) { return q.indexOf(w) > -1; }).length >= 2;\n    });\n    if (hit) return hit.a;\n    if (/1:1|1 on 1|one.to.one|discussion/.test(q)) return \"An AI agent runs the 1:1 itself: it opens with your topic, listens, and asks the follow-up a busy manager would miss. You get the transcript, the themes and the sentiment — the manager keeps the decisions.\";\n    if (/report|output|findings|analys/.test(q)) return \"A TruPulse report opens with the objective and participation, then the recurring themes, the measures and sentiment, and the transcripts and quotes behind each finding — detailed or summary, for a session, a person or a whole campaign.\";\n    if (/survey/.test(q)) return \"Surveys here combine scored questions with open text, and the same analysis runs across both — so you get the number and the reason for it in l(\"[data-chat-new]\"), function (b) { b.addEventListener(\"click\", startConversation); });\n  document.addEventListener(\"click\", function (e) {\n    var t = e.target.closest && e.target.closest(\"[data-chat-ask]\");\n    if (!t) return;\n    e.preventDefault();\n    setOpen(true);\n    startConversation();\n    var q = t.getAttribute(\"data-chat-ask\");\n    if (q) setTimeout(function () { say(q); }, 420);\n  });\n\n  function renderThreads() {\n    threadsEl.innerHTML = \"\";\n    emptyEl.hidden = threads.length > 0;\n    threads.forEach(function (t) {\n      var li = document.createElement(\"li\");\n      var b = document.createElement(\"button\");\n      b.type = \"button\";\n      b.innerHTML = '<span><strong><\/strong><small><\/small><\/span><em><\/em><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M9 5l7 7-7 7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>';\n      b.querySelector(\"strong\").textContent = t.title;\n      b.querySelector(\"small\").textContent = t.last || \"New conversation\";\n      b.querySelector(\"em\").textContent = ago(t.at);\n      b.addEventListener(\"click\", function () { openThread(t); });\n      li.appendChild(b);\n      threadsEl.appendChild(li);\n    });\n  }\n  function ago(ts) {\n    var s = Math.round((Date.now() - ts) / 1000);\n    if (s < 60) return \"now\";\n    if (s < 3600) return Math.round(s / 60) + \"m\";\n    return Math.round(s / 3600) + \"h\";\n  }\n  function openThread(t) {\n    current = t;\n    log.innerHTML = \"\";\n    t.msgs.forEach(function (m) {\n      var keep = current; current = null;      /* replay without re-recording */\n      bubble(m.text, m.mine);\n      current = keep;\n    });\n    go(\"chat\");\n  }\n\n  /* ---------- composer ---------- */\n  input.addEventListener(\"input\", function () { sendBtn.disabled = !input.value.trim(); });\n  form.addEventListener(\"submit\", function (e) {\n    e.preventDefault();
