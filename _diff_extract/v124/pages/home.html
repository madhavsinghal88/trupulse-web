roups | TruPulse\"><meta property=\"og:description\" content=\"AI-led research to understand the people who matter to your organization. Create, conduct, and analyze surveys, 1:1 discussions, and focus groups—with your team guiding the process.\"><meta property=\"og:image\" content=\"https://www.trupulse.ai/og/share.png\"><meta property=\"og:image:width\" content=\"1200\"><meta property=\"og:image:height\" content=\"630\"><meta property=\"og:image:alt\" content=\"TruPulse — AI-powered research. Human insight.\"><meta name=\"twitter:image\" content=\"https://www.trupulse.ai/og/share.png\"><meta name=\"twitter:card\" content=\"summary_large_image\"><meta name=\"twitter:title\" content=\"AI-Led Surveys, 1:1 Discussions & Focus Groups | TruPulse\"><meta name=\"twitter:description\" content=\"AI-led research to understand the people who matter to your organization. Create, conduct, and analyze surveys, 1:1 discussions, and focus groups—with your team guiding the process.\">\n  <link rel=\"icon\" href=\"__ASSET0__\">\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin><link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap\"><style>/* TruPulse site stylesheet.\n   Corrections applied in this revision:\n   - .hero .hero-copy.reveal.in re-asserts the scroll-driven opacity/transform that\n     .reveal.in (higher specificity) was silently overriding.\n   - .hero .hero-video-frame gets a real height under 980px; height:100% against a\n     min-height-only parent resolved to auto and collapsed the placeholder to 0px.\n   - Rules for sections that no longer exist in the markup were removed.\n   - Google Fonts moved from @import to <link rel=preconnect>+<link rel=stylesheet>. */\n\n:root{\n  --ink:#110f35;--ink-2:#252259;--paper:#fffaf6;--white:#fff;--muted:#5b589d;\n  --line:#e0dfec;--coral:#EE851B;--coral-2:#EE851B;--violet:#433EB1;\n  --mint:#c9f5e9;--teal:#078b7c;--lilac:#ecebff;--sun:#ffd870;\n  --display:\"Plus Jakarta Sans\",\"Inter\",ui-sans-serif,system-ui,sans-serif;\n  --body:\"Inter\",ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  --shadow:0 28px 80px rgba(17, 15, 53,.12);--radius:28px;\n}\n\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth;scroll-padding-top:96px}\nbody{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.65;-webkit-font-smoothing:antialiased}\nbody.modal-open{overflow:hidden}\na{color:inherit;text-decoration:none}\nbutton,input,textarea{font:inherit}\nbutton{color:inherit}\nimg{display:block;max-width:100%}\n.shell{width:min(1280px,calc(100% - 40px));margin:auto}\n.section{position:relative;padding:112px 0;overflow:hidden}\n.section.alt{background:#f4f3ff}\n.section-head{display:grid;grid-template-columns:.72fr 1.28fr;gap:76px;align-items:end;margin-bottom:54px}\n.section-label{display:flex;gap:12px;align-items:center;margin:0;color:var(--coral);font-size:.75rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}\n.section-label::before{width:28px;height:2px;background:currentColor;content:\"\"}\n.section-head h2{margin:0;font-family:var(--display);font-size:clamp(2.25rem,5vw,3rem);line-height:1.03;letter-spacing:-.055em}\n.section-head p:last-child{max-width:570px;margin:18px 0 0;color:var(--muted);font-size:1rem}\n.eyebrow{display:inline-flex;gap:10px;align-items:center;margin:0 0 22px;color:var(--coral);font-size:.75rem;font-weight:850;letter-spacing:.14em;text-transform:uppercase}\n.eyebrow::before{width:26px;height:2px;background:currentColor;content:\"\"}\n.btn{display:inline-flex;min-height:52px;padding:0 24px;align-items:center;justify-content:center;gap:10px;border:1px solid transparent;border-radius:999px;font-size:.875rem;font-weight:800;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease,background .2s ease}\n.btn:hover{transform:translateY(-2px)}\n.btn.primary{background:var(--coral);color:#fff;box-shadow:0 12px 24px rgba(238,133,27,.22)}\n.btn.primary:hover{background:#EE851B}\n.btn.outline{border-color:var(--ink);background:transparent}\n.btn.outline:hover{background:#fff}\n.btn.light{background:#fff;color:var(--ink)}\n.icon-btn{display:grid;width:42px;height:42px;place-items:center;border:1px solid var(--line);border-radius:50%;background:#fff;cursor:pointer}\n.play{display:grid;width:25px;height:25px;place-items:center;border-radius:50%;background:var(--ink);color:#fff;font-size:.75rem}\n.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}\n.reveal.in{opacity:1;transform:none}\n.delay-1{transition-delay:.08s}\n.delay-2{transition-delay:.16s}\n\n\n/* Header */\n.site-header{position:fixed;z-index:90;top:14px;left:0;width:100%;pointer-events:none}\n.nav-wrap{display:grid;grid-template-columns:1fr auto 1fr;min-height:68px;padding:9px 11px 9px 20px;align-items:center;border:1px solid rgba(17, 15, 53,.1);border-radius:20px;background:rgba(255,250,246,.86);box-shadow:0 10px 35px rgba(17, 15, 53,.08);backdrop-filter:blur(18px);pointer-events:auto}\n.logo{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-size:1rem;font-weight:900}\n.main-nav{display:flex;gap:29px;align-items:center}\n.main-nav a{font-size:.75rem;font-weight:750;color:#403d77;transition:color .2s}\n.main-nav a:hover{color:var(--coral)}\n.nav-actions{display:flex;gap:8px;justify-content:flex-end;align-items:center}\n.login{padding:10px 13px;font-size:.75rem;font-weight:700}\n.menu-toggle{display:none}\n\n\n/* Hero */\n.hero{position:relative;min-height:870px;padding:150px 0 62px;overflow:hidden;background:linear-gradient(135deg,#fffaf6 0%,#fffaf6 54%,#edecff 100%)}\n.hero::before{position:absolute;inset:-20% auto auto 47%;width:680px;height:680px;border-radius:50%;background:radial-gradient(circle,rgba(238,133,27,.13),transparent 64%);content:\"\"}\n.hero-grid{display:grid;grid-template-columns:.94fr 1.06fr;gap:64px;align-items:center}\n.hero-copy h1{max-width:660px;margin:0;font-family:var(--display);font-size:clamp(3rem,5.5vw,3rem);line-height:.98;letter-spacing:-.062em}\n.hero-copy h1 em{position:relative;color:var(--violet);font-style:normal;white-space:nowrap}\n.hero-copy h1 em::after{position:absolute;right:0;bottom:-8px;left:0;height:7px;border-radius:8px;background:var(--coral);content:\"\";transform:rotate(-1deg);z-index:-1}\n.hero-copy>.lead{max-width:620px;margin:28px 0;color:#504d8f;font-size:1.125rem;line-height:1.75}\n.button-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}\n.hero-keyline{display:flex;gap:14px;align-items:center;margin-top:30px;color:var(--ink);font-size:.75rem;font-weight:750}\n.hero-keyline i{display:inline-block;width:42px;height:1px;background:var(--line)}\n\n.signal-stage{position:relative;min-height:610px}\n\n\n/* Product */\n.product-shell{border:1px solid var(--line);border-radius:34px;background:#fff;box-shadow:0 20px 60px rgba(17, 15, 53,.07);overflow:hidden}\n.product-tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}\n.product-tab{position:relative;padding:24px;border:0;border-right:1px solid var(--line);background:#fff;text-align:left;cursor:pointer}\n.product-tab:last-child{border-right:0}\n.product-tab span{display:block;color:var(--muted);font-size:.75rem;font-weight:800;letter-spacing:.1em}\n.product-tab strong{display:block;margin-top:5px;font-size:.875rem}\n.product-tab::after{position:absolute;right:20px;bottom:-1px;left:20px;height:4px;border-radius:5px 5px 0 0;background:transparent;content:\"\"}\n.product-tab.active{background:#f8f8ff}\n.product-tab.active::after{background:var(--violet)}\n.product-panel{display:grid;grid-template-columns:.92fr 1.08fr;min-height:520px}\n.product-copy{padding:58px}\n.product-copy .kicker{color:var(--coral);font-size:.75rem;font-weight:850;letter-spacing:.13em;text-transform:uppercase}\n.product-copy h3{max-width:480px;margin:16px 0;font-family:var(--display);font-size:clamp(2.25rem,5vw,3rem);line-height:1.04;letter-spacing:-.045em}\n.product-copy>p{color:var(--muted)}\n.feature-list{display:grid;gap:11px;margin:27px 0 30px;padding:0;list-style:none}\n.feature-list li{display:flex;gap:10px;align-items:center;font-size:.75rem;font-weight:700}\n.feature-list i{display:grid;width:24px;height:24px;place-items:center;border-radius:50%;background:var(--mint);color:var(--teal);font-style:normal}\n.best-for{padding-top:22px;border-top:1px solid var(--line)}\n.best-for small{display:block;color:var(--coral);font-size:.75rem;font-weight:850;letter-spacing:.11em}\n.best-for strong{font-size:.75rem}\n.walkthrough{position:relative;display:grid;min-height:520px;padding:40px;place-items:center;overflow:hidden;background:var(--ink);color:#fff}\n.walkthrough::before{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:36px 36px;content:\"\"}\n\n\n/* Workflow + report */\n.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;counter-reset:flow}\n.flow-card{position:relative;min-height:320px;padding:34px;border:1px solid var(--line);border-radius:26px;background:#fff;overflow:hidden}\n.flow-card::before{counter-increment:flow;content:\"0\" counter(flow);display:grid;width:44px;height:44px;place-items:center;border-radius:14px;background:var(--coral);color:#fff;font-size:.75rem;font-weight:900}\n.flow-card:nth-child(2)::before{background:var(--violet)}\n.flow-card:nth-child(3)::before{background:var(--teal)}\n.flow-card h3{margin:72px 0 12px;font-family:var(--display);font-size:1.5rem;line-height:1.1}\n.flow-card p{margin:0;color:var(--muted);font-size:.875rem}\n.human-note{display:grid;grid-template-columns:.34fr 1fr;gap:30px;margin-top:18px;padding:24px 28px;border-radius:20px;background:var(--ink);color:#fff}\n.human-note strong{color:var(--coral);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase}\n.human-note p{margin:0;color:#d5d4ea;font-size:.75rem}\n/* Use cases */\n/* Proof + trust */\n\n\n/* Blogs */\n.blog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}\n.blog-card{display:flex;min-height:480px;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:26px;background:#fff;transition:transform .25s ease,box-shadow .25s ease}\n.blog-card:hover{transform:translateY(-7px);box-shadow:var(--shadow)}\n.blog-banner{position:relative;aspect-ratio:16/9;overflow:hidden;background:linear-gradient(135deg,var(--violet),var(--coral))}\n.blog-banner img{width:100%;height:100%;object-fit:cover;transition:transform .45s ease}\n.blog-card:hover img{transform:scale(1.035)}\n.blog-card-body{display:flex;flex:1;padding:25px;flex-direction:column}\n.blog-card-body small{color:var(--coral);font-size:.75rem;font-weight:850;letter-spacing:.1em;text-transform:uppercase}\n.blog-card-body h3{margin:13px 0 12px;font-family:var(--display);font-size:1.125rem;line-height:1.24}\n.blog-card-body p{margin:0;color:var(--muted);font-size:.75rem}\n.text-link{display:inline-flex;gap:8px;margin-top:auto;padding-top:22px;align-items:center;font-size:.75rem;font-weight:850}\n.text-link:hover{color:var(--coral)}\n\n\n/* FAQ + CTA */\n.faq-layout{display:grid;grid-template-columns:.72fr 1.28fr;gap:80px}\n.faq-layout h2{margin:17px 0;font-family:var(--display);font-size:clamp(2.25rem,5vw,3rem);line-height:1.03;letter-spacing:-.05em}\n.faq-layout>div>p{color:var(--muted)}\n.faq-list{border-top:1px solid var(--line)}\n.faq-list details{border-bottom:1px solid var(--line)}\n.faq-list summary{display:flex;padding:22px 0;align-items:center;justify-content:space-between;gap:20px;font-size:.875rem;font-weight:800;cursor:pointer;list-style:none}\n.faq-list summary::-webkit-details-marker{display:none}\n.faq-list summary::after{display:grid;width:28px;height:28px;flex:0 0 auto;place-items:center;border-radius:50%;background:var(--lilac);color:var(--violet);content:\"+\";font-size:1rem}\n.faq-list details[open] summary::after{content:\"−\"}\n.faq-list details p{max-width:680px;margin:-6px 0 22px;color:var(--muted);font-size:.75rem}\n.final-cta{position:relative;padding:110px 0;overflow:hidden;background:var(--coral);color:#fff}\n.final-cta::before,.final-cta::after{position:absolute;border:1px solid rgba(255,255,255,.18);border-radius:50%;content:\"\"}\n.final-cta::before{width:540px;height:540px;right:-130px;top:-270px}\n.final-cta::after{width:370px;height:370px;right:-45px;top:-185px}\n.cta-layout{position:relative;z-index:1;display:grid;grid-template-columns:1fr .75fr;gap:70px;align-items:center}\n.cta-layout h2{max-width:700px;margin:17px 0 18px;font-family:var(--display);font-size:clamp(3rem,5vw,3rem);line-height:.98;letter-spacing:-.055em}\n.cta-layout p{max-width:690px;color:#fff3ed}\n.cta-signal{padding:34px;border:1px solid rgba(255,255,255,.24);border-radius:26px;background:rgba(17, 15, 53,.12);backdrop-filter:blur(6px)}\n.cta-signal small{font-size:.75rem;font-weight:850;letter-spacing:.1em;text-transform:uppercase}\n.cta-steps{display:flex;gap:10px;margin:31px 0}\n.cta-steps span{display:grid;min-height:50px;flex:1;place-items:center;border-radius:13px;background:#fff;color:var(--ink);font-size:.75rem;font-weight:850}\n.cta-steps span:nth-child(2){background:var(--lilac)}\n.cta-steps span:nth-child(3){background:var(--mint)}\n.cta-signal strong{font-family:var(--display);font-size:1.125rem}\n\n\n/* Footer */\n.site-footer{padding:65px 0 28px;background:#0c0b2a;color:#fff}\n.footer-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:80px}\n.footer-about p{max-width:500px;color:#b0aed3;font-size:.75rem}\n.footer-links{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}\n.footer-links strong{display:block;margin-bottom:13px;color:#fff;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase}\n.footer-links a{display:block;margin:8px 0;color:#b0aed3;font-size:.75rem}\n.footer-links a:hover{color:var(--coral)}\n.footer-bottom{display:flex;margin-top:52px;padding-top:22px;border-top:1px solid rgba(255,255,255,.12);justify-content:space-between;color:#6e6bac;font-size:.75rem}\n\n.legal-footer-links{display:flex;gap:10px;align-items:center}\n.legal-footer-links a{color:inherit}\n.legal-footer-links a:hover{color:#fff}\n\n\n/* Modal */\n.modal{position:fixed;z-index:200;inset:0;display:none;padding:30px;place-items:center;background:rgba(8, 6, 30,.78);backdrop-filter:blur(10px)}\n.modal.open{display:grid;animation:fade .2s ease}\n.modal-panel{position:relative;width:min(1120px,100%);max-height:calc(100vh - 50px);padding:28px;overflow:auto;border-radius:28px;background:var(--paper);box-shadow:0 35px 120px rgba(0,0,0,.34)}\n.modal-close{position:absolute;z-index:2;right:18px;top:18px}\n.modal-title{padding:8px 55px 24px 4px}\n.modal-title h2{margin:6px 0 0;font-family:var(--display);font-size:2.25rem;letter-spacing:-.04em}\n.modal-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:26px}\n.modal-video{display:grid;min-height:470px;padding:28px;place-items:center;border-radius:23px;background:var(--ink);color:#fff}\n.demo-form{padding:26px}\n.demo-form h3{margin:0;font-family:var(--display);font-size:1.5rem}\n.demo-form>p{color:var(--muted);font-size:.75rem}\n.field{display:grid;gap:5px;margin-top:12px;color:var(--ink);font-size:.75rem;font-weight:800}\n.field input,.field textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none}\n.field input:focus,.field textarea:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(103, 95, 252,.12)}\n.field textarea{min-height:84px;resize:vertical}\n.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.demo-form .btn{width:100%;margin-top:16px}\n.form-note{display:block;margin-top:9px;color:var(--muted);font-size:.75rem}\n.form-success{display:none;margin-top:13px;padding:12px;border-radius:11px;background:var(--mint);color:var(--teal);font-size:.75rem;font-weight:800}\n.form-success.show{display:block}\n/* Articles */\n\n\n@keyframes orbit{to{transform:rotate(360deg)}}\n@keyframes float{50%{transform:translateY(-9px)}}\n@keyframes progress{0%{width:0}65%{width:88%}100%{width:100%}}\n@keyframes story{0%,18%{transform:translateX(0);opacity:1}42%,100%{transform:translateX(18px);opacity:.32}}\n@keyframes metric{from{transform:scaleX(0)}}\n@keyframes fade{from{opacity:0}to{opacity:1}}\n\n@media(max-width:980px){.main-nav{display:none;position:absolute;top:76px;right:0;left:0;padding:20px;flex-direction:column;gap:12px;border:1px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:var(--shadow)}\n.main-nav.mobile-open{display:flex}\n.nav-wrap{position:relative;grid-template-columns:1fr auto}\n.menu-toggle{display:grid}\n.nav-actions .login{display:none}\n.hero{min-height:auto}\n.hero-grid,.section-head,.product-panel,.faq-layout,.cta-layout{grid-template-columns:1fr}\n.hero-grid{gap:30px}\n.signal-stage{min-height:560px}\n.section-head{gap:15px}\n.section-head p:last-child{margin-top:0}\n.product-copy{padding:40px}\n.walkthrough{min-height:430px}\n.flow{grid-template-columns:1fr}\n.flow-card{min-height:260px}\n.flow-card h3{margin-top:45px}\n.blog-grid{grid-template-columns:1fr 1fr}\n.blog-card:last-child{grid-column:1/-1}\n.modal-grid{grid-template-columns:1fr}\n.modal-video{min-height:390px}}\n\n@media(max-width:680px){.shell{width:min(100% - 26px,1280px)}\n.section{padding:78px 0}\n.nav-wrap{min-height:60px;padding-left:14px}\n.nav-actions .btn{min-height:42px;padding:0 16px;font-size:.75rem}\n.hero{padding-top:118px}\n.hero-copy h1{font-size:clamp(3rem,12vw,3rem)}\n.hero-copy>.lead{font-size:1rem}\n.button-row .btn{width:100%}\n.signal-stage{min-height:450px}\n.product-tabs{display:flex;overflow-x:auto}\n.product-tab{min-width:220px}\n.product-copy{padding:29px}\n.walkthrough{min-height:390px;padding:24px}\n.human-note{grid-template-columns:1fr;gap:8px}\n.blog-grid{grid-template-columns:1fr}\n.blog-card:last-child{grid-column:auto}\n.footer-grid,.footer-links{grid-template-columns:1fr}\n.footer-links{gap:18px}\n.footer-bottom{gap:10px;flex-direction:column}\n.modal{padding:8px}\n.modal-panel{padding:18px}\n.modal-title h2{font-size:1.5rem}\n.modal-video{min-height:330px;padding:16px}\n.demo-form{padding:20px 4px}\n.form-row{grid-template-columns:1fr}}\n\n/* Consistent content hierarchy and corrected walkthrough control */\n.section-head{display:block;max-width:820px;margin-bottom:54px}\n\n.section-head .section-label{margin-bottom:18px}\n\n.section-head p:last-child{max-width:680px;margin:18px 0 0}\n\n.faq-layout .eyebrow,.final-cta .eyebrow{margin-bottom:18px}\n\n.faq-layout h2,.cta-layout h2{margin-top:0}\n\n@media(min-width:681px){.hero-copy h1{font-size:clamp(3rem,5vw,3rem)}\n\n  .section-head h2{font-size:clamp(2.25rem,5vw,3rem)}\n\n  .product-copy h3{font-size:clamp(2.25rem,3.7vw,2.25rem)}\n\n  .faq-layout h2{font-size:clamp(2.25rem,5vw,3rem)}\n\n  .cta-layout h2{font-size:clamp(2.25rem,5vw,3rem)}}\n\n@media(max-width:680px){.hero-copy h1{font-size:clamp(2.25rem,10vw,3rem)}\n\n  .section-head h2{font-size:clamp(2.25rem,8vw,2.25rem)}\n\n  .product-copy h3{font-size:clamp(1.5rem,8vw,2.25rem)}\n\n  .faq-layout h2,.cta-layout h2{font-size:clamp(2.25rem,9vw,2.25rem)}}\n\n/* ---- Reduce Motion: remove movement, keep the interface responsive ----\n   The old rule was transition:none on everything, which also removed the\n   colour and shadow feedback on buttons, tabs and links. Anyone with the\n   system setting on got a page where nothing answered them at all, and\n   hover transforms snapped instead of easing, which is worse than no\n   movement. Now: nothing travels, but colour, border, shadow and opacity\n   still respond. */\n@media(prefers-reduced-motion:reduce){\n  *{scroll-behavior:auto!important;animation:none!important}\n  *{transition:color .18s ease,background-color .18s ease,border-color .18s ease,box-shadow .18s ease,opacity .18s ease!important}\n  .reveal{opacity:1!important;transform:none!important}\n  .back-link:hover,.back-link:hover .back-arrow,\n  .blog-card:hover,.blog-card:hover img,\n  .blog-tile:hover,.blog-tile:hover .bc-action em,.blog-tile:hover .bc-media img,\n  .btn:hover,.case-study-link:hover span,\n  .chat-card-btn:hover,.chat-card-btn:hover i,.chat-chips button:hover,\n  .chat-launch:hover,.chat-send:not(:disabled):hover,.chat-threads button:hover,\n  [data-chat-close]:hover,\n  .faq-prompts button:hover,\n  .feature-rows li:hover>span,.feature-rows li:hover>div,\n  .flow-card:hover,.legal-back:hover,.login-back:hover,.login:hover,\n  .login-reset [data-reset-back]:hover .back-arrow,\n  .use-case-tab:hover,.video-slot-play:hover{transform:none!important}\n\n.reveal{opacity:1;transform:none}}\n\n\n/* Final content interactions */\n.audience-word{display:inline-block;min-width:4.7em;color:var(--violet);transition:opacity .22s ease,transform .22s ease}\n\n.audience-word.changing{opacity:0;transform:translateY(8px)}\n\n\n/* Requested structural update */\n.brand-logo{display:flex;width:142px;height:45px;align-items:center}\n\n.brand-logo img{width:100%;height:100%;object-fit:contain;object-position:left center}\n\n.footer-brand-logo{filter:brightness(1.15)}\n\n.product-tab::after{right:22px;left:22px;background:transparent}\n\n.product-tab.active::after{background:linear-gradient(90deg,var(--coral),var(--violet),var(--teal));transform-origin:left;animation:tab-progress 20s linear both}\n\n@keyframes tab-progress{from{transform:scaleX(0)}to{transform:scaleX(1)}}\n\n.workspace-section{background:linear-gradient(135deg,#fffaf6,#f8f8ff)}\n\n.reports-section{background:linear-gradient(135deg,#fffaf6,#f5fbf9)}\n\n.split-feature{display:grid;grid-template-columns:1.15fr .85fr;gap:54px;align-items:center}\n\n.dashboard-placeholder{position:relative;display:grid;min-height:380px;paddin ndex:3;opacity:var(--hero-copy-opacity);transform:translateX(var(--hero-copy-shift));pointer-events:auto}\n\n.hero.video-expanded .hero-copy{pointer-events:none}\n\n.hero .signal-stage{position:absolute;z-index:2;inset:0 calc((100vw - 100%)/-2);min-height:0;clip-path:inset(var(--hero-video-top) var(--hero-video-right) var(--hero-video-bottom) var(--hero-video-left) round var(--hero-video-radius));filter:drop-shadow(0 26px 55px rgba(17, 15, 53,.12))}\n\n.hero-video-frame{height:100%;min-height:0;border-radius:var(--hero-video-radius);transition:none}\n\n.hero-video-frame::before{position:absolute;inset:0;background:linear-gradient(135deg,rgba(17, 15, 53,.02),rgba(103, 95, 252,.12));content:\"\"}\n\n.hero-video-content{position:absolute;z-index:2;top:50%;left:calc(50% + var(--hero-content-shift));display:flex;width:min(420px,calc(100% - 48px));flex-direction:column;align-items:center;transform:translate(-50%,-50%);text-align:center;will-change:left}\n\n.hero-video-content strong{margin-top:22px;font-size:.875rem}\n.hero-video-content small{margin-top:7px;color:#c7c6dc;font-size:.75rem}\n\n.human-note{min-height:78px;grid-template-columns:280px minmax(0,1fr);align-items:center}\n.human-note strong{white-space:nowrap}\n.human-note p{width:100%}\n\n.use-case-explorer{grid-template-columns:410px minmax(0,1fr)}\n\n.use-case-tab{font-size:.75rem;line-height:1;white-space:nowrap}\n\n.use-case-panel{display:grid;min-height:442px;grid-template-rows:auto minmax(116px,auto) minmax(94px,1fr) auto;align-content:start}\n\n.use-case-panel h3{width:min(100%,820px);max-width:none}\n.use-case-panel>p:not(.section-label){width:100%;max-width:none}\n\n.trust-layout{grid-template-columns:380px minmax(0,1fr);align-items:stretch}\n.trust-hero-card{height:100%}\n.trust-hero-card small{font-size:.75rem;white-space:nowrap}\n\n.trust-rows{display:grid;height:100%;grid-template-rows:repeat(5,1fr)}\n\n.trust-rows li{height:100%;padding:12px 0;align-items:center}\n.trust-rows li>div{display:grid;width:100%;grid-template-columns:190px minmax(0,1fr);gap:20px;align-items:center}\n.trust-rows h3,.trust-rows p{margin:0}\n.trust-rows p{width:100%;max-width:none;font-size:.75rem;line-height:1.55}\n\n.faq-list details{overflow:hidden}\n.faq-list details p{transform-origin:top;animation:faq-answer-in .32s cubic-bezier(.22,.7,.24,1) both}\n.faq-list details[open] summary::after{transform:rotate(180deg)}\n.faq-list summary::after{transition:transform .3s ease}\n\n@keyframes faq-answer-in{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}\n\n@media(max-width:980px){.hero{min-height:auto;padding:118px 0 72px}\n.hero-grid{position:relative;height:auto;min-height:0;padding:0}\n.hero-copy{opacity:1;transform:none}\n.hero .signal-stage{position:relative;inset:auto;min-height:480px;clip-path:none;filter:none}\n.hero-video-frame{transform:none}\n.hero-video-content{left:50%}\n.use-case-explorer,.trust-layout{grid-template-columns:1fr}\n.use-case-tabs{grid-template-columns:1fr;overflow-x:auto}\n.use-case-tab{min-width:max-content}\n.trust-rows li>div{grid-template-columns:170px minmax(0,1fr)}}\n\n@media(max-width:680px){.nav-wrap{height:62px;min-height:62px;grid-template-columns:1fr auto}\n.human-note{min-height:0;grid-template-columns:1fr}\n.use-case-panel{min-height:400px;grid-template-rows:auto auto auto auto}\n.trust-rows li>div{display:block}\n.trust-rows p{margin-top:5px}\n.hero .signal-stage{min-height:360px}}\n/* ---- Corrections ---- */\n/* Keyboard focus was invisible everywhere on the site. */\n:focus-visible{outline:3px solid var(--violet);outline-offset:3px;border-radius:4px}\n\n/* ---- Page gutter ----\n   Single source of truth for the side margin. Every horizontal container on every\n   page resolves against this token, so home, articles, login, terms and privacy all\n   align on the same edge. Change it here and the whole site follows. */\n:root{--page-gutter:80px}\n.shell{width:min(1280px,calc(100% - (var(--page-gutter) * 2)));margin-inline:auto}\n/* 80px each side leaves too little room on a phone, so the gutter steps down only\n   below 680px. Tablets and up keep the full 80px. */\n@media(max-width:680px){:root{--page-gutter:24px}}\n\n.skip-link{position:absolute;z-index:999;top:8px;left:-9999px;padding:12px 20px;border-radius:999px;background:var(--ink);color:#fff;font-size:.875rem;font-weight:800}\n.skip-link:focus{left:8px}\n.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}\n/* .reveal.in (0,2,0) outranked .hero-copy (0,1,0), so the scroll-driven fade and\n   shift never applied: the hero copy stayed at full opacity and sat unreadable\n   on top of the dark video as it expanded. */\n.hero .hero-copy.reveal.in{opacity:var(--hero-copy-opacity);transform:translateX(var(--hero-copy-shift))}\n/* .hero-video-frame{height:100%} resolves to auto against a parent that only has a\n   min-height, so below 980px the video placeholder collapsed to 0px and left a\n   blank gap where the hero visual should be. */\n@media(max-width:980px){\n  .hero .signal-stage{display:flex;align-items:stretch}\n  .hero .signal-stage>.hero-video-frame{flex:1 1 auto;height:auto;min-height:370px}\n}\n@media(max-width:680px){.hero .signal-stage>.hero-video-frame{min-height:300px}}\n\n.hero-grid{width:min(1280px,calc(100% - (var(--page-gutter) * 2)))}\n\n/* ================= Header ================= */\n/* .nav-actions > * {display:inline-flex} (0,1,1) was beating .menu-toggle\n   {display:none} (0,1,0), so the hamburger showed on desktop too. */\n.nav-wrap .menu-toggle{display:none}\n@media(max-width:980px){.nav-wrap .menu-toggle{display:grid}}\n\n/* Everything in the bar sits on one optical baseline. */\n.nav-wrap{display:grid;grid-template-columns:minmax(180px,1fr) auto minmax(250px,1fr);align-items:center}\n.brand-logo{display:inline-flex;height:52px;width:auto;align-items:center}\n/* The wordmark's letterforms sit 15px (of 107px of artwork) above the image's\n   geometric centre, because the pulse tail hangs below the baseline. Centring the\n   box therefore leaves the type reading high, so nudge the art to put the\n   letterforms - not the bounding box - on the same line as the nav and buttons. */\n.brand-logo img{display:block;height:30px;width:auto;max-height:none;object-fit:contain;transform:translateY(4px)}\n.main-nav a,.nav-actions .login,.nav-actions .btn{line-height:1}\n\n/* Log in matches Book a Demo exactly, minus the outline. */\n.nav-actions .login{\n  display:inline-flex;min-height:52px;padding:0 24px;align-items:center;justify-content:center;\n  border:0;border-radius:999px;background:transparent;\n  font-size:.875rem;font-weight:800;color:var(--ink);\n  transition:background .2s ease,color .2s ease;\n}\n.nav-actions .login:hover{background:rgba(103, 95, 252,.09);color:var(--violet);transform:none}\n\n/* Deeper blur once the page is scrolled under the bar. */\n.site-header .nav-wrap{transition:background .3s ease,backdrop-filter .3s ease,box-shadow .3s ease,border-color .3s ease}\n/* Heavier blur, but the plate stays opaque enough that the dark nav text keeps\n   its contrast when the dark hero video scrolls underneath it. */\n.site-header.scrolled .nav-wrap{background:rgba(255,250,246,.84);box-shadow:0 16px 46px rgba(17, 15, 53,.16);border-color:rgba(17, 15, 53,.12);\n  backdrop-filter:blur(36px) saturate(180%);-webkit-backdrop-filter:blur(36px) saturate(180%)}\n@supports not (backdrop-filter:blur(1px)){.site-header.scrolled .nav-wrap{background:rgba(255,250,246,.97)}}\n\n/* Mobile: the panel carries the nav links and both CTAs; the bar keeps the toggle. */\n.mobile-actions{display:none}\n@media(max-width:980px){\n  /* .main-nav{height:100%} from the desktop alignment block was clamping the dropdown\n     to the 72px bar, so the links spilled out over the hero. */\n  .main-nav{top:78px;height:auto;max-height:calc(100vh - 110px);overflow-y:auto;\n    padding:16px;gap:2px;align-items:stretch;background:var(--paper)}\n  .main-nav a{padding:13px 8px;font-size:.875rem;border-radius:10px}\n  .main-nav a:hover{background:#f2f1ff}\n  .mobile-actions{display:grid;gap:10px;margin-top:10px;padding-top:14px;border-top:1px solid var(--line)}\n  .mobile-actions .login{display:inline-flex;justify-content:center;min-height:48px}\n  .mobile-actions .btn{width:100%;min-height:48px}\n  .nav-actions>.login,.nav-actions>.btn{display:none}\n}\n\n/* ================= Hero: pencil-roll word ================= */\n.audience-rotator{display:inline-block;perspective:520px;vertical-align:baseline}\n.audience-word{display:inline-block;min-width:4.7em;transform-origin:50% 50% -.55em;\n  transition:transform .38s cubic-bezier(.45,.05,.3,1),opacity .38s ease;backface-visibility:hidden;opacity:1;transform:none}\n.audience-word.rolling-out{transform:rotateX(90deg);opacity:0}\n.audience-word.rolling-in{transform:rotateX(-90deg);opacity:0}\n.audience-word.no-transition{transition:none}\n\n/* ================= Hero: video is a real box, not a clip window ================= */\n/* Desktop only - below 980px the hero stacks and the frame is a normal flex child. */\n@media(min-width:981px){\n  .hero .signal-stage{position:absolute;z-index:2;inset:0 calc((100vw - 100%) / -2);min-height:0;clip-path:none;filter:none;display:block}\n  /* width:100% on .developer-video-slot over-constrains an absolutely positioned\n     box: the browser keeps left+width and drops the right offset, so the frame ran\n     far past the viewport and was only hidden by the hero's overflow:clip. */\n  .hero .signal-stage>.hero-video-frame{position:absolute;\n    top:var(--hero-video-top);right:var(--hero-video-right);bottom:var(--hero-video-bottom);left:var(--hero-video-left);\n    width:auto;height:auto;min-height:0;border-radius:var(--hero-video-radius);\n    box-shadow:0 26px 55px rgba(17, 15, 53,.12)}\n}\n/* Centred by the frame's own flex box, so it holds at every point of the expansion\n   instead of being positioned against a clip window that moves independently. */\n.hero .signal-stage>.hero-video-frame{display:flex;align-items:center;justify-content:center}\n.hero .hero-video-content{position:static;transform:none;left:auto;top:auto;\n  display:flex;flex-direction:column;align-items:center;justify-content:center;\n  width:min(460px,calc(100% - 48px));text-align:center}\n\n/* ================= Product tabs ================= */\n.product-tab{padding:26px 24px}\n.product-tab strong{margin:0;font-family:var(--display);font-size:1.125rem;line-height:1.15;letter-spacing:-.02em}\n/* The progress line now spans the whole tab so it meets the panel edge to edge. */\n.product-tab::after{right:0;left:0;height:4px;bottom:-1px;border-radius:0}\n.product-tab.active::after{background:linear-gradient(90deg,var(--coral),var(--violet),var(--teal));\n  transform-origin:left;animation:tab-progress 20s linear both}\n@media(max-width:980px){.product-tab strong{font-size:1.125rem}}\n@media(max-width:680px){.product-tab{min-width:190px;padding:20px 18px}.product-tab strong{font-size:1rem}}\n\n/* ================= Use cases: one panel size for every question ================= */\n.use-case-panel{min-height:520px}\n.use-case-tab{font-size:.75rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:18px 20px}\n@media(max-width:980px){\n  .use-case-panel{min-height:0}\n  .use-case-tab{white-space:normal;text-overflow:clip}\n}\n\n/* ================= Trust rows ================= */\n/* Wider card, and each row reads number | heading over description. */\n.trust-layout{grid-template-columns:minmax(0,500px) minmax(0,1fr);gap:44px}\n.trust-rows li>div{display:block;width:100%}\n.trust-rows li{align-items:center;padding:16px 0}\n.trust-rows h3{margin:0 0 4px;font-size:.875rem}\n.trust-rows p{margin:0;width:100%;max-width:none;font-size:.75rem;line-height:1.5}\n.trust-rows li>span{align-self:center}\n@media(max-width:980px){.trust-layout{grid-template-columns:1fr}}\n\n/* ---------------- Type scale ---------------- */\n:root{\n  --step-hero:clamp(2.25rem,5vw,3rem);   /* h1        ~48px  */\n  --step-h2:clamp(1.5rem,3.7vw,2.25rem);    /* section   ~36px  */\n  --step-h3:clamp(1.5rem,2.5vw,1.5rem);    /* panel     ~27px  */\n  --step-h4:1.125rem;                          /* card      ~19px  */\n  --step-lead:1rem;                       /* intro     ~17px  */\n  --step-body:1rem;                          /* body      ~16px  */\n  --step-small:.875rem;                        /* detail    ~14.5px*/\n  --step-label:.75rem;                       /* eyebrow   ~11.5px*/\n}\n\n/* ---------------- Role assignment ---------------- */\nh1,h2,h3,h4,.logo,.product-tab strong,.trust-metric strong,.cta-signal strong{font-family:var(--display)}\nbody,p,li,input,textarea,button,summary,.lead{font-family:var(--body)}\n.section-label,.eyebrow,.kicker,.flow-stage,.best-for small,.article-meta,\n.blog-card-body small,.trust-hero-card small,.trust-strip-label,.form-note{font-family:var(--body)}\n\n/* ---------------- Headings: down ---------------- */\n.hero-copy h1{font-size:var(--step-hero);line-height:1.06;letter-spacing:-.035em}\n.section-head h2,.trust-copy h2,.faq-layout h2,.proof-story h2{font-size:var(--step-h2);line-height:1.12;letter-spacing:-.028em}\n.cta-layout h2{font-size:clamp(2.25rem,3.7vw,2.25rem);line-height:1.1;letter-spacing:-.03em}\n.product-copy h3,.use-case-panel h3{font-size:var(--step-h3);line-height:1.16;letter-spacing:-.022em}\n.trust-hero-card h3{font-size:clamp(1.125rem,2.5vw,1.5rem);line-height:1.2;letter-spacing:-.02em}\n.flow-card h3,.hook-card h3{font-size:var(--step-h4);line-height:1.25;letter-spacing:-.012em}\n.blog-card-body h3{font-size:1rem;line-height:1.32;letter-spacing:-.01em}\n.modal-title h2{font-size:1.5rem;letter-spacing:-.025em}\n.demo-form h3{font-size:1.125rem}\n\n/* ---------------- Supporting text: up ---------------- */\n.hero-copy>.lead{font-size:var(--step-lead);line-height:1.62}\n.section-head p:last-child{font-size:var(--step-lead);line-height:1.6}\n.feature-rows h3,.trust-rows h3{font-size:1rem;line-height:1.35}\n.feature-rows p,.trust-rows p{font-size:var(--step-small);line-height:1.55}\n.flow-card p,.hook-card p,.use-case-panel>p:not(.section-label){font-size:var(--step-small);line-height:1.6}\n.blog-card-body p{font-size:var(--step-small);line-height:1.55}\n.faq-list summary{font-size:1rem}\n.faq-list details p{font-size:var(--step-small);line-height:1.65}\n.trust-metric span{font-size:.75rem}\n.product-tab strong{font-size:1.125rem;line-height:1.2}\n.human-note p{font-size:var(--step-small)}\n.cta-layout p,.proof-story p{font-size:var(--step-lead)}\n\n/* ---------------- Eyebrows: one consistent treatment ---------------- */\n.section-label,.eyebrow,.kicker,.flow-stage,.trust-strip-label{\n  font-size:var(--step-label);font-weight:700;letter-spacing:.15em;text-transform:uppercase;\n}\n.blog-card-body small,.trust-hero-card small,.best-for small{font-size:.75rem;letter-spacing:.13em}\n\n/* ---------------- Vertical rhythm ---------------- */\n.section{padding:76px 0}\n.section-head{margin-bottom:38px}\n.section-head p:last-child{margin-top:14px}\n.eyebrow,.section-head .section-label{margin-bottom:14px}\n\n/* Component internals, trimmed to match the smaller type */\n.product-copy{padding:44px}\n.product-tab{padding:20px 22px}\n.product-panel{min-height:300px}\n.walkthrough{padding:28px;min-height:440px}\n.flow-card{min-height:0;padding:26px}\n.flow-card h3{margin:14px 0 10px}\n.flow-stage{margin-top:26px}\n.feature-rows li{padding:15px 0}\n.dashboard-placeholder{min-height:320px;padding:32px}\n.use-case-panel{min-height:280px;padding:40px}\n/* The panel carried grid-template-rows: auto minmax(116px,auto) minmax(94px,1fr) auto.\n   Those fixed tracks squeezed the body paragraph into a row shorter than its own\n   text, and overflow:hidden then clipped it. Normal flow + a measured min-height\n   gives equal panels without cutting anything off. */\n.use-case-panel{display:block;grid-template-rows:none}\n.use-case-panel h3{margin:16px 0}\n.use-case-tab{padding:15px 18px;font-size:.75rem}\n.use-case-tags{margin-top:22px}\n.trust-hero-card{min-height:0;padding:32px}\n.trust-hero-card h3{margin:22px 0 16px}\n.trust-rows li{padding:12px 0}\n.blog-card{min-height:0}\n.blog-card-body{padding:22px}\n.human-note{padding:20px 26px}\n.faq-list summary{padding:18px 0}\n.faq-list details p{margin:-4px 0 18px}\n.final-cta{padding:80px 0}\n.modal-video{min-height:380px}\n\n@media(max-width:980px){\n  .section{padding:60px 0}\n  .product-copy{padding:32px}\n  .use-case-panel{min-height:0;padding:30px}\n  .product-panel,.walkthrough{min-height:0}\n}\n@media(max-width:680px){\n  .section{padding:52px 0}\n  .section-head{margin-bottom:28px}\n  .hero-copy h1{font-size:clamp(2.25rem,8.5vw,2.25rem)}\n  .section-head h2{font-size:clamp(1.5rem,6.5vw,2.25rem)}\n  .product-copy{padding:24px}\n  .trust-hero-card{padding:26px}\n}\n\n/* ============ 1 · Nav CTA sized to the Log in button ============ */\n/* Header box is untouched: still 72px tall, same grid, same gutters. Only the\n   pill's own metrics come down so it stops dominating the bar. */\n.nav-actions .btn.primary{min-height:42px;padding:0 18px;font-size:.875rem;box-shadow:0 8px 18px rgba(238,133,27,.2)}\n.nav-actions .login{min-height:42px;padding:0 16px;font-size:.875rem}\n.nav-actions{gap:4px}\n\n/* ============ 2 · Hero: video matches the copy height, 80px frame ============ */\n.hero-grid{padding-top:calc(72px + 80px);padding-bottom:80px}\n@media(min-width:981px){\n  .hero-grid{align-items:center}\n  /* The frame's resting box is driven by the copy column, so the two sides\n     finish on the same line instead of the graphic running long. */\n  .hero .signal-stage>.hero-video-frame{\n    top:var(--hero-video-top);bottom:var(--hero-video-bottom);\n  }\n}\n\n/* The .reveal entrance transition (opacity .7s) was also animating the\n   scroll-driven fade, so the copy lagged ~0.7s behind the scroll and was still\n   at 63% opacity when the video hit half expansion. The scroll value must track\n   the wheel 1:1. */\n@media(min-width:981px){.hero .hero-copy.reveal.in{transition:none}}\n\n/* ============ 3 · Hero word: two-face cylinder ============ */\n/* The front face stays in normal flow so the rotator gets a real height; the\n   next face rides above it on the same cylinder. An absolutely positioned front\n   face collapsed the whole slot to 0x0. */\n.audience-rotator{\n  display:inline-block;position:relative;vertical-align:top;\n  perspective:900px;transition:width .62s cubic-bezier(.5,.05,.2,1);\n}\n.audience-roll{\n  position:relative;display:block;transform-style:preserve-3d;\n  transition:transform .62s cubic-bezier(.5,.05,.2,1);\n}\n.audience-roll.turning{transform:rotateX(-90deg)}\n.audience-roll.no-transition{transition:none}\n.audience-face{display:block;white-space:nowrap;backface-visibility:hidden;color:var(--violet)}\n.face-front{position:relative;transform:translateZ(var(--radius,26px))}\n.face-next{position:absolute;top:0;left:0;transform:rotateX(90deg) translateZ(var(--radius,26px))}\n@media(prefers-reduced-motion:reduce){\n  .audience-roll{transition:none!important;transform:none!important}\n  .face-next{display:none}\n}\n\n/* 3b · the keyline marker */\n.hero-keyline{gap:10px}\n.hero-keyline i{\n  width:7px;height:7px;flex:0 0 auto;border-radius:50%;\n  background:var(--coral);box-shadow:0 0 0 4px rgba(238,133,27,.16);\n}\n\n/* ============ 5 · Product tabs ============ */\n.product-tab{text-align:center}\n.product-tab strong{display:block;text-align:center}\n/* Thinner progress rule: still readable as progress, no longer the loudest\n   thing in the component. */\n.product-tab::after{height:2px;border-radius:2px}\n.product-tab.active::after{opacity:.75}\n\n/* ============ 6/7 · Split feature: card matches the text column ============ */\n.split-feature{align-items:stretch}\n.split-feature>.dashboard-placeholder{height:100%;min-height:0}\n.split-feature>.feature-rows{display:flex;flex-direction:column;justify-content:center}\n\n/* ============ 8 · Use cases: fill the cards ============ */\n.use-case-tab{font-size:.875rem;padding:19px 22px;line-height:1.3}\n.use-case-panel{padding:44px}\n.use-case-panel h3{font-size:clamp(1.5rem,3.7vw,2.25rem);margin:18px 0 16px}\n.use-case-panel>p:not(.section-label){font-size:1rem;line-height:1.65}\n.use-case-tags span{font-size:.75rem;padding:9px 15px}\n.use-case-tags{margin-top:26px}\n\n/* ============ 9 · Trust: wider card, copy shifted right, larger type ============ */\n.trust-layout{grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:64px}\n.trust-hero-card{padding:40px}\n.trust-hero-card small{font-size:.75rem}\n.trust-hero-card h3{font-size:clamp(1.5rem,3.7vw,2.25rem);margin:26px 0 18px}\n.trust-hero-card p{font-size:1rem;line-height:1.62;max-width:none}\n.trust-rows h3{font-size:1.125rem}\n.trust-rows p{font-size:.875rem;line-height:1.55}\n.trust-rows li>span{width:42px;height:42px;font-size:.75rem}\n.trust-rows li{padding:15px 0}\n\n/* ============ 12 · Final CTA: quiet moving ground ============ */\n.final-cta{position:relative;isolation:isolate}\n.cta-aurora{\n  position:absolute;inset:-25%;z-index:0;pointer-events:none;opacity:.5;\n  background:\n    radial-gradient(38% 46% at 22% 32%,rgba(255,255,255,.30),transparent 62%),\n    radial-gradient(32% 42% at 74% 66%,rgba(255,216,112,.34),transparent 64%),\n    radial-gradient(30% 38% at 52% 18%,rgba(103, 95, 252,.24),transparent 66%);\n  animation:aurora 22s ease-in-out infinite alternate;\n  will-change:transform;\n}\n.final-cta .shell{position:relative;z-index:1}\n@keyframes aurora{\n  0%{transform:translate3d(-3%,-2%,0) scale(1.04)}\n  50%{transform:translate3d(3%,2%,0) scale(1.12)}\n  100%{transform:translate3d(-2%,3%,0) scale(1.06)}\n}\n@media(prefers-reduced-motion:reduce){.cta-aurora{animation:none}}\n\n/* ============ 14 · Footer logo ============ */\n.footer-brand-logo{filter:none;width:auto;height:46px}\n.footer-brand-logo img{height:38px;width:auto;transform:translateY(4px)}\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n/* ============ 16 · Demo dialog fits one screen ============ */\n.modal{padding:24px}\n.modal-panel{max-height:calc(100vh - 48px);padding:22px}\n.modal-title{padding:4px 48px 16px 2px}\n.modal-title h2{font-size:1.125rem;margin-top:4px}\n.modal-grid{gap:20px;align-items:stretch}\n.modal-video{min-height:0;padding:18px}\n.modal-video .developer-video-slot{min-height:0;height:100%}\n.demo-form{display:flex;flex-direction:column;justify-content:center;padding:4px 2px}\n.demo-form h3{font-size:1.125rem;margin-bottom:2px}\n.demo-form>p{font-size:.75rem;margin:4px 0 2px}\n.field{margin-top:9px;font-size:.75rem}\n.field input{padding:9px 12px;border-radius:9px}\n.field textarea{min-height:60px;padding:9px 12px;border-radius:9px}\n.demo-form .btn{min-height:46px;margin-top:12px}\n.form-note{margin-top:7px;font-size:.75rem}\n\n.section-cta .btn.outline{border-color:rgba(17, 15, 53,.2)}\n\n/* ================= The blog card ================= */\n.blog-tile{\n  display:flex;flex-direction:column;overflow:hidden;\n  border:1px solid var(--line);border-radius:22px;background:#fff;color:inherit;\n  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;\n}\n.blog-tile:hover{transform:translateY(-5px);border-color:rgba(103, 95, 252,.32);box-shadow:0 18px 44px rgba(17, 15, 53,.1)}\n.bc-media{display:block;aspect-ratio:16/9;overflow:hidden;background:#f0effa}\n/* contain, not cover: the whole illustration stays visible and uncropped. */\n.bc-media img{display:block;width:100%;height:100%;object-fit:contain;background:#f6f5ff;transition:transform .4s ease}\n.blog-tile:hover .bc-media img{transform:scale(1.02)}\n.bc-body{display:flex;flex:1;flex-direction:column;padding:22px}\n.bc-eyebrow{\n  display:flex;gap:8px;align-items:center;color:var(--coral);\n  font-family:var(--body);font-size:.75rem;font-weight:700;\n  letter-spacing:.13em;text-transform:uppercase;\n}\n.bc-eyebrow i{font-style:normal;opacity:.55}\n.bc-title{\n  margin:13px 0 10px;font-family:var(--display);font-size:1rem;font-weight:700;\n  line-height:1.32;letter-spacing:-.01em;color:var(--ink);\n}\n.bc-desc{\n  flex:1;color:var(--muted);font-size:.875rem;line-height:1.55;\n  /* Live decks vary from one line to six; four keeps every card readable and\n     the grid even without truncating anything that matters. */\n  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;\n}\n.bc-action{\n  display:inline-flex;gap:8px;margin-top:18px;align-items:center;\n  color:var(--violet);font-size:.75rem;font-weight:800;\n}\n.bc-action em{font-style:normal;transition:transform .22s ease}\n.blog-tile:hover .bc-action{color:var(--coral)}\n.blog-tile:hover .bc-action em{transform:translateX(4px)}\n.blog-tile[hidden]{display:none}\n/* three across wherever the card is used */\n.blog-grid,.more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}\n@media(max-width:980px){.blog-grid,.more-grid{grid-template-columns:1fr 1fr}}\n@media(max-width:680px){.blog-grid,.more-grid{grid-template-columns:1fr}}\n\n/* ================= Header blends into the hero ================= */\n/* At rest the bar is part of the hero: no plate, no border, no shadow, and no\n   line where one section meets the other. The glass only arrives on scroll. */\n.site-header{top:0;padding-top:10px}\n.nav-wrap{\n  border:1px solid transparent;border-radius:18px;background:transparent;box-shadow:none;\n  backdrop-filter:none;-webkit-backdrop-filter:none;\n  transition:background .35s ease,backdrop-filter .35s ease,box-shadow .35s ease,border-color .35s ease;\n}\n.hero{border-top:0}\n/* Glassmorphism, kept light: a thin translucent plate, a soft inner highlight\n   and a modest blur — enough to separate the bar from moving content without\n   turning into a frosted slab. */\n.site-header.scrolled .nav-wrap{\n  border-color:rgba(255,255,255,.55);\n  background:rgba(255,251,248,.55);\n  backdrop-filter:blur(16px) saturate(150%);\n  -webkit-backdrop-filter:blur(16px) saturate(150%);\n  box-shadow:0 8px 30px rgba(17, 15, 53,.09),inset 0 1px 0 rgba(255,255,255,.7);\n}\n@supports not (backdrop-filter:blur(1px)){.site-header.scrolled .nav-wrap{background:rgba(255,251,248,.94)}}\n/* Hero starts under the bar, so the two read as one surface. */\n.hero-grid{padding-top:calc(72px + 60px)}\n\n/* ================= Hero word rolls bottom → top ================= */\n.audience-roll.turning{transform:rotateX(90deg)}\n.face-next{transform:rotateX(-90deg) translateZ(var(--radius,26px))}\n\n/* ================= Product tabs: breathing room ================= */\n.product-tab{padding:30px 22px}\n@media(max-width:680px){.product-tab{padding:24px 18px}}\n\n/* ================= Use-case panel: fill the space, even rhythm ================= */\n/* Panels are all the same height so nothing jumps; the tags now sit against the\n   bottom edge so the extra room reads as layout instead of a gap. */\n.use-case-panel{display:flex;flex-direction:column}\n.use-case-panel>.section-label{margin-bottom:18px}\n.use-case-panel h3{margin:0 0 18px}\n.use-case-panel>p:not(.section-label){margin:0}\n.use-case-tags{margin-top:auto;padding-top:28px}\n\n/* One spacing rhythm from section heading through to the button. */\n.section-head{margin-bottom:34px}\n.section-head p:last-child{margin-top:16px}\n.section-cta{margin-top:40px;justify-content:center}\n.use-case-explorer+.section-cta,.uc-grid+.section-cta{margin-top:40px}\n\n/* ================= Demo dialog: real separation, bigger heading ================= */\n.modal-panel{padding:28px}\n.modal-title{padding:2px 48px 20px 2px}\n.modal-title h2{font-size:1.5rem;margin-top:6px}\n.modal-grid{gap:38px}\n.modal-video{padding:24px;border-radius:20px}\n.demo-form{padding:2px 4px 2px 6px}\n.demo-form h3{font-size:1.125rem}\n.field{margin-top:11px}\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n/* The launcher icon sets the palette — the panel is the same purple, one\n   step lighter, so opening it feels like the icon expanding rather than a\n   different component arriving. */\n\n\n\n\n\n\n\n\n\n/* A close control that reads as a button: filled, 32px, high contrast. */\n\n\n\n\n\n/* Light purple through the conversation area. */\n\n\n\n\n\n\n\n\n\n\n/* ================= Reports: copy left, visual right ================= */\n/* The workspace section above runs visual-left. Flipping this one gives the\n   page an alternating rhythm instead of two identical rows in a row. The\n   visual keeps the wider column, so both sections' images match in size. */\n.reports-section .split-feature{grid-template-columns:.85fr 1.15fr}\n.reports-section .split-feature>.feature-rows{order:1}\n.reports-section .split-feature>.dashboard-placeholder{order:2}\n@media(max-width:980px){\n  .reports-section .split-feature{grid-template-columns:1fr}\n  /* Stacked, the copy still leads and the visual follows it. */\n  .reports-section .split-feature>.feature-rows{order:1}\n  .reports-section .split-feature>.dashboard-placeholder{order:2}\n}\n\n\n/* ================= Back navigation: one button, one place ================= */\n.back-link{\n  display:inline-flex;gap:8px;align-items:center;\n  min-height:42px;padding:0 18px;\n  border:1px solid var(--line);border-radius:999px;background:#fff;\n  /* Stated explicitly: this button was inheriting white from the legal header\n     and only appeared on hover. It is always visible now. */\n  color:var(--ink);opacity:1;visibility:visible;\n  font-family:var(--body);font-size:.75rem;font-weight:750;letter-spacing:0;\n  text-decoration:none;white-space:nowrap;\n  transition:border-color .2s ease,color .2s ease,transform .2s ease,box-shadow .2s ease;\n}\n.back-link .back-arrow{font-size:1em;line-height:1;transition:transform .2s ease}\n.back-link:hover,.back-link:focus-visible{\n  border-color:var(--violet);color:var(--violet);\n  transform:translateY(-1px);box-shadow:0 6px 18px rgba(103, 95, 252,.13);\n}\n.back-link:hover .back-arrow{transform:translateX(-3px)}\n.back-link:focus-visible{outline:2px solid var(--violet);outline-offset:2px}\n/* Kill the older per-page overrides by name so nothing re-colours it. */\n.legal-nav .back-link,.article-nav .back-link,.login-nav .back-link,\n.legal-nav .legal-back,.login-back{color:var(--ink);font-size:.75rem;min-height:42px;padding:0 18px}\n@media(max-width:680px){.back-link{min-height:38px;padding:0 14px;font-size:.75rem}}\n\n\n\n\n\n\n\n\n/* ================= How It Works: the motif ================= */\n/* Sits in the card's top-right whitespace. Nothing above it moved: the number\n   badge, stage label, heading and description are where they were. */\n.flow-card{overflow:hidden}\n\n\n\n\n\n\n/* Hover is the interactive beat: the waveform speaks, the bars step up, the\n   spark turns, the ring completes. One gesture per card, same \n   timing across all three. */\n.flow-card{transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}\n.flow-card:hover{border-color:rgba(103, 95, 252,.3);box-shadow:0 18px 44px rgba(17, 15, 53,.1)}\n.flow-card:hover .sa-spark{animation:sa-spin 1.1s ease-in-out infinite}\n.flow-card:hover .sa-wave rect{animation:sa-talk .8s ease-in-out infinite}\n.flow-card:hover .sa-wave rect:nth-child(2){animation-delay:.13s}\n.flow-card:hover .sa-wave rect:nth-child(3){animation-delay:.26s}\n.flow-card:hover .sa-bars rect{animation:sa-step .7s cubic-bezier(.3,.9,.3,1) both}\n.flow-card:hover .sa-bars rect:nth-child(2){animation-delay:.07s}\n.flow-card:hover .sa-bars rect:nth-child(3){animation-delay:.14s}\n.flow-card:hover .sa-ring{animation:sa-full .8s cubic-bezier(.4,0,.2,1) forwards}\n.flow-card:hover .sa-row{animation:sa-slide .55s ease both}\n.flow-card:hover .r2{animation-delay:.08s}\n.flow-card:hover .r3{animation-delay:.16s}\n\n\n\n\n\n.sa-wave rect,.sa-bars rect{transform-origin:center bottom;transform-box:fill-box}\n\n.modal .demo-form .btn.primary{min-height:52px;font-size:.875rem}\n\n/* ================= Hover belongs to the thing you can act on ================= */\n/* These five sections are content, not controls: lifting the whole card on\n   hover implied a click target that was never there, and the shadow moved\n   under text people were reading. The interactive parts keep their hover. */\n.product-shell:hover,.dashboard-placeholder:hover,.use-case-panel:hover,\n.trust-hero-card:hover,.final-cta .cta-signal:hover{\n  transform:none;box-shadow:0 20px 50px rgba(17, 15, 53,.06);\n}\n.dashboard-placeholder:hover{box-shadow:0 24px 60px rgba(17, 15, 53,.08)}\n.trust-hero-card:hover{box-shadow:var(--shadow)}\n.final-cta .cta-signal:hover{box-shadow:none}\n\n/* The row hover stays exactly as it was — the slide and the tint are the\n   section's own interaction. Only the whole-card lift above is removed. */\n\n/* In Reports alone, each description is held at two lines so the hover slide\n   cannot re-wrap Patterns from one line to two and push the column down.\n   Scoped to this section: applying it everywhere stretched the trust rows and\n   made that section far taller than it should be. */\n.reports-section .feature-rows li p{\n  min-height:calc(2 * 1.55em);\n  margin-bottom:0;\n  line-height:1.55;\n}\n\n/* Tabs: the hover is on the tab you are pointing at, not the panel below it. */\n.product-shell{transition:box-shadow .25s ease}\n.product-tab{transition:background .12s linear,color .12s linear}\n.product-tab:hover{background:#f2f1ff}\n.product-tab.active{background:#f8f8ff}\n/* The switch itself is immediate — the content and the selected tab change on\n   the same frame, with nothing fading in between. */\n.product-panel,.product-copy,.walkthrough{transition:none;animation:none}\n\n/* ================= Final CTA: a living background ================= */\n.final-cta{position:relative;isolation:isolate;overflow:hidden}\n.final-cta>*:not(.cta-aurora){position:relative;z-index:2}\n.cta-aurora{\n  position:absolute;z-index:0;inset:-30%;\n  background:\n    radial-gradient(38% 46% at 18% 28%,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 60%),\n    radial-gradient(36% 44% at 84% 22%,rgba(107, 99, 252,.85) 0%,rgba(107, 99, 252,0) 62%),\n    radial-gradient(46% 54% at 72% 90%,rgba(12,176,156,.7) 0%,rgba(12,176,156,0) 64%),\n    radial-gradient(32% 40% at 30% 88%,rgba(255,205,120,.8) 0%,rgba(255,205,120,0) 60%),\n    radial-gradient(28% 34% at 50% 50%,rgba(255,120,80,.5) 0%,rgba(255,120,80,0) 66%);\n  filter:blur(10px);\n  animation:cta-drift 22s ease-in-out infinite alternate;\n}\n@keyframes cta-drift{\n  0%{transform:translate3d(-6%,-4%,0) scale(1.05) rotate(0deg)}\n  50%{transform:translate3d(6%,4%,0) scale(1.2) rotate(7deg)}\n  100%{transform:translate3d(-4%,6%,0) scale(1.1) rotate(-6deg)}\n}\n/* A second, slower layer so the movement never reads as one looping shape. */\n.final-cta::before{\n  position:absolute;z-index:1;inset:-20%;content:\"\";\n  background:\n    radial-gradient(26% 34% at 60% 20%,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 60%),\n    radial-gradient(30% 36% at 20% 70%,rgba(255,255,255,.2) 0%,rgba(255,255,255,0) 62%);\n  animation:cta-drift-2 38s ease-in-out infinite alternate;\n}\n@keyframes cta-drift-2{\n  from{transform:translate3d(4%,3%,0) scale(1.1)}\n  to{transform:translate3d(-5%,-4%,0) scale(1.02)}\n}\n/* A sheen that is always somewhere on its way across, so the section is never\n   sitting still — no dead time, no start-then-stop. */\n.final-cta::after{\n  position:absolute;z-index:1;top:-50%;bottom:-50%;left:-60%;width:38%;content:\"\";\n  background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.22),rgba(255,255,255,0));\n  transform:rotate(8deg);\n  animation:cta-sheen 14s linear infinite;\n}\n@keyframes cta-sheen{from{left:-60%}to{left:130%}}\n@media(prefers-reduced-motion:reduce){\n  .cta-aurora,.final-cta::before,.final-cta::after{animation:none}\n  .final-cta::after{display:none}\n}\n\n/* The View All button sits under the middle card, not against the left edge. */\n.section-cta{display:flex;justify-content:center}\n\n/* ================= Product tab progress line ================= */\n/* One duration for the line and the rotation, declared once. */\n.product-shell{--dwell:15s}\n.product-tab.active::after{animation:tab-progress var(--dwell) linear both}\n.product-shell[data-rotation=\"paused\"] .product-tab.active::after{animation-play-state:paused}\n.product-shell[data-rotation=\"off\"] .product-tab.active::after{animation:none;transform:scaleX(1)}\n@media(prefers-reduced-motion:reduce){.product-tab.active::after{animation:none;transform:scaleX(1)}}\n\n/* ================= Product tab line ================= */\n/* Driven straight from the rotation's own progress — no CSS animation to fall\n   out of step with it. */\n.product-tab.active::after{\n  animation:none;\n  transform:scaleX(var(--p,0));\n  transform-origin:left;\n}\n.product-shell[data-rotation=\"off\"] .product-tab.active::after{transform:scaleX(1)}\n\n/* ================= Final CTA ================= */\n/* The drifting blobs are gone. What is left is a dot tracking the ring that was\n   always in this panel, and one very slow breath behind it. */\n.final-cta::before,.final-cta::after{content:none!important;animation:none!important}\n.cta-aurora{\n  position:absolute;z-index:0;inset:0;\n  background:radial-gradient(48% 62% at 22% 52%,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 70%);\n  animation:cta-breathe 9s ease-in-out infinite;\n  filter:none;\n}\n@keyframes cta-breathe{0%,100%{opacity:.55}50%{opacity:1}}\n.cta-ring,.cta-orbit{\n  position:absolute;top:50%;left:clamp(3rem,13vw,3rem);\n  width:min(340px,30vw);aspect-ratio:1;margin:0;\n  transform:translate(-50%,-50%);\n}\n.cta-ring{border:1px solid rgba(255,255,255,.34);border-radius:50%}\n.cta-ring::after{\n  position:absolute;inset:14%;border:1px solid rgba(255,255,255,.16);border-radius:50%;content:\"\";\n}\n.cta-orbit{animation:cta-orbit 14s linear infinite}\n.cta-orbit>b{\n  position:absolute;top:-5px;left:50%;\n  width:10px;height:10px;margin-left:-5px;border-radius:50%;\n  background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.22),0 0 18px 4px rgba(255,255,255,.5);\n}\n@keyframes cta-orbit{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}\n@media(prefers-reduced-motion:reduce){.cta-orbit,.cta-aurora{animation:none}}\n@media(max-width:900px){.cta-ring,.cta-orbit{width:min(240px,52vw);left:clamp(2.25rem,22vw,3rem)}}\n\n/* ================= Reports rows ================= */\n/* The hover moves the content, not the box — the text column keeps the same\n   width at rest and on hover, so no description can re-wrap and shift the\n   column. Pattern stays on two lines either way. */\n.feature-rows li:hover{padding-left:0}\n.feature-rows li>span,.feature-rows li>div{transition:transform .22s ease}\n.feature-rows li:hover>span,.feature-rows li:hover>div{transform:translateX(10px)}\n\n/* ================= Reports rows ================= */\n.reports-section .feature-rows li p{\n  /* short enough that the shortest description still takes two lines, wide\n     enough that the longest never takes three */\n  max-width:44ch;\n  min-height:calc(2 * 1.55em);\n  margin-bottom:0;line-height:1.55;\n}\n@media(max-width:1180px){.reports-section .feature-rows li p{max-width:40ch}}\n@media(max-width:980px){.reports-section .feature-rows li p{max-width:none}}\n\n/* ================= TruPulse assistant ================= */\n/* Built from the site's own tokens: the violet, the display and body faces,\n   the same radii and shadow language as the cards. */\n.chat-dock{\n  position:fixed;z-index:150;right:28px;bottom:28px;\n  display:flex;flex-direction:column;align-items:flex-end;gap:14px;\n  font-family:var(--body);\n}\n\n/* ---- launcher ---- */\n.chat-launch{\n  --bubble-dot:#fff;\n  position:relative;display:grid;width:62px;height:62px;place-items:center;\n  border:0;border-radius:50%;cursor:pointer;color:#fff;\n  background:linear-gradient(140deg,#7f78ff 0%,#675ffc 48%,#4b43e7 100%);\n  box-shadow:0 14px 34px rgba(75, 67, 231,.42);\n  transition:transform .22s cubic-bezier(.3,1.3,.5,1),box-shadow .22s ease;\n}\n.chat-launch:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 20px 44px rgba(75, 67, 231,.5)}\n.chat-launch:focus-visible{outline:3px solid rgba(103, 95, 252,.5);outline-offset:3px}\n.chat-launch .ico-bubble{width:30px;height:30px;display:block}\n.chat-launch-face,.chat-launch-down{grid-area:1/1;display:grid;place-items:center;transition:opacity .2s ease,transform .3s cubic-bezier(.3,1.3,.5,1)}\n.chat-launch-down svg{width:26px;height:26px;display:block}\n.chat-launch-down{opacity:0;transform:rotate(-90deg) scale(.6)}\n.chat-launch[aria-expanded=\"true\"] .chat-launch-face{opacity:0;transform:rotate(90deg) scale(.6)}\n.chat-launch[aria-expanded=\"true\"] .chat-launch-down{opacity:1;transform:none}\n/* An animation's own opacity beats a plain declaration, so the animation has to\n   stop as well — otherwise the hand still waved over the open panel. */\n.chat-launch[aria-expanded=\"true\"] .chat-ring,\n.chat-launch[aria-expanded=\"true\"] .chat-launch-hand{opacity:0;transform:scale(.6);animation:none}\n/* the little wave, and the ring of type around it — the playful part */\n/* The hand is not a permanent fixture: once a minute it rises out of the\n   bubble, waves hello, and shrinks back into it. The retract translates down\n   and right — toward the middle of the bubble — so it reads as going back in\n   rather than simply fading. */\n.chat-launch-hand{\n  position:absolute;top:-7px;left:-11px;\n  font-size:1.125rem;line-height:1;pointer-events:none;\n  transform-origin:75% 85%;\n  opacity:0;\n  animation:chat-hand 60s ease-in-out infinite;\n  transition:opacity .2s ease,transform .3s ease;\n}\n@keyframes chat-hand{\n  0%,100%{opacity:0;transform:translate(15px,15px) scale(.2) rotate(0deg)}\n  1.6%{opacity:1;transform:translate(0,0) scale(1) rotate(0deg)}\n  2.6%{opacity:1;transform:translate(0,0) scale(1) rotate(20deg)}\n  3.4%{opacity:1;transform:translate(0,0) scale(1) rotate(-14deg)}\n  4.2%{opacity:1;transform:translate(0,0) scale(1) rotate(17deg)}\n  5%{opacity:1;transform:translate(0,0) scale(1) rotate(-9deg)}\n  5.8%{opacity:1;transform:translate(0,0) scale(1) rotate(0deg)}\n  7.4%{opacity:0;transform:translate(15px,15px) scale(.2) rotate(0deg)}\n}\n/* the same gesture inside the panel's greeting, on its own short loop */\n@keyframes chat-wave{0%,72%,100%{transform:rotate(0)}78%{transform:rotate(16deg)}84%{transform:rotate(-10deg)}90%{transform:rotate(12deg)}}\n.chat-ring{\n  position:absolute;inset:-19px;width:calc(100% + 38px);height:calc(100% + 38px);\n  pointer-events:none;animation:chat-spin 18s linear infinite;\n  transition:opacity .2s ease,transform .3s ease;\n}\n/* 11 viewBox units on a 120-unit box drawn at 100px is ~9.2 real px — two more\n   than before, without the ring growing past the launcher's own footprint.\n   textLength runs the words the exact circumference of the circle, so the line\n   closes on itself instead of leaving a gap at the top. */\n.chat-ring text{\n  fill:var(--violet);font-family:var(--body);font-size:.75rem;font-weight:700;\n  text-transform:uppercase;\n}\n@keyframes chat-spin{to{transform:rotate(360deg)}}\n@media(prefers-reduced-motion:reduce){.chat-ring,.chat-launch-hand{animation:none}}\n\n/* ---- panel ---- */\n.chat-panel{\n  display:flex;width:min(376px,calc(100vw - 40px));height:min(596px,calc(100vh - 132px));\n  flex-direction:column;overflow:hidden;\n  border:1px solid rgba(103, 95, 252,.2);border-radius:24px;background:#fff;\n  box-shadow:0 34px 90px rgba(29, 24, 122,.28);\n  animation:chat-in .3s cubic-bezier(.2,1,.3,1) both;\n}\n.chat-panel[hidden]{display:none!important}\n@keyframes chat-in{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}\n@media(prefers-reduced-motion:reduce){.chat-panel{animation:none}}\n\n/* ---- header ---- */\n.chat-head{\n  position:relative;display:flex;gap:11px;align-items:center;padding:15px 14px;\n  background:linear-gradient(122deg,#4b43e7 0%,#675ffc 58%,#7f78ff 100%);color:#fff;\n}\n.chat-avatar{\n  --bubble-dot:#675ffc;\n  display:grid;width:36px;height:36px;flex:0 0 auto;place-items:center;\n  border-radius:12px;background:#fff;color:#675ffc;box-shadow:0 6px 16px rgba(29, 24, 122,.26);\n}\n.chat-avatar .ico-bubble{width:23px;height:23px;display:block}\n.chat-id{display:flex;min-width:0;flex-direction:column;line-height:1.3}\n.chat-id strong{font-family:var(--display);font-size:.875rem;letter-spacing:-.01em}\n.chat-id small{display:flex;gap:6px;align-items:center;color:rgba(255,255,255,.84);font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.chat-dot{width:7px;height:7px;flex:0 0 auto;border-radius:50%;background:#4ade9b;box-shadow:0 0 0 3px rgba(74,222,155,.24)}\n.chat-head-actions{display:flex;gap:4px;margin-left:auto}\n.chat-icon{\n  display:grid;width:32px;height:32px;flex:0 0 auto;place-items:center;padding:0;\n  border:1px solid rgba(255,255,255,.3);border-radius:50%;\n  background:rgba(255,255,255,.14);color:#fff;cursor:pointer;\n  transition:background .18s ease,transform .18s ease,border-color .18s ease;\n}\n.chat-icon svg{width:17px;height:17px;display:block}\n/* display:grid would otherwise beat the user agent's [hidden] rule, and the\n   back arrow would sit on the home view where there is nothing to go back to. */\n.chat-icon[hidden]{display:none!important}\n.chat-icon:hover{background:rgba(255,255,255,.32);border-color:rgba(255,255,255,.58)}\n.chat-icon:focus-visible{outline:2px solid #fff;outline-offset:2px}\n.chat-back{margin-right:-3px}\n[data-chat-close]:hover{transform:rotate(90deg)}\n\n/* the conversation menu */\n.chat-menu{\n  position:absolute;z-index:3;top:56px;right:12px;\n  display:grid;min-width:210px;padding:6px;\n  border:1px solid var(--line);border-radius:14px;background:#fff;\n  box-shadow:0 18px 40px rgba(17, 15, 53,.18);\n}\n.chat-menu[hidden]{display:none!important}\n.chat-menu button{\n  padding:9px 11px;border:0;border-radius:9px;background:none;\n  color:var(--ink);font:inherit;font-size:.75rem;text-align:left;cursor:pointer;\n}\n.chat-menu button:hover{background:var(--lilac);color:var(--violet)}\n\n/* ---- body and views ---- */\n.chat-body{position:relative;flex:1;min-height:0;background:linear-gradient(180deg,#f5f4ff 0%,#ebeaff 100%)}\n.chat-view{\n  position:absolute;inset:0;display:none;flex-direction:column;\n  padding:16px;overflow-y:auto;\n}\n.chat-view.is-on{display:flex;animation:chat-view-in .26s ease both}\n@keyframes chat-view-in{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}\n.chat-view[data-view=\"chat\"]{padding:0}\n@media(prefers-reduced-motion:reduce){.chat-view.is-on{animation:none}}\n\n/* ---- home ---- */\n.chat-greet{padding:6px 4px 14px}\n.chat-hi{margin:0;font-family:var(--display);font-size:1.5rem;font-weight:800;letter-spacing:-.028em;color:var(--ink)}\n.chat-wave{display:inline-block;transform-origin:70% 80%;animation:chat-wave 3.4s ease-in-out infinite}\n.chat-greet-sub{margin:8px 0 0;color:var(--muted);font-size:.875rem;line-height:1.5}\n.chat-card{\n  display:block;width:100%;margin-bottom:12px;padding:14px;\n  border:1px solid rgba(103, 95, 252,.2);border-radius:16px;background:#fff;\n  box-shadow:0 6px 18px rgba(29, 24, 122,.06);text-align:left;\n}\n.chat-card>strong{display:block;margin-bottom:10px;font-family:var(--display);font-size:.875rem;color:var(--ink)}\n.chat-card-btn{\n  display:flex;gap:12px;align-items:center;cursor:pointer;font:inherit;\n  transition:transform .2s cubic-bezier(.3,1.2,.5,1),box-shadow .2s ease,border-color .2s ease;\n}\n.chat-card-btn span{display:flex;flex-direction:column;gap:3px}\n.chat-card-btn strong{font-family:var(--display);font-size:.875rem;color:var(--ink)}\n.chat-card-btn small{color:var(--muted);font-size:.75rem}\n.chat-card-btn i{\n  display:grid;width:34px;height:34px;flex:0 0 auto;place-items:center;margin-left:auto;\n  border-radius:50%;background:var(--lilac);color:var(--violet);\n  transition:background .2s ease,color .2s ease,transform .2s ease;\n}\n.chat-card-btn i svg{width:17px;height:17px}\n.chat-card-btn:hover{transform:translateY(-2px);border-color:rgba(103, 95, 252,.45);box-shadow:0 14px 30px rgba(29, 24, 122,.12)}\n.chat-card-btn:hover i{background:var(--violet);color:#fff;transform:translateX(2px)}\n\n.chat-search{position:relative;display:flex;align-items:center}\n.chat-search svg{position:absolute;left:11px;width:16px;height:16px;color:var(--muted);pointer-events:none}\n.chat-search input{\n  width:100%;min-height:40px;padding:0 12px 0 34px;\n  border:1px solid rgba(103, 95, 252,.24);border-radius:10px;background:#fafaff;\n  font:inherit;font-size:.75rem;color:var(--ink);outline:0;\n}\n.chat-search input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(103, 95, 252,.14)}\n.chat-results{margin:0;padding:0;list-style:none}\n.chat-results:not(:empty){margin-top:10px;border-top:1px solid rgba(103, 95, 252,.14);padding-top:8px}\n.chat-results button{\n  display:flex;gap:8px;width:100%;align-items:center;padding:8px 6px;\n  border:0;border-radius:9px;background:none;color:var(--ink-2);\n  font:inherit;font-size:.75rem;line-height:1.4;text-align:left;cursor:pointer;\n}\n.chat-results button:hover{background:var(--lilac);color:var(--violet)}\n.chat-results button svg{width:15px;height:15px;flex:0 0 auto;margin-left:auto;opacity:.5}\n.chat-no-hit{padding:10px 6px;color:var(--muted);font-size:.75rem}\n\n/* ---- conversation ---- */\n.chat-log{display:flex;flex:1;flex-direction:column;gap:11px;padding:16px;overflow-y:auto}\n.chat-who{margin:2px 0 -6px 40px;color:var(--muted);font-size:.75rem;font-weight:700}\n.chat-row{display:flex;gap:8px;align-items:flex-end}\n.chat-row .chat-face{\n  --bubble-dot:#fff;\n  display:grid;width:30px;height:30px;flex:0 0 auto;place-items:center;\n  border-radius:10px;background:linear-gradient(140deg,#7f78ff,#4b43e7);color:#fff;\n}\n.chat-row .chat-face svg{width:18px;height:18px}\n.chat-msg{max-width:80%;margin:0;padding:11px 14px;border-radius:15px;font-size:.875rem;line-height:1.5}\n.chat-msg.bot{border-bottom-left-radius:5px;background:#fff;border:1px solid rgba(103, 95, 252,.18);color:var(--ink-2);box-shadow:0 4px 14px rgba(45, 40, 154,.06)}\n.chat-msg.me{align-self:flex-end;border-bottom-right-radius:5px;background:linear-gradient(135deg,#675ffc,#4b43e7);color:#fff;box-shadow:0 6px 18px rgba(75, 67, 231,.3)}\n.chat-msg{animation:chat-pop .3s cubic-bezier(.2,1.3,.4,1) both}\n@keyframes chat-pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}\n@media(prefers-reduced-motion:reduce){.chat-msg{animation:none}}\n.chat-chips{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px;margin-left:auto}\n.chat-chips button{\n  padding:8px 13px;border:1px solid rgba(103, 95, 252,.34);border-radius:999px;background:#fff;\n  color:var(--violet);font:inherit;font-size:.75rem;font-weight:700;cursor:pointer;\n  transition:background .18s ease,color .18s ease,transform .18s ease;\n}\n.chat-chips button:hover{background:var(--violet);color:#fff;transform:translateY(-1px)}\n.chat-typing{display:flex;gap:5px;align-items:center;width:auto;max-width:none;align-self:flex-start;padding:13px 15px}\n.chat-typing i{width:7px;height:7px;border-radius:50%;background:#7f78ff;animation:chat-bounce 1.1s infinite ease-in-out}\n.chat-typing i:nth-child(2){animation-delay:.16s}\n.chat-typing i:nth-child(3){animation-delay:.32s}\n@keyframes chat-bounce{0%,80%,100%{transform:translateY(0);opacity:.45}40%{transform:translateY(-5px);opacity:1}}\n@media(prefers-reduced-motion:reduce){.chat-typing i{animation:none}}\n\n.chat-form{display:flex;gap:6px;align-items:center;padding:11px;border-top:1px solid rgba(103, 95, 252,.16);background:#fafaff}\n.chat-form input{\n  flex:1;min-width:0;min-height:42px;padding:0 14px;\n  border:1px solid rgba(103, 95, 252,.24);border-radius:999px;background:#fff;\n  font:inherit;font-size:.875rem;outline:0;\n}\n.chat-form input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(103, 95, 252,.13)}\n.chat-form .chat-icon{border-color:rgba(103, 95, 252,.24);background:#fff;color:var(--muted);width:38px;height:38px}\n.chat-form .chat-icon:hover{background:var(--lilac);color:var(--violet);border-color:rgba(103, 95, 252,.4)}\n.chat-send{\n  display:grid;width:42px;height:42px;flex:0 0 auto;place-items:center;\n  border:0;border-radius:50%;background:linear-gradient(140deg,#675ffc,#4b43e7);color:#fff;cursor:pointer;\n  transition:opacity .18s ease,transform .18s ease;\n}\n.chat-send svg{width:18px;height:18px}\n.chat-send:disabled{opacity:.35;cursor:default}\n.chat-send:not(:disabled):hover{transform:translateX(2px) scale(1.05)}\n\n/* emoji picker */\n.chat-picker{\n  position:absolute;z-index:2;right:11px;bottom:66px;left:11px;\n  padding:10px;border:1px solid rgba(103, 95, 252,.2);border-radius:16px;background:#fff;\n  box-shadow:0 20px 44px rgba(29, 24, 122,.2);\n}\n.chat-picker[hidden]{display:none!important}\n.chat-emoji-grid{display:grid;max-height:150px;grid-template-columns:repeat(8,1fr);gap:2px;margin-top:8px;overflow-y:auto}\n.chat-emoji-grid button{\n  padding:5px 0;border:0;border-radius:8px;background:none;font-size:1.125rem;line-height:1.4;cursor:pointer;\n}\n.chat-emoji-grid button:hover{background:var(--lilac)}\n\n/* ---- messages ---- */\n.chat-section-title{margin:6px 4px 10px;font-family:var(--display);font-size:.875rem;font-weight:800;color:var(--ink)}\n.chat-threads{margin:0;padding:0;list-style:none}\n.chat-threads button{\n  display:flex;gap:10px;width:100%;align-items:center;margin-bottom:8px;padding:12px 13px;\n  border:1px solid rgba(103, 95, 252,.18);border-radius:14px;background:#fff;\n  font:inherit;text-align:left;cursor:pointer;\n  transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;\n}\n.chat-threads button:hover{transform:translateY(-2px);border-color:rgba(103, 95, 252,.42);box-shadow:0 12px 26px rgba(29, 24, 122,.1)}\n.chat-threads span{display:flex;min-width:0;flex-direction:column;gap:3px}\n.chat-threads strong{font-family:var(--display);font-size:.75rem;color:var(--ink)}\n.chat-threads small{color:var(--muted);font-size:.75rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.chat-threads em{margin-left:auto;color:var(--muted);font-size:.75rem;font-style:normal;white-space:nowrap}\n.chat-threads svg{width:15px;height:15px;flex:0 0 auto;color:var(--violet);opacity:.6}\n.chat-empty{margin:0 4px;color:var(--muted);font-size:.75rem}\n.chat-empty[hidden]{display:none!important}\n\n/* ---- tabs ---- */\n.chat-tabs{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid rgba(103, 95, 252,.16);background:#fff}\n.chat-tabs button{\n  display:flex;flex-direction:column;gap:3px;align-items:center;padding:9px 0 10px;\n  border:0;border-top:2px solid transparent;background:none;\n  color:var(--muted);font:inherit;font-family:var(--body);font-size:.75rem;font-weight:700;\n  letter-spacing:.06em;text-transform:uppercase;cursor:pointer;\n  transition:color .18s ease,border-color .18s ease;\n}\n.chat-tabs button svg{width:19px;height:19px}\n.chat-tabs button:hover{color:var(--violet)}\n.chat-tabs button.is-on{color:var(--violet);border-top-color:var(--violet)}\n\n/* ---- media a reply can carry ---- */\n.chat-msg.chat-media{max-width:88%;padding:6px;background:#fff;border:1px solid rgba(103, 95, 252,.18)}\n.chat-media img,.chat-media video{\n  display:block;width:100%;height:auto;max-height:210px;object-fit:contain;\n  border-radius:10px;background:#f4f3ff;\n}\n.chat-media .chat-media-caption{display:block;padding:8px 8px 4px;color:var(--muted);font-size:.75rem;line-height:1.45}\n\n@media(max-width:680px){\n  .chat-dock{right:16px;bottom:16px}\n  .chat-launch{width:56px;height:56px}\n  .chat-panel{width:calc(100vw - 32px);height:min(560px,calc(100vh - 116px))}\n}\n\n/* ================= Icons centre in their own backgrounds ================= */\n/* A glyph in a round background was being positioned by its text baseline, so\n   most of them sat a pixel or two low. Applied once, for every such control on\n   every page, rather than nudged case by case. */\n.icon-btn,.faq-list summary::after,.chat-icon,.chat-send,.chat-card-btn i,\n.chat-avatar,.chat-launch,.video-slot-play,.modal-close,.chat-face,\n.trust-rows li>span,.feature-rows li>span,.flow-card::before,.bc-media-tile{\n  display:grid;place-items:center;place-content:center;\n  line-height:1;text-align:center;\n}\n.icon-btn>svg,.chat-icon>svg,.chat-send>svg,.chat-card-btn i>svg,.modal-close>svg{display:block}\n.faq-list summary::after{line-height:1;padding-bottom:1px}\n\n/* ================= Phones ================= */\n@media(max-width:680px){\n  /* 24px down both edges, on every page, for every block that uses the shell */\n  :root{--page-gutter:24px}\n  .shell,.article-banner-text,.legal-body,.login-card{\n    width:min(1280px,calc(100% - (var(--page-gutter) * 2)));\n    margin-inline:auto;\n  }\n\n  /* one rhythm between sections instead of desktop's tall breathing room */\n  .section,.trust-section,.workspace-section,.reports-section{padding:24px 0}\n  .hero{min-height:0;padding:96px 0 24px}\n  .final-cta{padding:28px 0}\n  .trust-strip{padding:12px 0}\n  .section-head{margin-bottom:18px}\n  .section-cta{margin-top:20px}\n\n  /* type and controls, scaled for the hand */\n  :root{\n    --step-hero:clamp(2.25rem,9.6vw,2.25rem);\n    --step-h2:clamp(1.125rem,5.6vw,1.5rem);\n    --step-h3:clamp(1.125rem,4.6vw,1.125rem);\n    --step-lead:.875rem;\n    --step-body:.875rem;\n    --step-small:.75rem;\n  }\n  h2{font-size:var(--step-h2);line-height:1.2}\n  .section-head>p,.hero .lead{font-size:var(--step-lead);line-height:1.55}\n  .btn{min-height:46px;padding:0 18px;font-size:.875rem}\n  .btn.primary,.btn.outline,.btn.light{width:100%;justify-cont
